  - id: '7'
    marker: '7'
    title: Backoffice and multi-node integration
    state:
      label: PLANNED
      tone: muted
    meta:
    - end 05 Apr 2027
    - 'TOTAL: orig ~7d · forecast ~9d'
    sections:
    - heading: RESULT
      bullets:
      - Multiple TimingNodes keep independent state and ordered data streams.
      - Reference data can be received and used for local derived timing.
      - Local registration continues through a backoffice outage and synchronisation
        can resume.
    - heading: DEMO
      bullets:
      - Start a small multi-node SI-01 test setup and load reference/start-time data.
      - Feed simulated registrations and inspect node-specific derived timing and
        outbound data.
      - Interrupt the backoffice service, continue local work, reconnect and reconcile.
    badge_heading: DOCUMENT STATUS
