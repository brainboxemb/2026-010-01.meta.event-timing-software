  - id: '5'
    marker: '5'
    title: Simulated antenna input and runtime behaviour
    state:
      label: PLANNED
      tone: muted
    meta:
    - end 30 Nov 2026
    - 'TOTAL: orig ~6d · forecast ~6d'
    sections:
    - heading: RESULT
      bullets:
      - Simulated antenna observations reach the normal registration path.
      - Sustained input can be measured without bypassing TimingNode ownership.
      - Restart/recovery works with the same simulated input path used by automated
        tests.
    - heading: DEMO
      bullets:
      - Open one TimingNode and feed repeatable tag observations through SimulatedAntenna.
      - Show which observations become committed registrations and inspect the runtime
        counters.
      - Restart SI-01 and continue using the same simulated input configuration.
    badge_heading: DOCUMENT STATUS
    badges:
