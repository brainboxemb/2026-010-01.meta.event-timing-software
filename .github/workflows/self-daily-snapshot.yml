name: Daily snapshot

# Purpose: create an immutable lightweight daily repository snapshot tag.
# Scope: repository self-entry workflow; not a reusable workflow API.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to snapshot
        required: true
        default: main
        type: string
      note:
        description: Optional annotation text
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'snapshot-request/**'
    paths:
      - '.snapshot-request'

permissions:
  contents: write

concurrency:
  group: daily-snapshot-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate snapshot credential
        shell: bash
        env:
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SNAPSHOT_TOKEN}" ]]; then
            echo "::error::Repository secret SNAPSHOT_TOKEN is required for daily snapshot tags."
            echo "::error::It must have repository Contents write and Workflows write permission."
            exit 1
          fi

      - name: Checkout request context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SNAPSHOT_TOKEN }}

      - name: Create next daily snapshot tag
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            target_ref="${DISPATCH_REF}"
            note="${DISPATCH_NOTE}"
          else
            if [[ ! -f .snapshot-request ]]; then
              echo "::error::snapshot-request/** pushes must contain .snapshot-request"
              exit 1
            fi

            target_ref="$(sed -n '1p' .snapshot-request | tr -d '\r')"
            note="$(tail -n +2 .snapshot-request | tr -d '\r')"
          fi

          if [[ -z "${target_ref}" ]]; then
            echo "::error::Snapshot target ref/SHA is empty"
            exit 1
          fi

          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          if target_sha="$(git rev-parse --verify "${target_ref}^{commit}" 2>/dev/null)"; then
            :
          elif target_sha="$(git rev-parse --verify "origin/${target_ref}^{commit}" 2>/dev/null)"; then
            :
          else
            echo "::error::Snapshot target '${target_ref}' does not resolve to a commit in this repository"
            exit 1
          fi

          day="$(TZ=Europe/Amsterdam date +%Y%m%d)"
          base="daily/${day}"
          tag="${base}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            index=1
            while :; do
              printf -v tag '%s-%02d' "${base}" "${index}"
              if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                break
              fi
              index=$((index + 1))
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "${note}" ]]; then
            note="Daily snapshot ${day}"
          fi

          git tag -a "${tag}" "${target_sha}" -m "${note}"
          git push origin "refs/tags/${tag}"

          {
            echo "### Daily snapshot created"
            echo
            echo "- Tag: \`${tag}\`"
            echo "- Requested target: \`${target_ref}\`"
            echo "- Commit: \`${target_sha}\`"
            echo "- Date basis: \`Europe/Amsterdam\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == snapshot-request/* ]]; then
            git push origin --delete "${GITHUB_REF_NAME}" ||               echo "::warning::Snapshot created, but request branch cleanup failed"
          fi
