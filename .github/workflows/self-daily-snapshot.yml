name: Daily snapshot

# Purpose: create an immutable lightweight daily snapshot of current main.
# Scope: repository self-entry workflow; not a reusable workflow API.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional annotation text
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'snapshot-request/**'
    paths:
      - '.snapshot-request'

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout request context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create next daily snapshot tag
        shell: bash
        env:
          DISPATCH_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            note="${DISPATCH_NOTE}"
          else
            if [[ ! -f .snapshot-request ]]; then
              echo "::error::snapshot-request/** pushes must contain .snapshot-request"
              exit 1
            fi
            note="$(cat .snapshot-request | tr -d '\r')"
          fi

          git fetch --force --tags origin main

          target_sha="$(git rev-parse origin/main)"
          day="$(TZ=Europe/Amsterdam date +%Y%m%d)"
          base="daily/${day}"
          tag="${base}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            index=1
            while :; do
              printf -v tag '%s-%02d' "${base}" "${index}"
              if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                break
              fi
              index=$((index + 1))
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "${note}" ]]; then
            note="Daily snapshot ${day}"
          fi

          git tag -a "${tag}" "${target_sha}" -m "${note}"
          git push origin "refs/tags/${tag}"

          {
            echo "### Daily snapshot created"
            echo
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${target_sha}\`"
            echo "- Branch: \`main\`"
            echo "- Date basis: \`Europe/Amsterdam\`"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == snapshot-request/* ]]; then
            git push origin --delete "${GITHUB_REF_NAME}" ||               echo "::warning::Snapshot created, but request branch cleanup failed"
          fi
