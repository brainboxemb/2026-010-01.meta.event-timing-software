name: Build software documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_documents.py'
      - '.github/workflows/docs-build.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_documents.py'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate architecture diagrams
        run: |
          python tools/generate_architecture_diagrams.py
          python tools/generate_timing_detail_diagrams.py
          python tools/generate_data_display_diagrams.py

      - name: Validate generated diagram XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = list(Path('bld/docs/architecture').glob('*.drawio'))
          paths += list(Path('bld/docs/architecture').glob('*.svg'))

          if not paths:
              raise SystemExit('No generated diagram files found')

          for path in paths:
              ET.parse(path)
          PY

      - name: Generate complete document set
        run: python tools/generate_documents.py

      - name: Validate generated documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('bld/docs/README.md'),
              Path('bld/docs/documents/README.md'),
              Path('bld/docs/documents/software-document-set.md'),
              Path('bld/docs/documents/architecture-book.md'),
              Path('bld/docs/documents/12-SDE-software-development-environment.md'),
              Path('bld/docs/documents/31-01-SAD-timing-application-architecture.md'),
              Path('bld/docs/documents/31-02-SAD-gui-application-architecture.md'),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing generated documentation: ' + ', '.join(missing))
          PY

      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: software-docs
          path: bld/docs
          retention-days: 14

      - name: Publish generated documentation branch
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: missing or invalid pull-request number" >&2
              exit 1
            fi
            TARGET_BRANCH="dev/pr-${PR_NUMBER}/docs"
          else
            TARGET_BRANCH="prod/docs"
          fi

          publish_dir="$(mktemp -d)"
          cp -a bld/docs/. "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials

          git switch --orphan generated-docs
          git clean -fdx

          cp -a "$publish_dir/." ./
          printf '%s\n' "$SOURCE_SHA" > source-sha.txt
          cat > build-info.md <<EOF
          # Build information

          Source commit: \`${SOURCE_SHA}\`

          Publication branch: \`${TARGET_BRANCH}\`
          EOF

          git add .
          git commit -m "Publish generated documentation for ${SOURCE_SHA}"
          git push --force origin "HEAD:${TARGET_BRANCH}"

          echo "Published generated documentation to ${TARGET_BRANCH}"
