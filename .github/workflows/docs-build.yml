name: Build software documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'project.yml'
      - '.gitmodules'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'moon.yml'
      - '.moon/**'
      - 'tools/tool.git-project'
      - 'tools/tool.eng-docs'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_system_model_diagrams.py'
      - 'tools/calculate_sip_actuals.py'
      - 'tools/generate_sip_planning.py'
      - 'tools/generate_sip_manager_roadmap.py'
      - 'tools/run_docs_task.py'
      - 'tools/render_needs_reader_markdown.py'
      - 'tools/generate_engineering_portal.py'
      - 'tools/validate_engineering_coverage.py'
      - 'tools/requirements-docs.txt'
      - '.github/workflows/docs-build.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'project.yml'
      - '.gitmodules'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'moon.yml'
      - '.moon/**'
      - 'tools/tool.git-project'
      - 'tools/tool.eng-docs'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_system_model_diagrams.py'
      - 'tools/calculate_sip_actuals.py'
      - 'tools/generate_sip_planning.py'
      - 'tools/generate_sip_manager_roadmap.py'
      - 'tools/run_docs_task.py'
      - 'tools/render_needs_reader_markdown.py'
      - 'tools/generate_engineering_portal.py'
      - 'tools/validate_engineering_coverage.py'
      - 'tools/requirements-docs.txt'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Moon affected/cache decisions need Git history, but blobless checkout avoids
      # downloading repository content that the task never opens.
      - name: Checkout exact revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap released repository and documentation tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "6806a2c8b15df2122c4cc3355d2df9bd11ba2fc8"
          test "$(git -C tools/tool.eng-docs rev-parse HEAD)" = "7d13ae32c5ac3ac3fea0192559a034b9778a517d"
          grep -F 'ref: v0.9.1' project.yml
          test -f tools/tool.git-project/schemas/execution-evidence.schema.json
          tools/tool.git-project/git-project.sh validate --repo "$PWD"
          tools/tool.git-project/moon-project.sh validate --repo "$PWD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation producer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/requirements-docs.txt
          python -m pip install --disable-pip-version-check -r docs/_sphinx-needs/requirements.txt
          python -m pip install --disable-pip-version-check -r docs/_portal/requirements.txt
          python -m pip install --disable-pip-version-check ./tools/tool.eng-docs

      - name: Validate current SDD references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '40-01-SISD-timing-application-specification-document\.md|40-02-SISD-gui-application-specification-document\.md|40-01-SDD-01-data-and-display-design\.md|40-01-SDD-02-java-component-design\.md|40-01-SDD-03-backoffice-transport-design\.md|40-01-01-SSD-timing-application-specification-document\.md|40-02-01-SSD-gui-application-specification-document\.md|30-01-UC-system-use-cases\.md|30-02-SSSD-software-system-specification-document\.md|30-03-IDD-03-application-control-status\.md|30-03-IDD-11-application-configuration\.md|41-01-SDD-data-and-display-design\.md|41-02-SDD-java-component-design\.md|41-03-SDD-backoffice-transport-design\.md|00-01-brainstorm\.md|00-02-handoff\.md|00-03-agent-plan\.md|00-04-domain-baseline\.md|10-01-SDP-software-development-plan\.md|10-02-SIP-software-implementation-planning\.md|11-SIP-software-implementation-planning\.md|20-01-EXT-external-system-inputs\.md|40-01-SSD-timing-application-specification-document\.md|40-02-SSD-gui-application-specification-document\.md|41-01-SDD-01-data-and-display-design\.md|41-01-SDD-02-java-component-design\.md|41-01-SDD-03-backoffice-transport-design\.md|50-01-SDE-software-development-environment\.md|50-02-SDE-java-build-test-toolchain\.md|32-IDD-03-application-control-status\.md|33-IDD-11-application-configuration\.md|32-03-IDD-application-control-status\.md|32-05-IDD-timingdata-interchange\.md|32-11-IDD-application-configuration\.md|50-SDE-software-development-environment\.md|51-SDE-java-build-test-toolchain\.md|60-01-SVP-software-verification-plan\.md' docs tools README.md CHANGELOG.md

      - name: Validate SIP actuals tool
        shell: bash
        run: |
          set -euo pipefail
          python tools/calculate_sip_actuals.py --help >/dev/null

      # Moon owns only the high-level execute/hydrate decision. The existing
      # project-specific diagram/planning scripts and released eng-docs assembler
      # remain authoritative for how their outputs are produced.
      - name: Run or hydrate documentation task graph
        uses: brainboxemb/tool.git-project/moon@v0.2.4
        with:
          task: software:docs.assemble
          cache-namespace: event-timing-software-docs

      - name: Build native MyST/Sphinx-Needs traceability
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bld/sphinx-needs
          mkdir -p \
            bld/sphinx-needs/source/docs/architecture-assets \
            bld/sphinx-needs/diagrams

          cp docs/_sphinx-needs/conf.py bld/sphinx-needs/source/conf.py
          cp docs/_sphinx-needs/schemas.json bld/sphinx-needs/source/schemas.json
          cp docs/30-UC-system-use-cases.md bld/sphinx-needs/source/docs/
          cp docs/41-01-SSD-timing-application-specification-document.md bld/sphinx-needs/source/docs/
          cp docs/32-03-ISD-application-control-status.md bld/sphinx-needs/source/docs/
          cp docs/32-04-ISD-web-interface.md bld/sphinx-needs/source/docs/
          cp docs/32-05-ISD-timingdata-interchange.md bld/sphinx-needs/source/docs/
          cp docs/33-05-IDD-timingdata-interchange.md bld/sphinx-needs/source/docs/
          cp docs/61-01-VTS-timing-application-verification-test-specification.md bld/sphinx-needs/source/docs/
          cp docs/_diagrams/layered-architecture.yaml bld/sphinx-needs/diagrams/
          cp -L bld/docs/assets/architecture/*.svg bld/sphinx-needs/source/docs/architecture-assets/

          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("bld/sphinx-needs/source/docs").glob("*.md"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"(?:\.\./)+raw/prod/docs/assets/architecture/",
                  "architecture-assets/",
                  text,
              )
              path.write_text(text, encoding="utf-8")
          PY

          cat > bld/sphinx-needs/source/index.md <<'EOF'
          # Migration 013 engineering traceability

          ~~~{toctree}
          :maxdepth: 2

          docs/30-UC-system-use-cases
          docs/41-01-SSD-timing-application-specification-document
          docs/32-03-ISD-application-control-status
          docs/32-04-ISD-web-interface
          docs/32-05-ISD-timingdata-interchange
          docs/33-05-IDD-timingdata-interchange
          docs/61-01-VTS-timing-application-verification-test-specification
          ~~~
          EOF

          sphinx-build -W --keep-going -b needs \
            bld/sphinx-needs/source \
            bld/sphinx-needs/needs

          sphinx-build -W --keep-going -b html \
            bld/sphinx-needs/source \
            bld/sphinx-needs/html

      - name: Verify native Sphinx reader layout
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F 'needs_layout_engineering_reader' bld/sphinx-needs/html/docs >/dev/null
          grep -R -F 'id="target__hide__meta"' bld/sphinx-needs/html/docs >/dev/null

      - name: Normalize engineering traceability
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          eng-docs graph \
            --needs bld/sphinx-needs/needs/needs.json \
            --relation derived_from \
            --relation satisfies \
            --relation verifies \
            --diagrams bld/sphinx-needs/diagrams \
            --source-revision "$SOURCE_REVISION" \
            --out bld/engineering-graph.json \
            --review bld/engineering-graph-review.md

      - name: Validate full-project engineering coverage
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_engineering_coverage.py \
            --needs bld/sphinx-needs/needs/needs.json \
            --graph bld/engineering-graph.json

      - name: Generate engineering portal
        shell: bash
        run: |
          set -euo pipefail
          publication_branch="prod/docs"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            publication_branch="dev/pr-${{ github.event.pull_request.number }}/docs"
          fi

          rm -rf bld/engineering-portal
          python tools/generate_engineering_portal.py \
            --graph bld/engineering-graph.json \
            --architecture bld/docs/assets/architecture/layered-architecture.svg \
            --output bld/engineering-portal/docs \
            --assets docs/_portal/assets \
            --repository brainboxemb/2026-010-01.meta.event-timing-software \
            --publication-branch "$publication_branch" \
            --source-root . \
            --tool-ref v0.9.1 \
            --tool-sha 7d13ae32c5ac3ac3fea0192559a034b9778a517d

          mkdocs build --strict --config-file docs/_portal/mkdocs.yml

      - name: Verify engineering portal
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("bld/engineering-portal")
          site = root / "site"
          graph = json.loads(Path("bld/engineering-graph.json").read_text(encoding="utf-8"))
          provenance = json.loads(
              (root / "docs/assets/provenance.json").read_text(encoding="utf-8")
          )

          expected_ids = {item["id"] for item in graph["objects"]}
          objects = {item["id"]: item for item in graph["objects"]}

          ui_page = site / "engineering-client-ui" / "index.html"
          if not ui_page.is_file():
              raise SystemExit("engineering portal missing Engineering Client UI page")
          ui_html = ui_page.read_text(encoding="utf-8")
          for filename in (
              "engineering-client-timing-closed.svg",
              "engineering-client-timing-open.svg",
              "engineering-client-timing-reconnecting.svg",
          ):
              asset = root / "docs" / "assets" / "architecture" / filename
              if not asset.is_file():
                  raise SystemExit(f"engineering portal missing UI diagram asset: {filename}")
              if filename not in ui_html:
                  raise SystemExit(f"Engineering Client UI page does not reference {filename}")

          use_cases = {
              object_id: item
              for object_id, item in objects.items()
              if item.get("type") == "uc"
          }
          if len(use_cases) != 19:
              raise SystemExit(f"expected 19 current system use cases, got {len(use_cases)}")
          for object_id, item in sorted(use_cases.items()):
              content = item.get("content", "")
              for token in ("**Goal:**", "**Main flow:**"):
                  if token not in content:
                      raise SystemExit(
                          f"engineering graph missing full use-case narrative {object_id}: {token}"
                      )

              page = (site / "objects" / object_id / "index.html").read_text(
                  encoding="utf-8"
              )
              if "Main flow" not in page:
                  raise SystemExit(
                      f"portal object page missing use-case narrative {object_id}: Main flow"
                  )

          actual_pages = {
              path.parent.name for path in (site / "objects").glob("*/index.html")
          }
          if actual_pages != expected_ids:
              raise SystemExit("portal object-page set does not match engineering graph")

          if provenance["source_revision"] != os.environ["SOURCE_REVISION"]:
              raise SystemExit("portal source revision mismatch")
          if provenance["object_count"] != graph["object_count"]:
              raise SystemExit("portal object count does not match engineering graph")
          if provenance["relation_count"] != graph["relation_count"]:
              raise SystemExit("portal relation count does not match engineering graph")
          expected_tool_eng_docs = {
              "ref": "v0.9.1",
              "sha": "7d13ae32c5ac3ac3fea0192559a034b9778a517d",
          }
          if provenance["tool_eng_docs"] != expected_tool_eng_docs:
              raise SystemExit(
                  "portal tool provenance mismatch: "
                  f"actual={provenance['tool_eng_docs']!r} "
                  f"expected={expected_tool_eng_docs!r}"
              )

          required_diagram_ids = {
              object_id
              for object_id, item in objects.items()
              if item.get("diagram_refs")
          }
          if set(provenance["diagram_objects"]) != required_diagram_ids:
              raise SystemExit("portal clickable architecture identities do not match graph diagram references")

          portal_view = json.loads(
              (root / "docs/assets/engineering-graph.json").read_text(encoding="utf-8")
          )
          if portal_view.get("default_object") is not None:
              raise SystemExit("portal view still has an implicit default object")

          source_context = portal_view["objects"]["IF05-REQ-007"].get("source_context")
          if not source_context:
              raise SystemExit("portal view missing IF05-REQ-007 authored source context")
          if source_context.get("path") != "docs/32-05-ISD-timingdata-interchange.md":
              raise SystemExit("IF05-REQ-007 source context path mismatch")
          source_lines = "\n".join(line["text"] for line in source_context["lines"])
          if "Committed record immutability" not in source_lines:
              raise SystemExit("IF05-REQ-007 source context lost authored requirement heading")

          object_page = (
              site / "objects" / "IF05-REQ-007" / "index.html"
          ).read_text(encoding="utf-8")
          if "open object comparison workspace" not in object_page:
              raise SystemExit("IF05-REQ-007 object page missing comparison workspace action")

          explorer = (site / "explorer/index.html").read_text(encoding="utf-8")
          for object_id in required_diagram_ids:
              if f'data-engineering-id="{object_id}"' not in explorer:
                  raise SystemExit(
                      f"portal explorer missing architecture identity: {object_id}"
                  )
          if 'data-eng-detail' not in explorer or 'eng-explorer-workspace' not in explorer:
              raise SystemExit("Engineering Explorer page lost architecture + selected-object composition")
          if 'eng-explorer-title' not in explorer:
              raise SystemExit("Engineering Explorer missing compact workbench heading")
          if 'data-eng-workspace' in explorer:
              raise SystemExit("Engineering Explorer unexpectedly contains comparison workspace")
          if '<a href="../">Home</a>' not in explorer:
              raise SystemExit("Engineering Explorer missing neutral Home navigation")

          workspace_page = site / "workspace" / "index.html"
          if not workspace_page.is_file():
              raise SystemExit("engineering portal missing traceability comparison page")
          workspace = workspace_page.read_text(encoding="utf-8")
          if 'data-eng-root-detail' not in workspace or 'data-eng-compare-detail' not in workspace:
              raise SystemExit("traceability comparison page missing two-object workspace")
          if 'data-eng-object-tree' not in workspace:
              raise SystemExit("traceability comparison page missing ordered object tree")
          if 'data-eng-tree-search' not in workspace or 'data-eng-tree-type' not in workspace:
              raise SystemExit("traceability comparison page missing tree filters")
          if 'data-eng-tree-collapse-all' not in workspace:
              raise SystemExit("traceability comparison page missing Collapse all control")
          if 'data-workspace-root-id="IF05-REQ-007"' not in workspace:
              raise SystemExit("traceability object tree missing IF05-REQ-007")
          if '32-05-ISD-timingdata-interchange' not in workspace:
              raise SystemExit("traceability object tree lost source-document grouping")
          for section_label in (
              "Normal operation",
              "System, backoffice and recovery",
              "Status",
              "First registration operation",
          ):
              if section_label not in workspace:
                  raise SystemExit(
                      f"traceability object tree missing authored section: {section_label}"
                  )
          if 'data-tree-level="1"' not in workspace:
              raise SystemExit("traceability object tree missing nested heading levels")
          if workspace.count('data-eng-resizer=') != 2:
              raise SystemExit("traceability comparison page missing two pane resizers")
          if 'role="separator"' not in workspace:
              raise SystemExit("traceability pane resizers missing separator semantics")
          if 'md-nav__link eng-tree-group__toggle' in workspace:
              raise SystemExit("tree disclosure still depends on Material nav-link behavior")
          if 'data-engineering-id=' in workspace:
              raise SystemExit("traceability comparison page unexpectedly embeds architecture diagram")
          if '<a href="../">Home</a>' not in workspace:
              raise SystemExit("Traceability Comparison missing neutral Home navigation")

          explorer_js = (
              site / "assets" / "javascripts" / "explorer.js"
          ).read_text(encoding="utf-8")
          for behavior in (
              "engineering-traceability-pane-shares-v1",
              "pointerdown",
              "ArrowLeft",
              "ArrowRight",
              "localStorage",
          ):
              if behavior not in explorer_js:
                  raise SystemExit(
                      f"traceability pane resize behavior missing: {behavior}"
                  )

          search = (site / "search/search_index.json").read_text(encoding="utf-8")
          for object_id in ("TimingNode", "SI01-REQ-020", "VC-ST1-001", "UC-001", "UC-008", "UC-014"):
              if object_id not in search:
                  raise SystemExit(f"portal search index missing {object_id}")
          for narrative in (
              "The operator application connects to the registration system.",
              "SI-02 connects through the system-defined application-control/status interface.",
              "Settings describe several independently addressed",
          ):
              if narrative not in search:
                  raise SystemExit(
                      f"portal search index missing use-case narrative: {narrative}"
                  )

          if not (site / "index.html").is_file():
              raise SystemExit("portal landing page missing")
          PY

      - name: Exercise engineering portal workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory bld/engineering-portal/site \
            > bld/engineering-portal/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/explorer/"
          for _ in range(20):
              try:
                  urllib.request.urlopen(url, timeout=1).read(1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("engineering portal preview server did not become ready")
          PY

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --dump-dom \
            "http://127.0.0.1:8765/workspace/?object=IF05-REQ-007&compare=SI01-REQ-045" \
            > bld/engineering-portal/browser-workspace-IF05-REQ-007.html

          grep -q '<code>IF05-REQ-007</code>' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q '<code>SI01-REQ-045</code>' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Committed record immutability' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Reference TimingData representation support' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'A committed TimingData record shall not be modified or renumbered' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-compare-object-id="SI01-REQ-045"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Selected object' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Compared object' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'role="tree" data-eng-object-tree' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-tree-toggle' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'aria-expanded="true"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          ! grep -q '<details class="eng-tree-group"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-tree-search' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-tree-type' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-tree-count' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Requirement (22)' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-workspace-root-id="IF05-REQ-007"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'aria-current="true"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q '32-05-ISD-timingdata-interchange' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Normal operation' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'System, backoffice and recovery' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'Step-4 first-registration operation' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-resizer="tree-root"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'data-eng-resizer="root-compare"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          grep -q 'role="separator"' bld/engineering-portal/browser-workspace-IF05-REQ-007.html
          ! grep -q 'md-nav__link eng-tree-group__toggle' bld/engineering-portal/browser-workspace-IF05-REQ-007.html

          python - <<'PY'
          from pathlib import Path

          source = Path("bld/engineering-portal/site/workspace/index.html")
          target = Path(
              "bld/engineering-portal/site/workspace-interaction-test/index.html"
          )
          target.parent.mkdir(parents=True, exist_ok=True)
          html = source.read_text(encoding="utf-8")
          probe = r"""
          <script>
          window.addEventListener("load", () => {
            window.setTimeout(() => {
              const root = document.querySelector("[data-eng-workspace]");
              const collapsed = root && Array.from(
                root.querySelectorAll(
                  '[data-eng-tree-toggle][aria-expanded="false"]'
                )
              ).find((toggle) => {
                return (
                  getComputedStyle(toggle).display !== "none" &&
                  toggle.getClientRects().length > 0
                );
              });
              if (collapsed) {
                const group = collapsed.closest("[data-eng-tree-group]");
                const children = group && group.querySelector(
                  ":scope > .eng-tree-group__items"
                );
                const before = children
                  ? getComputedStyle(children).display
                  : "missing";
                collapsed.click();
                const afterOpen = children
                  ? getComputedStyle(children).display
                  : "missing";
                collapsed.click();
                const afterClose = children
                  ? getComputedStyle(children).display
                  : "missing";
                document.body.dataset.treeToggleInteraction =
                  before === "none" &&
                  afterOpen !== "none" &&
                  afterClose === "none" &&
                  collapsed.getAttribute("aria-expanded") === "false"
                    ? "passed"
                    : "failed";
              } else {
                document.body.dataset.treeToggleInteraction = "no-collapsed-node";
              }

              const customTree = root && root.querySelector(".eng-object-tree");
              document.body.dataset.treeMaterialIsolation =
                customTree &&
                !customTree.querySelector('[class*="md-nav"]')
                  ? "passed"
                  : "failed";

              const browser = root && root.querySelector(".eng-object-browser");
              const search = root && root.querySelector("[data-eng-tree-search]");
              const topToggle = root && root.querySelector(
                '[data-tree-level="0"] > [data-eng-tree-toggle]'
              );
              const visibleObject = root && Array.from(
                root.querySelectorAll("[data-workspace-root-id]")
              ).find((node) => node.getClientRects().length > 0);
              if (browser && search && topToggle && visibleObject) {
                const browserLeft = browser.getBoundingClientRect().left;
                const searchLeft = search.getBoundingClientRect().left;
                const topLeft = topToggle.getBoundingClientRect().left;
                const objectLabel = visibleObject.querySelector(
                  ".eng-tree-item__id"
                );
                const objectLeft = objectLabel
                  ? objectLabel.getBoundingClientRect().left
                  : Number.POSITIVE_INFINITY;
                const searchOffset = searchLeft - browserLeft;
                const topOffset = topLeft - browserLeft;
                const objectOffset = objectLeft - browserLeft;
                document.body.dataset.treeGeometry =
                  [
                    searchOffset.toFixed(1),
                    topOffset.toFixed(1),
                    objectOffset.toFixed(1)
                  ].join(",");
                document.body.dataset.treeEdgeSpacing =
                  Math.abs(searchOffset - 4) <= 1.5 &&
                  Math.abs(topOffset - 4) <= 1.5
                    ? "passed"
                    : "failed";
                document.body.dataset.treeIndentCompact =
                  objectOffset > topOffset &&
                  objectOffset <= 20
                    ? "passed"
                    : "failed";
              }

              const collapseAll = root && root.querySelector(
                "[data-eng-tree-collapse-all]"
              );
              if (collapseAll) {
                collapseAll.click();
                const expanded = root.querySelectorAll(
                  "[data-eng-tree-group].is-expanded"
                ).length;
                const ariaOpen = Array.from(
                  root.querySelectorAll("[data-eng-tree-toggle]")
                ).some((toggle) => toggle.getAttribute("aria-expanded") === "true");
                document.body.dataset.collapseAllInteraction =
                  expanded === 0 && !ariaOpen ? "passed" : "failed";

                const directChildren = (group) => {
                  const list = group.querySelector(
                    ":scope > .eng-tree-group__items"
                  );
                  if (!list) return { groups: [], leaves: [] };
                  return {
                    groups: Array.from(
                      list.querySelectorAll(
                        ":scope > [data-eng-tree-group]"
                      )
                    ).filter((child) => !child.hidden),
                    leaves: Array.from(
                      list.querySelectorAll(
                        ":scope > .eng-tree-leaf > [data-workspace-root-id]"
                      )
                    ).filter((leaf) => !leaf.hidden)
                  };
                };

                const linearChain = (group) => {
                  const chain = [group];
                  let current = group;
                  while (current) {
                    const children = directChildren(current);
                    if (
                      children.leaves.length ||
                      children.groups.length !== 1
                    ) {
                      break;
                    }
                    current = children.groups[0];
                    chain.push(current);
                  }
                  return chain;
                };

                const candidate = Array.from(
                  root.querySelectorAll("[data-eng-tree-group]")
                )
                  .map((group) => linearChain(group))
                  .find((chain) => chain.length >= 2);
                if (candidate) {
                  const toggle = candidate[0].querySelector(
                    ":scope > [data-eng-tree-toggle]"
                  );
                  if (toggle) toggle.click();
                  document.body.dataset.linearBranchExpansion =
                    candidate.every((group) =>
                      group.classList.contains("is-expanded")
                    )
                      ? "passed"
                      : "failed";
                  collapseAll.click();
                } else {
                  document.body.dataset.linearBranchExpansion =
                    "no-linear-branch";
                }

                const groupByLabel = (label, scope = root) =>
                  Array.from(
                    scope.querySelectorAll("[data-eng-tree-group]")
                  ).find((group) => {
                    const labelNode = group.querySelector(
                      ":scope > [data-eng-tree-toggle] .eng-tree-group__label"
                    );
                    return (
                      labelNode &&
                      labelNode.textContent.trim() === label
                    );
                  });

                const ssd = groupByLabel(
                  "41-01-SSD-timing-application-specification-document"
                );
                if (ssd) {
                  const ssdToggle = ssd.querySelector(
                    ":scope > [data-eng-tree-toggle]"
                  );
                  if (ssdToggle) ssdToggle.click();

                  const topChildren = directChildren(ssd).groups;
                  const topLabels = topChildren.map((group) => {
                    const label = group.querySelector(
                      ":scope > [data-eng-tree-toggle] .eng-tree-group__label"
                    );
                    return label ? label.textContent.trim() : "";
                  });
                  const requirements = topChildren.find((group) => {
                    const label = group.querySelector(
                      ":scope > [data-eng-tree-toggle] .eng-tree-group__label"
                    );
                    return (
                      label &&
                      label.textContent.trim() === "Software-item requirements"
                    );
                  });
                  const architecture = topLabels.includes(
                    "Software-item architecture"
                  );

                  const firstExecutable = groupByLabel(
                    "First-executable requirements",
                    requirements || root
                  );
                  const usefulChoices = firstExecutable
                    ? directChildren(firstExecutable).groups
                        .map((group) => {
                          const label = group.querySelector(
                            ":scope > [data-eng-tree-toggle] .eng-tree-group__label"
                          );
                          return label ? label.textContent.trim() : "";
                        })
                    : [];

                  document.body.dataset.ssdRequirementsExpansion =
                    ssd.classList.contains("is-expanded") &&
                    topLabels.includes("Software-item requirements") &&
                    architecture &&
                    requirements &&
                    requirements.classList.contains("is-expanded") &&
                    firstExecutable &&
                    firstExecutable.classList.contains("is-expanded") &&
                    usefulChoices.includes("Process lifecycle and configuration") &&
                    usefulChoices.includes("Build and version identity") &&
                    usefulChoices.includes("Status") &&
                    usefulChoices.includes("Application boundary and testability") &&
                    usefulChoices.includes("Step-4 first-registration operation")
                      ? "passed"
                      : "failed";
                  collapseAll.click();
                } else {
                  document.body.dataset.ssdRequirementsExpansion =
                    "missing-ssd";
                }
              }

              const splitter = root && root.querySelector(
                '[data-eng-resizer="tree-root"]'
              );
              const layout = root && root.querySelector(".eng-trace-layout");
              if (splitter && layout) {
                const before = layout.style.gridTemplateColumns;
                splitter.dispatchEvent(
                  new KeyboardEvent("keydown", {
                    key: "ArrowRight",
                    bubbles: true
                  })
                );
                const after = layout.style.gridTemplateColumns;
                document.body.dataset.paneResizeInteraction =
                  before !== after ? "passed" : "failed";
                document.body.dataset.paneResizePersisted =
                  localStorage.getItem(
                    "engineering-traceability-pane-shares-v1"
                  )
                    ? "passed"
                    : "failed";
              }
            }, 400);
          });
