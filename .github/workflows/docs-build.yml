name: Build software documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'project.yml'
      - '.gitmodules'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'moon.yml'
      - '.moon/**'
      - 'tools/tool.git-project'
      - 'tools/tool.eng-docs'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_system_model_diagrams.py'
      - 'tools/calculate_sip_actuals.py'
      - 'tools/generate_sip_planning.py'
      - 'tools/generate_sip_step_pdfs.py'
      - 'tools/generate_sip_manager_roadmap.py'
      - 'tools/run_docs_task.py'
      - 'tools/render_needs_reader_markdown.py'
      - 'tools/generate_engineering_portal.py'
      - 'tools/requirements-docs.txt'
      - '.github/workflows/docs-build.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'project.yml'
      - '.gitmodules'
      - 'bootstrap.sh'
      - 'bootstrap.ps1'
      - 'moon.yml'
      - '.moon/**'
      - 'tools/tool.git-project'
      - 'tools/tool.eng-docs'
      - 'tools/generate_architecture_diagrams.py'
      - 'tools/generate_timing_detail_diagrams.py'
      - 'tools/generate_data_display_diagrams.py'
      - 'tools/generate_system_model_diagrams.py'
      - 'tools/calculate_sip_actuals.py'
      - 'tools/generate_sip_planning.py'
      - 'tools/generate_sip_step_pdfs.py'
      - 'tools/generate_sip_manager_roadmap.py'
      - 'tools/run_docs_task.py'
      - 'tools/render_needs_reader_markdown.py'
      - 'tools/generate_engineering_portal.py'
      - 'tools/requirements-docs.txt'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Moon affected/cache decisions need Git history, but blobless checkout avoids
      # downloading repository content that the task never opens.
      - name: Checkout exact revision with Moon VCS history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bootstrap released repository and documentation tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "6806a2c8b15df2122c4cc3355d2df9bd11ba2fc8"
          test "$(git -C tools/tool.eng-docs rev-parse HEAD)" = "63af20a033d6295a28c844d12cb87f76165e69a5"
          grep -F 'ref: v0.4.0' project.yml
          test -f tools/tool.git-project/schemas/execution-evidence.schema.json
          tools/tool.git-project/git-project.sh validate --repo "$PWD"
          tools/tool.git-project/moon-project.sh validate --repo "$PWD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation producer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/requirements-docs.txt
          python -m pip install --disable-pip-version-check -r docs/_sphinx-needs/requirements.txt
          python -m pip install --disable-pip-version-check -r docs/_portal/requirements.txt
          python -m pip install --disable-pip-version-check ./tools/tool.eng-docs

      - name: Validate current SDD references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '40-01-SISD-timing-application-specification-document\.md|40-02-SISD-gui-application-specification-document\.md|40-01-SDD-01-data-and-display-design\.md|40-01-SDD-02-java-component-design\.md|40-01-SDD-03-backoffice-transport-design\.md|40-01-01-SSD-timing-application-specification-document\.md|40-02-01-SSD-gui-application-specification-document\.md|30-01-UC-system-use-cases\.md|30-02-SSSD-software-system-specification-document\.md|30-03-IDD-03-application-control-status\.md|30-03-IDD-11-application-configuration\.md|41-01-SDD-data-and-display-design\.md|41-02-SDD-java-component-design\.md|41-03-SDD-backoffice-transport-design\.md|00-01-brainstorm\.md|00-02-handoff\.md|00-03-agent-plan\.md|00-04-domain-baseline\.md|10-01-SDP-software-development-plan\.md|10-02-SIP-software-implementation-planning\.md|20-01-EXT-external-system-inputs\.md|40-01-SSD-timing-application-specification-document\.md|40-02-SSD-gui-application-specification-document\.md|41-01-SDD-01-data-and-display-design\.md|41-01-SDD-02-java-component-design\.md|41-01-SDD-03-backoffice-transport-design\.md|50-01-SDE-software-development-environment\.md|50-02-SDE-java-build-test-toolchain\.md|32-IDD-03-application-control-status\.md|33-IDD-11-application-configuration\.md|50-SDE-software-development-environment\.md|51-SDE-java-build-test-toolchain\.md|60-01-SVP-software-verification-plan\.md' docs tools README.md CHANGELOG.md

      - name: Validate SIP actuals tool
        shell: bash
        run: |
          set -euo pipefail
          python tools/calculate_sip_actuals.py --help >/dev/null

      # Moon owns only the high-level execute/hydrate decision. The existing
      # project-specific diagram/planning scripts and released eng-docs assembler
      # remain authoritative for how their outputs are produced.
      - name: Run or hydrate documentation task graph
        uses: brainboxemb/tool.git-project/moon@v0.2.4
        with:
          task: software:docs.assemble
          cache-namespace: event-timing-software-docs

      - name: Build native MyST/Sphinx-Needs traceability
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bld/sphinx-needs
          mkdir -p \
            bld/sphinx-needs/source/docs/architecture-assets \
            bld/sphinx-needs/diagrams

          cp docs/_sphinx-needs/conf.py bld/sphinx-needs/source/conf.py
          cp docs/_sphinx-needs/schemas.json bld/sphinx-needs/source/schemas.json
          cp docs/30-UC-system-use-cases.md bld/sphinx-needs/source/docs/
          cp docs/41-01-SSD-timing-application-specification-document.md bld/sphinx-needs/source/docs/
          cp docs/32-03-IDD-application-control-status.md bld/sphinx-needs/source/docs/
          cp docs/_diagrams/layered-architecture.yaml bld/sphinx-needs/diagrams/
          cp -L bld/docs/assets/architecture/*.svg bld/sphinx-needs/source/docs/architecture-assets/

          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("bld/sphinx-needs/source/docs").glob("*.md"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"(?:\.\./)+raw/prod/docs/assets/architecture/",
                  "architecture-assets/",
                  text,
              )
              path.write_text(text, encoding="utf-8")
          PY

          cat > bld/sphinx-needs/source/index.md <<'EOF'
          # Migration 013 traceability canary

          ~~~{toctree}
          :maxdepth: 2

          docs/30-UC-system-use-cases
          docs/41-01-SSD-timing-application-specification-document
          docs/32-03-IDD-application-control-status
          ~~~
          EOF

          sphinx-build -W --keep-going -b needs \
            bld/sphinx-needs/source \
            bld/sphinx-needs/needs

          sphinx-build -W --keep-going -b html \
            bld/sphinx-needs/source \
            bld/sphinx-needs/html

      - name: Verify native Sphinx reader layout
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F 'needs_layout_engineering_reader' bld/sphinx-needs/html/docs >/dev/null
          grep -R -F 'id="target__hide__meta"' bld/sphinx-needs/html/docs >/dev/null

      - name: Normalize engineering traceability
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          eng-docs graph \
            --needs bld/sphinx-needs/needs/needs.json \
            --relation derived_from \
            --relation satisfies \
            --relation verifies \
            --diagrams bld/sphinx-needs/diagrams \
            --source-revision "$SOURCE_REVISION" \
            --out bld/engineering-graph.json \
            --review bld/engineering-graph-review.md

      - name: Generate engineering portal
        shell: bash
        run: |
          set -euo pipefail
          publication_branch="prod/docs"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            publication_branch="dev/pr-${{ github.event.pull_request.number }}/docs"
          fi

          rm -rf bld/engineering-portal
          python tools/generate_engineering_portal.py \
            --graph bld/engineering-graph.json \
            --architecture bld/docs/assets/architecture/layered-architecture.svg \
            --output bld/engineering-portal/docs \
            --assets docs/_portal/assets \
            --repository brainboxemb/2026-010-01.meta.event-timing-software \
            --publication-branch "$publication_branch" \
            --tool-ref v0.4.0 \
            --tool-sha 63af20a033d6295a28c844d12cb87f76165e69a5

          mkdocs build --strict --config-file docs/_portal/mkdocs.yml

      - name: Verify engineering portal
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("bld/engineering-portal")
          site = root / "site"
          graph = json.loads(Path("bld/engineering-graph.json").read_text(encoding="utf-8"))
          provenance = json.loads(
              (root / "docs/assets/provenance.json").read_text(encoding="utf-8")
          )

          expected_ids = {item["id"] for item in graph["objects"]}
          objects = {item["id"]: item for item in graph["objects"]}

          use_case_narrative = {
              "UC-001": (
                  "**Preconditions:**",
                  "**Main flow:**",
                  "**Alternative/failure flows:**",
                  "The actor selects/addresses a TimingNode.",
              ),
              "UC-008": (
                  "**Main flow:**",
                  "SI-02 connects through the system-defined application-control/status interface.",
              ),
              "UC-014": (
                  "**Main flow:**",
                  "Settings describe several independently addressed",
              ),
          }
          for object_id, tokens in use_case_narrative.items():
              content = objects[object_id].get("content", "")
              for token in tokens:
                  if token not in content:
                      raise SystemExit(
                          f"engineering graph missing use-case narrative {object_id}: {token}"
                      )

              page = (site / "objects" / object_id / "index.html").read_text(
                  encoding="utf-8"
              )
              for token in ("Main flow",):
                  if token not in page:
                      raise SystemExit(
                          f"portal object page missing use-case narrative {object_id}: {token}"
                      )

          actual_pages = {
              path.parent.name for path in (site / "objects").glob("*/index.html")
          }
          if actual_pages != expected_ids:
              raise SystemExit("portal object-page set does not match engineering graph")

          if provenance["source_revision"] != os.environ["SOURCE_REVISION"]:
              raise SystemExit("portal source revision mismatch")
          if provenance["object_count"] != 23 or provenance["relation_count"] != 34:
              raise SystemExit("portal graph counts mismatch")
          if provenance["tool_eng_docs"] != {
              "ref": "v0.4.0",
              "sha": "63af20a033d6295a28c844d12cb87f76165e69a5",
          }:
              raise SystemExit("portal tool provenance mismatch")

          required_diagram_ids = {
              "TimingSystem",
              "SystemStatus",
              "TimingNode",
              "LogBook",
              "TimingData",
              "UpstreamProtocol",
              "TimeSource",
              "CommandHandler",
              "Conductor",
              "RemoteApi",
          }
          if not required_diagram_ids.issubset(set(provenance["diagram_objects"])):
              raise SystemExit("portal clickable architecture identities incomplete")

          explorer = (site / "explorer/index.html").read_text(encoding="utf-8")
          for object_id in required_diagram_ids:
              if f'data-engineering-id="{object_id}"' not in explorer:
                  raise SystemExit(
                      f"portal explorer missing architecture identity: {object_id}"
                  )

          search = (site / "search/search_index.json").read_text(encoding="utf-8")
          for object_id in ("TimingNode", "SI01-REQ-020", "VC-ST1-001", "UC-001", "UC-008", "UC-014"):
              if object_id not in search:
                  raise SystemExit(f"portal search index missing {object_id}")
          for narrative in (
              "The actor selects/addresses a TimingNode.",
              "SI-02 connects through the system-defined application-control/status interface.",
              "Settings describe several independently addressed",
          ):
              if narrative not in search:
                  raise SystemExit(
                      f"portal search index missing use-case narrative: {narrative}"
                  )

          if not (site / "index.html").is_file():
              raise SystemExit("portal landing page missing")
          PY

      - name: Exercise engineering portal workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory bld/engineering-portal/site \
            > bld/engineering-portal/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/explorer/"
          for _ in range(20):
              try:
                  urllib.request.urlopen(url, timeout=1).read(1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("engineering portal preview server did not become ready")
          PY

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --dump-dom \
            "http://127.0.0.1:8765/explorer/?object=TimingNode" \
            > bld/engineering-portal/browser-explorer.html

          grep -q '<code>TimingNode</code>' bld/engineering-portal/browser-explorer.html
          grep -q 'One-hop context' bld/engineering-portal/browser-explorer.html
          grep -q 'Open object page' bld/engineering-portal/browser-explorer.html
          grep -q 'Authoritative source' bld/engineering-portal/browser-explorer.html

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --dump-dom \
            "http://127.0.0.1:8765/explorer/?object=UC-001" \
            > bld/engineering-portal/browser-explorer-UC-001.html

          grep -q '<code>UC-001</code>' bld/engineering-portal/browser-explorer-UC-001.html
          grep -q 'Preconditions' bld/engineering-portal/browser-explorer-UC-001.html
          grep -q 'Alternative/failure flows' bld/engineering-portal/browser-explorer-UC-001.html
          grep -q 'Authoritative source' bld/engineering-portal/browser-explorer-UC-001.html

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --window-size=1600,1000 \
            --screenshot=bld/engineering-portal/explorer-TimingNode.png \
            "http://127.0.0.1:8765/explorer/?object=TimingNode"

      - name: Render generated Markdown for human review
        shell: bash
        run: |
          set -euo pipefail
          python tools/render_needs_reader_markdown.py \
            --documents bld/docs/documents \
            --needs bld/sphinx-needs/needs/needs.json

      - name: Verify generated reader Markdown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("bld/docs/documents")
          text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in sorted(root.rglob("*.md"))
          )

          forbidden = (
              "```{uc}",
              "```{req}",
              "```{ifreq}",
              "```{arch}",
              "```{vc}",
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"generated reader Markdown still contains {token}")

          required = (
              '**SI01-REQ-003 — Minimal TimingSystem / TimingNode composition**',
              '— — —',
              '- **Type:** Requirement',
              '- **Derived from:**',
              '- **Satisfied by:**',
              '- **Verified by:**',
              '<a id="SI01-REQ-003"></a>',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"generated reader Markdown missing {token}")

          ssd = (root / "41-01-SSD-timing-application-specification-document.md").read_text(
              encoding="utf-8"
          )
          start = ssd.index('<a id="SI01-REQ-003"></a>')
          end = ssd.index('<a id="SI01-REQ-020"></a>', start)
          block = ssd[start:end]
          body_text = "The first executable shall support configuration of at least"
          order = (
              block.index("**SI01-REQ-003 — Minimal TimingSystem / TimingNode composition**"),
              block.index(body_text),
              block.index("— — —"),
              block.index("- **Type:** Requirement"),
              block.index("- **Derived from:**"),
              block.index("- **Satisfied by:**"),
              block.index("- **Verified by:**"),
              block.index("\n---\n"),
          )
          if order != tuple(sorted(order)):
              raise SystemExit(
                  "generated reader Markdown does not render Need body before metadata/separator"
              )

          use_cases = (root / "30-UC-system-use-cases.md").read_text(
              encoding="utf-8"
          )
          uc_start = use_cases.index('<a id="UC-001"></a>')
          uc_end = use_cases.index("## UC-002 —", uc_start)
          uc_block = use_cases[uc_start:uc_end]
          uc_order = (
              uc_block.index("**UC-001 — Start and prepare a TimingNode**"),
              uc_block.index("**Preconditions:**"),
              uc_block.index("**Main flow:**"),
              uc_block.index("**Alternative/failure flows:**"),
              uc_block.index("— — —"),
              uc_block.index("- **Type:** Use Case"),
              uc_block.index("\n---\n"),
          )
          if uc_order != tuple(sorted(uc_order)):
              raise SystemExit(
                  "generated reader Markdown does not retain full UC-001 narrative before metadata"
              )
          PY

      - name: Verify generated output and retained producer evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -f bld/engineering-graph.json
          test -f bld/engineering-graph-review.md
          test -f bld/docs/README.md
          test -f bld/docs/source-sha.txt
          test -f bld/docs/documents/README.md
          test -f bld/docs/documents/software-document-set.md
          test -f bld/docs/documents/architecture-book.md
          test -f bld/docs/documents/50-SDE-01-software-development-environment.md
          test -f bld/docs/documents/50-SDE-02-java-build-test-toolchain.md
          test -f bld/docs/documents/41-01-SSD-timing-application-specification-document.md
          test -f bld/docs/documents/43-01-SDD-02-java-component-design.md
          test -f bld/docs/documents/60-SVP-software-verification-plan.md
          test -f bld/docs/assets/architecture/system-overview.svg
          test -f bld/docs/assets/architecture/system-overview.drawio
          test -f bld/docs/assets/architecture/layered-architecture.svg
          test -f bld/docs/assets/architecture/layered-architecture.drawio
          for object_id in TimingNode CommandHandler Conductor RemoteApi; do
            grep -F "data-engineering-id=\"$object_id\"" bld/docs/assets/architecture/layered-architecture.svg
            grep -F "data-engineering-id=\"$object_id\"" bld/docs/assets/architecture/layered-architecture.drawio
          done
          test -f bld/docs/planning/sip-roadmap.svg
          test -s bld/docs/planning/sip-roadmap.pdf
          test -f .moon/invocations/software_docs.assemble/materialization.json
          test -f .moon/invocations/software_docs.assemble/moon.log

          SOURCE_REVISION="$SOURCE_REVISION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path.cwd()
          schema = json.loads(
              (root / "tools/tool.git-project/schemas/execution-evidence.schema.json").read_text(encoding="utf-8")
          )
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          expected = {
              "docs-diagrams": ("docs.diagrams", "diagrams"),
              "docs-planning": ("docs.planning", "planning"),
              "docs-assemble": ("docs.assemble", "assemble"),
          }
          revisions = {}
          for execution_id, (capability, action) in expected.items():
              path = root / "bld/docs/evidence/executions" / execution_id / "execution.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              validator.validate(data)
              if data["capability"] != capability or data["action"] != action:
                  raise SystemExit(f"execution identity mismatch: {execution_id}")
              if data["owner"] != "brainboxemb/2026-010-01.meta.event-timing-software":
                  raise SystemExit(f"execution owner mismatch: {execution_id}")
              if data["owner_revision"] != data["source_revision"]:
                  raise SystemExit(f"project-owned execution revision mismatch: {execution_id}")
              if data["status"] != "success" or data["exit_code"] != 0:
                  raise SystemExit(f"producer execution failed: {execution_id}")
              allowed_tool_eng_docs_producers = {
                  # Pre-release owner head used to produce the reusable cached Book tree.
                  "a5224de7d62973a1836ec023801324adaa6ebebd",
                  # Immutable v0.4.0 release currently pinned by this consumer.
                  "63af20a033d6295a28c844d12cb87f76165e69a5",
              }
              if data["tool_eng_docs_sha"] not in allowed_tool_eng_docs_producers:
                  raise SystemExit(f"tool.eng-docs revision mismatch: {execution_id}")
              log_path = path.parent / data["log"]
              if not log_path.is_file() or log_path.stat().st_size == 0:
                  raise SystemExit(f"producer execution log missing: {execution_id}")
              revisions[execution_id] = data["source_revision"]

          assembled_source = (root / "bld/docs/source-sha.txt").read_text(encoding="utf-8").strip()
          if assembled_source != revisions["docs-assemble"]:
              raise SystemExit("assembled source SHA does not match assemble producer evidence")

          graph = json.loads((root / "bld/engineering-graph.json").read_text(encoding="utf-8"))
          if graph.get("schema") != "brainboxemb.engineering-graph" or graph.get("schema_version") != 1:
              raise SystemExit("unexpected engineering graph evidence schema")
          if graph.get("source_revision") != os.environ["SOURCE_REVISION"]:
              raise SystemExit("engineering graph evidence revision mismatch")
          if graph.get("source_graph") != {
              "kind": "sphinx-needs",
              "project": "Event timing engineering graph",
              "version": "migration-013",
          }:
              raise SystemExit("unexpected Sphinx-Needs graph provenance")
          expected_ids = {
              "UC-001", "UC-008", "UC-014",
              "SI01-REQ-003", "SI01-REQ-020", "SI01-REQ-021",
              "SI01-REQ-022", "SI01-REQ-030", "SI01-REQ-031",
              "IF03-REQ-001", "IF03-REQ-002", "IF03-REQ-004",
              "TimingSystem", "SystemStatus", "TimingNode", "LogBook", "TimingData", "UpstreamProtocol", "TimeSource",
              "CommandHandler", "Conductor", "RemoteApi",
              "VC-ST1-001",
          }
          actual_ids = {item["id"] for item in graph["objects"]}
          if actual_ids != expected_ids:
              raise SystemExit("engineering graph bounded-slice object set mismatch")
          if graph.get("object_count") != 23 or graph.get("relation_count") != 34:
              raise SystemExit("engineering graph bounded-slice counts mismatch")
          objects = {item["id"]: item for item in graph["objects"]}
          for object_id in ("TimingSystem", "SystemStatus", "TimingNode", "LogBook", "TimingData", "UpstreamProtocol", "TimeSource", "CommandHandler", "Conductor", "RemoteApi"):
              if not objects[object_id].get("diagram_refs"):
                  raise SystemExit(f"architecture object has no diagram reference: {object_id}")
          needs = json.loads((root / "bld/sphinx-needs/needs/needs.json").read_text(encoding="utf-8"))
          current = needs.get("current_version")
          if set(needs["versions"][current]["needs"]) != expected_ids:
              raise SystemExit("Sphinx-Needs bounded-slice object set mismatch")

          materialization = json.loads(
              (root / ".moon/invocations/software_docs.assemble/materialization.json").read_text(encoding="utf-8")
          )
          if materialization.get("task") != "software:docs.assemble":
              raise SystemExit("materialization task mismatch")
          if materialization.get("source_revision") != os.environ["SOURCE_REVISION"]:
              raise SystemExit("current materialization revision mismatch")
          if materialization.get("status") != "success" or materialization.get("exit_code") != 0:
              raise SystemExit("current materialization failed")
          if materialization.get("tool_git_project_version") != "0.2.4":
              raise SystemExit("unexpected tool.git-project materialization version")
          PY

      # The cacheable tree retains producer identity. Current materialization
      # context is added only here, after execute/hydrate, so it cannot falsify
      # producer provenance on a later cache hit.
      - name: Stage documentation publication
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/software-docs-publication"
          rm -rf "$staging"
          mkdir -p "$staging/orchestration" "$staging/evidence/traceability/native" "$staging/evidence/traceability/input" "$staging/evidence/portal"
          cp -a bld/docs/. "$staging/"
          cp bld/engineering-graph.json "$staging/evidence/traceability/engineering-graph.json"
          cp bld/engineering-graph-review.md "$staging/evidence/traceability/review.md"
          cp bld/sphinx-needs/needs/needs.json "$staging/evidence/traceability/needs.json"
          cp -a bld/sphinx-needs/html/. "$staging/evidence/traceability/native/"
          cp docs/_sphinx-needs/conf.py "$staging/evidence/traceability/input/conf.py"
          cp docs/_sphinx-needs/schemas.json "$staging/evidence/traceability/input/schemas.json"
          cp docs/_sphinx-needs/requirements.txt "$staging/evidence/traceability/input/requirements.txt"
          cat > "$staging/evidence/traceability/README.md" <<EOF
          # Engineering graph review evidence

          This is Migration 013 native MyST/Sphinx-Needs production-canary evidence.

          - source revision: $SOURCE_REVISION
          - authoritative authoring: selected MyST/Sphinx-Needs objects in the event-timing engineering documents
          - native Sphinx reader: [native/index.html](native/index.html)
          - Sphinx-Needs export: [needs.json](needs.json)
          - normalized human review: [review.md](review.md)
          - normalized graph: [engineering-graph.json](engineering-graph.json)
          - consumer-owned Needs configuration: [input/conf.py](input/conf.py) · [input/schemas.json](input/schemas.json)

          Requirements own derived_from, design owns satisfies, and verification owns verifies.
          Sphinx-Needs generates the inverse/backlink context. Diagram object_id values reference the same engineering objects.
          EOF
          cp .moon/invocations/software_docs.assemble/moon.log "$staging/orchestration/moon.log"
          cp .moon/invocations/software_docs.assemble/materialization.json "$staging/orchestration/materialization.json"
          cp -a bld/engineering-portal/site "$staging/portal"
          cp bld/engineering-portal/explorer-TimingNode.png "$staging/evidence/portal/explorer-TimingNode.png"
          cp bld/engineering-portal/docs/assets/provenance.json "$staging/evidence/portal/provenance.json"
          cp docs/_portal/mkdocs.yml "$staging/evidence/portal/mkdocs.yml"
          cp docs/_portal/requirements.txt "$staging/evidence/portal/requirements.txt"

      - name: Upload prepared documentation publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-docs-publication
          path: ${{ runner.temp }}/software-docs-publication
          if-no-files-found: error
          retention-days: 14

  # Publication is deliberately outside the Moon task graph: it must run for the
  # current event even when every producer was hydrated from cache.
  publish-documentation:
    needs: documentation
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.4
    with:
      artifact_name: software-docs-publication
      branch_suffix: docs
