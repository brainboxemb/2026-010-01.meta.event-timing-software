name: Temporary update eng-docs pin

on:
  push:
    branches:
      - docs/issue-477-application-layer-layout
    paths:
      - '.github/workflows/update-eng-docs-pin.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update released eng-docs gitlink
        shell: bash
        run: |
          set -euo pipefail
          target_sha="787b5cc0378f9dedaaee1d0dab49707c21c92804"

          git -C tools/tool.eng-docs fetch --tags origin
          git -C tools/tool.eng-docs checkout "$target_sha"
          git add tools/tool.eng-docs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tool.eng-docs submodule to v0.9.4"
          git push origin HEAD:docs/issue-477-application-layer-layout
