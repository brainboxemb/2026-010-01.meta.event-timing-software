<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="780" viewBox="0 0 1460 780">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#5f6368"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="38.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#202124">Figure SYS-03 — Network connectivity status — separate observations</text>
<text x="30.0" y="68.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">Router/AP connectivity is optional and may be N/A for direct or automated-test deployments. Local, external and backoffice connectivity are reported separately.</text>
<rect x="70" y="105" width="600" height="590" rx="10" ry="10" fill="#eef4ff" stroke="#6c8ebf" stroke-width="2"/>
<text x="86.0" y="127.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202124">Possible local network paths</text>
<rect x="710" y="105" width="680" height="590" rx="10" ry="10" fill="#eef8ee" stroke="#82b366" stroke-width="2"/>
<text x="726.0" y="127.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202124">Connectivity status exposed by the system</text>
<polyline points="620.0,230.0 690.0,230.0 690.0,203.2 760.0,203.2" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="591.0" y="217.0" width="128" height="22" fill="#ffffff" opacity="0.94"/>
<text x="655.0" y="229.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">valid local path</text>
<polyline points="620.0,405.0 840.0,405.0 840.0,231.8 1060.0,231.8" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="670.0" y="392.0" width="120" height="22" fill="#ffffff" opacity="0.94"/>
<text x="730.0" y="404.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">when configured</text>
<polyline points="620.0,430.0 690.0,430.0 690.0,427.5 760.0,427.5" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="595.0" y="417.0" width="120" height="22" fill="#ffffff" opacity="0.94"/>
<text x="655.0" y="429.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">possible uplink</text>
<polyline points="620.0,575.0 690.0,575.0 690.0,241.2 760.0,241.2" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="622.0" y="395.1" width="136" height="22" fill="#ffffff" opacity="0.94"/>
<text x="690.0" y="407.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">peer reachability</text>
<polyline points="1040.0,427.5 1060.0,427.5" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="955.0" y="414.5" width="190" height="22" fill="#ffffff" opacity="0.94"/>
<text x="1050.0" y="426.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">distinct from session health</text>
<rect x="120" y="180" width="500" height="100" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="370.0" y="212.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Direct / development / test IP path</text>
<text x="370.0" y="230.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">loopback • same host • point-to-point</text>
<text x="370.0" y="247.9" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">no router required</text>
<rect x="120" y="355" width="500" height="100" rx="8" ry="8" fill="#eeeeee" stroke="#777777" stroke-width="2"/>
<text x="370.0" y="387.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Optional LAN / Wi-Fi router or AP</text>
<text x="370.0" y="405.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">field deployment path</text>
<text x="370.0" y="422.9" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">may also provide an external uplink</text>
<rect x="120" y="530" width="500" height="90" rx="8" ry="8" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
<text x="370.0" y="566.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">SI-02 • SI-03 • Smart Display V2</text>
<text x="370.0" y="584.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">use the available IP path to reach SI-01</text>
<rect x="760" y="170" width="280" height="95" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="900.0" y="208.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Local IP connectivity</text>
<text x="900.0" y="226.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">SI-01 interface/link and local peer reachability</text>
<rect x="1060" y="170" width="280" height="95" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="1200.0" y="199.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Configured router / AP connectivity</text>
<text x="1200.0" y="217.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">connected / associated / reachable</text>
<text x="1200.0" y="235.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">or N/A when not configured</text>
<rect x="760" y="380" width="280" height="95" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="900.0" y="418.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">External network reachability</text>
<text x="900.0" y="436.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">outside the local network / Internet</text>
<rect x="1060" y="380" width="280" height="95" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="1200.0" y="418.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Backoffice connectivity</text>
<text x="1200.0" y="436.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">endpoint / transport / session health</text>
<rect x="810" y="545" width="480" height="80" rx="8" ry="8" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/>
<text x="1050.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">These states are not interchangeable:</text>
<text x="1050.0" y="594.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">local operation may be healthy while router, external or backoffice connectivity is unavailable.</text>
</svg>
