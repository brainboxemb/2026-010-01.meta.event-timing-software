<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#555"/>
</marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="bold">TimingNode lifecycle — operational lifecycle and health are separate</text>
<line x1="500.0" y1="255.0" x2="770.0" y2="255.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="770.0" y1="255.0" x2="500.0" y2="255.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="391.2" y1="300.0" x2="566.2" y2="440.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="878.8" y1="300.0" x2="703.8" y2="440.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635.0" y1="550.0" x2="635.0" y2="650.0" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="210" width="330" height="90" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="335.0" y="246.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">CLOSED</text>
<text x="335.0" y="265.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">not accepting normal TimingNode operation</text>
<rect x="770" y="210" width="330" height="90" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
<text x="935.0" y="246.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">OPEN</text>
<text x="935.0" y="265.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">TimingNode operation enabled</text>
<rect x="355" y="440" width="560" height="110" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
<text x="635.0" y="486.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">Subsystem health is orthogonal</text>
<text x="635.0" y="505.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">HEALTHY • DEGRADED • ERROR do not silently change OPEN/CLOSED</text>
<rect x="355" y="650" width="560" height="95" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="635.0" y="688.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">Example: OPEN + RFID INITIALISING/ERROR</text>
<text x="635.0" y="707.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14">=&gt; TimingNode remains OPEN while health is degraded</text>
</svg>
