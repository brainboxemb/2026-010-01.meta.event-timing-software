<text x="980.0" y="739.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">or use LAN / Wi-Fi infrastructure. A router is not part of the logical interface.</text>
