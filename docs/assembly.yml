schema_version: 1

asset_manifests:
  - path: bld/docs-producers/architecture/assets-publication.yml
    publish_prefix: assets/architecture
  - path: bld/docs-producers/architecture/assets-raw.yml
    publish_prefix: architecture
  - path: bld/docs-producers/planning/assets.yml
    publish_prefix: planning

documents:
  - {id: domain-baseline, source: docs/03-domain-baseline.md}
  - {id: system-use-cases, source: docs/30-UC-system-use-cases.md}
  - {id: software-development-plan, source: docs/10-SDP-software-development-plan.md}
  - {id: software-implementation-planning, source: docs/11-SIP-software-implementation-planning.md}
  - {id: external-system-inputs, source: docs/20-EXT-external-system-inputs.md}
  - {id: software-development-environment, source: docs/50-SDE-01-software-development-environment.md}
  - {id: java-build-test-toolchain, source: docs/50-SDE-02-java-build-test-toolchain.md}
  - {id: engineering-client, source: docs/50-SDE-03-engineering-client.md}
  - {id: software-system-specification, source: docs/31-SSSD-software-system-specification-document.md}
  - {id: application-control-status, source: docs/32-03-IDD-application-control-status.md}
  - {id: timingdata-interchange, source: docs/32-05-IDD-timingdata-interchange.md}
  - {id: application-configuration, source: docs/32-11-IDD-application-configuration.md}
  - {id: timing-application-specification, source: docs/41-01-SSD-timing-application-specification-document.md}
  - {id: gui-application-specification, source: docs/41-02-SSD-gui-application-specification-document.md}
  - {id: data-display-design, source: docs/43-01-SDD-01-data-and-display-design.md}
  - {id: java-component-design, source: docs/43-01-SDD-02-java-component-design.md}
  - {id: backoffice-transport-design, source: docs/43-01-SDD-03-backoffice-transport-design.md}
  - {id: software-verification-plan, source: docs/60-SVP-software-verification-plan.md}
  - {id: timing-application-verification-test-specification, source: docs/61-01-VTS-timing-application-verification-test-specification.md}
  - {id: timing-application-user-manual, source: docs/70-01-SUM-headless-timing-application.md}

indexes:
  - output: documents/README.md
    title: Generated documents
    sections:
      - title: Working context
        items:
          - {document: domain-baseline}
      - title: Planning
        items:
          - {document: software-development-plan}
          - {document: software-implementation-planning}
          - {label: Generated SIP roadmap and printable PDFs, target: ../planning/README.md}
      - title: External / parent-system inputs
        items:
          - {document: external-system-inputs}
      - title: Software-system specification and design
        items:
          - {document: system-use-cases}
          - {document: software-system-specification}
          - {document: application-control-status}
          - {document: timingdata-interchange}
          - {document: application-configuration}
      - title: Software-item specifications
        items:
          - {document: timing-application-specification}
          - {document: gui-application-specification}
      - title: Software-item detailed design
        items:
          - {document: data-display-design}
          - {document: java-component-design}
          - {document: backoffice-transport-design}
      - title: Development environment / engineering
        items:
          - {document: software-development-environment}
          - {document: java-build-test-toolchain}
          - {document: engineering-client}
      - title: Verification and validation
        items:
          - {document: software-verification-plan}
          - {document: timing-application-verification-test-specification}
      - title: User / operational documentation
        items:
          - {document: timing-application-user-manual}
      - title: Combined documents
        items:
          - {label: Complete software engineering document set, target: ./software-document-set.md}
          - {label: Architecture/specification book, target: ./architecture-book.md}

  - output: README.md
    title: Generated documentation
    intro: This branch contains generated review/output documentation. Edit source Markdown on the source branch, not here.
    sections:
      - title: Contents
        items:
          - {label: Generated document index, target: documents/README.md}
          - {label: SIP roadmap and printable planning PDFs, target: planning/README.md}
          - {label: Complete software engineering document set, target: documents/software-document-set.md}
          - {label: Architecture/specification book, target: documents/architecture-book.md}
          - {label: Architecture assets, target: assets/architecture/README.md}

books:
  - output: documents/architecture-book.md
    title: Software specification and architecture document set
    description: Generated review/output book containing the SSSD, software-item SSDs and currently active focused detailed designs. The numbered source documents on the source branch remain authoritative.
    documents:
      - software-system-specification
      - application-control-status
      - timingdata-interchange
      - application-configuration
      - timing-application-specification
      - data-display-design
      - java-component-design
      - gui-application-specification

  - output: documents/software-document-set.md
    title: Software engineering document set
    description: Generated review/output book containing the current context, planning, specifications, interfaces, detailed design, verification and user guidance. The numbered source documents on the source branch remain authoritative.
    documents:
      - domain-baseline
      - software-development-plan
      - software-implementation-planning
      - external-system-inputs
      - system-use-cases
      - software-system-specification
      - application-control-status
      - timingdata-interchange
      - application-configuration
      - timing-application-specification
      - gui-application-specification
      - java-component-design
      - data-display-design
      - backoffice-transport-design
      - software-development-environment
      - java-build-test-toolchain
      - engineering-client
      - software-verification-plan
      - timing-application-verification-test-specification
      - timing-application-user-manual
