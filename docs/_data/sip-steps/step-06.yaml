step: 6

planning_changes:
  - date: '2026-10-09'
    change: >-
      SI-02 Engineering Desktop Client baseline selected; A01 is next and V01
      verifies the real GUI revoke/recovery scenario.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Establish SI02-REQ-001..008 as the first Draft Engineering Desktop Client
      requirement slice, tracing technology-independent connection, synchronisation,
      status/history and command-outcome behaviour to UC-009 and IF-03.

  - id: D02
    lane: application
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Select Java 21, JavaFX 21, BentoFX 0.16.0, application-owned CSS,
      JDK HttpClient/WebSocket, Jackson, Maven and a self-contained Windows
      jpackage app-image. Keep client/application services below JavaFX so later
      multi-system and scripting adapters can reuse the same public-interface
      operations. Transit is optional; JPMS/installers/auto-update remain later
      needs rather than baseline requirements.

  - id: A01
    lane: application
    kind: implementation
    state: next
    depends_on: [D01, D02]
    note: >-
      Restructure the existing JavaFX implementation into SI-02 around the selected
      instance-scoped client/application services and BentoFX workbench. Preserve the
      public IF-03 boundary and prepare the real application for V01 verification.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Verify connection/status identity, stale/disconnected state, baseline
      rebuild after reconnect, representative workbench views and selected
      engineering controls using deterministic client tests plus a real SI-01
      public-interface integration path. Run the VC-ST1-003 real-GUI scenario on
      SI-02: trash
      appends REV without rewriting ADD, interpreted row remains DELETED,
      restart/reconnect rebuilds sequence/history without live replay,
      SYNCING precedes LIVE, and Device/Client Logs remain independent.
      Headless tests do not substitute for this UI evidence.
