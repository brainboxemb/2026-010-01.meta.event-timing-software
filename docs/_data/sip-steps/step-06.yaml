activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Establish SI02-REQ-001..008 as the first Draft Engineering Desktop Client
      requirement slice, tracing technology-independent connection, synchronisation,
      status/history and command-outcome behaviour to UC-009 and IF-03.

  - id: D02
    lane: application
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Select Java 21, JavaFX 21, BentoFX 0.16.0, application-owned CSS,
      JDK HttpClient/WebSocket, Jackson, Maven and a self-contained Windows
      jpackage app-image. Keep client/application services below JavaFX so later
      multi-system and scripting adapters can reuse the same public-interface
      operations. Transit is optional; JPMS/installers/auto-update remain later
      needs rather than baseline requirements.

  - id: A01
    lane: application
    kind: implementation
    state: done
    depends_on: [D01, D02]
    note: >-
      Completed through Java issue #401 / PR #402. SI-02 now uses Java 21 /
      JavaFX 21 and BentoFX, composes the real functional panes through a
      framework-isolated workbench, owns one connected SI-01 target through an
      instance-scoped EngineeringSystemContext and builds a CI-verified Windows
      jpackage app-image while preserving public-interface-only operation.

  - id: D03
    lane: documentation
    kind: documentation
    state: done
    depends_on: [A01]
    note: >-
      Complete the current SI-02 documentation split after scripting became a real
      Engineering Client capability. SI02-REQ-009/010 cover capability display and
      scripting; 43-02-SDD-01 owns the Lua facade/internal design and 70-02-SUM owns
      practical Engineering Client and Lua use. SDE-03 remains the development/runtime
      baseline instead of duplicating user instructions.

  - id: A02
    lane: application
    kind: implementation
    state: done
    depends_on: [A01]
    note: >-
      Add the local Lua engineering worker/facade, explicit Run/Stop, repeatable
      simulate/batch operations through the public IF-03 client path and the dynamic
      API capability display. Local print/log/sleep remains usable independently from
      TAG_SCENARIO_SIMULATION; simulation calls are capability-gated and distinguish
      local refusal from actual IF-03 rejection.

  - id: V02
    lane: verification
    kind: verification
    state: done
    depends_on: [A02, D03]
    note: >-
      Automated SI-02 tests and Java/Windows packaging verification cover the scripting
      starter, Lua facade limits/cancellation, capability display/unknown state and
      local-versus-remote simulation refusal semantics. These checks complement but do
      not replace the manual packaged-GUI V01 scenario.

  - id: V01
    lane: verification
    kind: verification
    state: next
    depends_on: [A01, A02, V02]
    note: >-
      Run VC-ST1-003 on the real packaged SI-02 against a real SI-01 process. Verify
      SYNCING -> LIVE, lifecycle/registration source history, trash -> REV with immutable
      ADD, interpreted DELETED, restart/reconnect recovery without live replay, Device
      Log / Client Log independence, canonical time precision and clean shutdown.
      Record actual source/runtime versions and PASS/FAIL evidence. Headless or packaged
      smoke tests do not substitute for this UI evidence.
