activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      The former first SI-02 Draft requirement slice was reviewed and then
      superseded by the 2026-10-09 allocation correction. SI02-REQ-001..008 are
      withdrawn with the separate operator-desktop product assumption; their useful
      public-interface/connection/reconnect behaviours remain Engineering Client
      design inputs through UC-009, IF-03 and SDE-03.

  - id: D02
    lane: application
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Select Java 21, JavaFX 21, BentoFX 0.16.0, application-owned CSS,
      JDK HttpClient/WebSocket, Jackson, Maven and a self-contained Windows
      jpackage app-image. Keep client/application services below JavaFX so later
      multi-system and scripting adapters can reuse the same public-interface
      operations. Transit is optional; JPMS/installers/auto-update remain later
      needs rather than baseline requirements.

  - id: A01
    lane: application
    kind: implementation
    state: next
    depends_on: [D01, D02]
    note: >-
      Restructure the existing Development Client into the Engineering Desktop
      Client around the selected instance-scoped client/application services
      and BentoFX workbench. Step-5 server behaviour is qualified; old-client
      manual V06 is not a gate. Preserve the public IF-03 boundary and carry
      the manual revoke/recovery scenario forward to Step-6 V01.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Verify connection/status identity, stale/disconnected state, baseline
      rebuild after reconnect, representative workbench views and selected
      engineering controls using deterministic client tests plus a real SI-01
      public-interface integration path. Explicitly run the previously unexecuted
      VC-ST1-003 manual GUI scenario on the new Engineering Client: trash
      appends REV without rewriting ADD, interpreted row remains DELETED,
      restart/reconnect rebuilds sequence/history without live replay,
      SYNCING precedes LIVE, and Device/Client Logs remain independent.
      Headless tests do not substitute for this UI evidence.
