step: 5

planning_changes:
  - date: '2026-10-04'
    change: >-
      D04 remains active for antenna/runtime review; A01 stays blocked until D04
      is accepted.
  - date: '2026-10-04'
    change: >-
      D01 reopened and decomposed into D04/D05 design gates plus T01 harness;
      A01/A02 prototypes require requalification and V01 now precedes A03.
  - date: '2026-10-04'
    change: >-
      A02 completed runtime instrumentation; A03 measurement-driven strategy is
      now active.
  - date: '2026-10-04'
    change: >-
      D01 fixed the single-TimingNode runtime measurement baseline; A01 is now
      the active implementation activity.
  - date: '2026-10-04'
    change: >-
      Step 5 activated after Step-4 VC-ST1-003 closure; D01 is the first active
      planning/design activity.
  - date: '2026-10-02'
    change: >-
      Narrowed Step 5 to one-TimingNode simulated antenna input and runtime behaviour.
  - date: '2026-10-02'
    change: >-
      Added explicit runtime performance and memory engineering so scheduling,
      allocation and data-access choices are measurement-driven.
  - date: '2026-10-03'
    change: >-
      Assigned TimingNode OPEN/CLOSE TimingData to Step 5; D02 updates IF-05/IDD
      before implementation and verification. Step-4 baseline is unchanged.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Define measurement questions, engineering/tooling split, product design
      gates, reproducible evidence flow and roadmap order before accepting
      runtime-characterization implementation.

  - id: D02
    lane: documentation
    kind: decision
    state: planned
    note: >-
      Define TimingNode OPEN/CLOSE TimingData semantics and the default/reference
      representation. Update 32-05 IF-05 and 33-05 IDD during Step 5, including
      transition time, captured LocationId, record-type presence rules and the
      rule that rejected lifecycle commands do not create committed TimingData.

  - id: D03
    lane: documentation
    kind: decision
    state: planned
    note: >-
      Promote registration revoke from reserved reference-format mapping to an
      explicit TimingData/API semantic. Define matching-record identity,
      repeated time/RegistrationId rules, idempotence/rejection and the rule
      that revoke appends a new committed record instead of rewriting history.

  - id: D04
    lane: documentation
    kind: decision
    state: active
    depends_on: [D01]
    note: >-
      Review the simulated antenna/input architecture: stable observation
      boundary, TagProcessor/filter/resolution ownership, callback/threading
      expectations and separation of product concepts from synthetic fixtures.

  - id: D05
    lane: documentation
    kind: decision
    state: planned
    depends_on: [D01]
    note: >-
      Define an internal pull-based runtime-observability boundary for queue,
      persistence, commit/event and JVM observations without making engineering
      metrics part of TimingData, Domain semantics or IF-03.

  - id: T01
    lane: tooling
    kind: setup
    state: planned
    depends_on: [D01]
    note: >-
      Add the engineering-only runtime-characterization Maven profile/module,
      deterministic workload driver and machine-readable evidence output defined
      by SDE-04. Keep formal system-test black-box.

  - id: A01
    lane: application
    kind: implementation
    state: blocked
    depends_on: [D04]
    note: >-
      Replace/qualify the Java #230 prototype against D04: Event-based
      TagObservation(TagId, RSSI, time), AntennaManager lifecycle/probe/inventory,
      TagProcessor RSSI + duplicate filtering, injected TagRegistrationMapper
      and the normal TimingNode-owned registration path.

  - id: A02
    lane: application
    kind: implementation
    state: blocked
    depends_on: [D05, A01]
    note: >-
      Qualify/implement low-allocation runtime observation required by D05.
      Java PR #231 exists as a prototype but is not accepted completion until
      the diagnostics boundary is reviewed.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [D01, D04, D05, T01, A01, A02]
    note: >-
      Run repeatable one-TimingNode steady/burst/growing-history characterization
      and retain queue, latency, CPU/thread, allocation/GC and query evidence.
      These are engineering baselines, not product limits.

  - id: A03
    lane: application
    kind: decision
    state: planned
    depends_on: [V01]
    note: >-
      Decide from V01 evidence whether ordinary allocation/direct traversal and
      the current execution model remain adequate or which specific change is
      justified. Re-run affected V01 workloads after a design change.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [A03]
    note: >-
      Verify sustained/bursty tag observations and stalled downstream delivery cannot
      starve required TimingNode work or create unbounded application-owned
      delivery state. Introduce fairness/backpressure changes only when required
      by contract or supported by evidence.

  - id: A04
    lane: application
    kind: implementation
    state: planned
    depends_on: [D02]
    note: >-
      Commit successful TimingNode OPEN/CLOSE transitions through the same
      TimingNode-owned sequence, LogBook and persistence path as other committed
      TimingData. Do not add a second lifecycle record owner or a UI/test-only
      persistence bypass.

  - id: A05
    lane: application
    kind: implementation
    state: planned
    depends_on: [D03]
    note: >-
      Add the public node-scoped revoke operation and commit REV through the same
      TimingNode-owned sequence, LogBook, persistence and committed-event path.
      Wire the Development Client trash action to that operation; never delete
      or rewrite the original ADD record.

  - id: V03
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Restart SI-01 after simulated registrations, rebuild committed history and
      continue through the same reviewed simulated-input path without sequence
      reuse or a test-only commit bypass.

  - id: V04
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Verify built-in provider selection plus one synthetic external provider
      through the same typed startup mechanism intended for later real adapters.

  - id: V05
    lane: verification
    kind: verification
    state: planned
    depends_on: [A04]
    note: >-
      Verify OPEN/CLOSE TimingData in source order with registrations, including
      persisted restart/recovery and sequence continuity. Verify rejected or
      idempotent lifecycle requests according to D02 and confirm no unintended
      lifecycle record is committed.

  - id: V06
    lane: verification
    kind: verification
    state: planned
    depends_on: [A05]
    note: >-
      Verify revoke through the public API and Development Client: the original
      ADD remains in the technical LogBook, REV is appended in source order, the
      interpreted row remains visible as DELETED, restart/recovery preserves
      both records and repeated/invalid revoke follows D03 semantics.
