step: 5

planning_changes:
  - date: '2026-10-02'
    change: >-
      Narrowed Step 5 to one-TimingNode simulated antenna input and runtime
      behaviour. Multi-node/full-field simulation, backoffice reference-data
      synchronisation and StageTiming move to Step 7.
  - date: '2026-10-02'
    change: >-
      Added explicit runtime performance and memory engineering so scheduling,
      allocation and data-access choices are measurement-driven.

activities:
  - id: D01
    lane: documentation
    kind: decision
    title: Runtime execution and measurement plan
    state: planned
    note: >-
      Define the first project-owned thread/queue measurement approach, stable
      thread naming and the boundary between JVM scheduling preferences and
      later target-specific tuning. Thread priority is not a correctness rule.

  - id: A01
    lane: application
    kind: implementation
    title: Simulated antenna and tag-processing path
    state: planned
    depends_on: [D01]
    note: >-
      Feed deterministic tag observations through the built-in
      SimulatedAntenna, normal tag interpretation/filtering and the existing
      accepted-registration path for one TimingNode. Use a small synthetic local
      reference fixture for TagId-to-RegistrationId resolution; do not add
      backoffice synchronisation here.

  - id: A02
    lane: application
    kind: implementation
    title: Runtime markers and counters
    state: planned
    depends_on: [D01, A01]
    note: >-
      Add low-allocation monotonic markers and primitive counters for queue
      admission/depth/high-water, queue wait, processing, persistence and
      selected thread/GC observations. Avoid per-event metric-object allocation
      and high-volume logging.

  - id: A03
    lane: application
    kind: decision
    title: Allocation and data-access strategy
    state: planned
    depends_on: [A01, A02]
    note: >-
      Use measurements to decide where direct traversal, cached state, reusable
      scratch storage or ordinary allocation are appropriate. Do not introduce
      pooling or copied snapshots by default.

  - id: V01
    lane: verification
    kind: verification
    title: Single-node load and burst characterization
    state: planned
    depends_on: [A01, A02, A03]
    note: >-
      Exercise one TimingNode with representative synthetic tag/reference data
      and growing committed-record volumes. Measure forward progress, input to
      commit latency, queue high-water, CPU/thread behaviour, allocation/GC and
      history/query cost. These are engineering baselines, not product limits.

  - id: V02
    lane: verification
    kind: verification
    title: Sustained antenna-ingress fairness
    state: planned
    depends_on: [V01]
    note: >-
      Verify that sustained or bursty tag input cannot monopolize the ingress
      path and starve required TimingNode processing or lower-priority services.
      Add bounded batching/admission only if the measurements justify it.

  - id: V03
    lane: verification
    kind: verification
    title: Restart and recovery with simulated input
    state: planned
    depends_on: [A01]
    note: >-
      Restart SI-01 after simulated registrations, rebuild committed history and
      continue through the same SimulatedAntenna path without sequence reuse or
      a test-only bypass.

  - id: V04
    lane: verification
    kind: verification
    title: Provider bootstrap verification
    state: planned
    depends_on: [A01]
    note: >-
      Verify built-in provider selection plus one synthetic external provider
      through the same typed startup mechanism intended for later real adapters.
