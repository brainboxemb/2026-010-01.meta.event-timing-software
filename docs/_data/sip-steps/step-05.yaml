step: 5

planning_changes:
  - date: '2026-10-07'
    change: >-
      Added D08/A06/V07 for manual registration/precision and D09/A07/V08 for
      simulated-tag profiles.
  - date: '2026-10-07'
    change: >-
      Target-hardware evidence moved to Step 9; Step-5 V01 is the development-host baseline and releases A03.
  - date: '2026-10-07'
    change: >-
      T01 completed through Java PR #327; V01 baseline characterization is next.
  - date: '2026-10-06'
    change: >-
      A01 requalified on Java main; V04 provider bootstrap verified through PR
      #302 with built-in reference providers and a synthetic external provider JAR.
  - date: '2026-10-04'
    change: >-
      D05 runtime measurement design is complete; A01 remains active because the
      antenna/tag-processing path is not yet wired into runtime composition.
  - date: '2026-10-04'
    change: >-
      D01 reopened and decomposed into D04/D05 design gates plus T01 harness;
      A01/A02 prototypes require requalification and V01 now precedes A03.
  - date: '2026-10-04'
    change: >-
      D01 fixed the single-TimingNode runtime measurement baseline; A01 is now
      the active implementation activity.
  - date: '2026-10-04'
    change: >-
      Step 5 activated after Step-4 VC-ST1-003 closure; D01 is the first active
      planning/design activity.
activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Define measurement questions, engineering/tooling split, product design
      gates, reproducible evidence flow and roadmap order before accepting
      runtime-characterization implementation.

  - id: D02
    lane: documentation
    kind: decision
    state: done
    note: >-
      Defines successful CLOSED->OPEN and OPEN->CLOSED lifecycle TimingData,
      transition time/location capture, NODE_INFO with OPEN/CLOSE code in the
      IF-05 v1 mapping and the rule that no-op/rejected/failed lifecycle
      commands do not create committed TimingData.

  - id: D03
    lane: documentation
    kind: decision
    state: done
    note: >-
      Defines append-only registration revoke as a new TimingData record using
      the same regId and original time. AUTO_REG uses REV; MAN_REG uses REV with
      the original AUTO/MAN subcode. TimingNode/LogBook remain bookkeeping and
      do not infer active/deleted business state from prior ADD/REV history.

  - id: D04
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Review the simulated antenna/input architecture: stable observation
      boundary, TagProcessor/filter/resolution ownership, callback/threading
      expectations and separation of product concepts from synthetic fixtures.

  - id: D05
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Define the internal pull-based runtime measurement reader for queue,
      persistence, commit/event, TagProcessor and JVM snapshots without exposing
      engineering measurements through TimingData, Domain semantics or IF-03.

  - id: D06
    lane: documentation
    kind: documentation
    state: done
    note: >-
      Completed through meta issue #564 / PR #570. SDD-02 now contains focused
      Detailed Design Needs and SSD architecture objects link to them through
      schema-validated detailed_by relations; the normalized engineering graph,
      generated reader and Object Explorer expose both outgoing and inverse
      traceability.

  - id: D07
    lane: documentation
    kind: documentation
    state: done
    note: >-
      Completed through meta issue #567 / PR #572 using released
      tool.eng-docs v0.10.0 from shared issue #100. Figure SI01-01 now shows
      component-owned external interface ports: Web and API each have separate
      HTTP and WebSocket ports, RemoteShell has a TCP-shell port and Console a
      local-console port. SharedTerminalHandler and the
      Application-layer PresentationGateway remain internal and have no external
      port.

  - id: D08
    lane: documentation
    kind: decision
    state: done
    note: >-
      Define normal IF-03 manual-registration ADD separately from the dev
      accepted-automatic-registration injection. MAN_REG uses client-supplied
      effective time for both AUTO/MAN classifications; IF-05 v1 `time` uses
      centisecond precision and `recTime` uses millisecond precision.

  - id: D09
    lane: documentation
    kind: decision
    state: done
    depends_on: [D04]
    note: >-
      Distinguish direct accepted-registration injection, SimulatedAntenna
      observation input and simulated-tag/profile scenarios. Profiles drive
      TagObservation sequences through SimulatedAntenna and reuse EventData
      multi-tag mappings. Development Client batch control owns count/range/order/
      interval while the selected profile owns the observations inside one passage.

  - id: T01
    lane: tooling
    kind: setup
    state: done
    depends_on: [D01]
    note: >-
      Completed through Java PR #327: the optional runtime-characterization
      profile/module drives deterministic steady/burst/history workloads through
      the normal SimulatedAntenna -> TagProcessor -> TimingNode -> file-backed
      TimingData path and retains per-run JSON evidence from RuntimeMeasurementReader.

  - id: A01
    lane: application
    kind: implementation
    state: done
    depends_on: [D04]
    note: >-
      Requalified the simulated-input path on Java main: Event-based
      TagObservation(TagId, RSSI, time), AntennaManager lifecycle/health/inventory,
      EventData TagId -> RegistrationId resolution, registration-keyed duplicate
      and passage filtering, and the normal TimingNode-owned
      TimingData/persistence/LogBook path. Normal Windows development startup now
      also exercises AntennaManager through the clearly logged simulated-antenna
      platform default.

  - id: A02
    lane: application
    kind: implementation
    state: done
    depends_on: [D05, A01]
    note: >-
      Requalified and corrected on Java main through PR #325: runtime measurement
      is removed from the public TimingNode/TimingNodeTypes contract and exposed
      through engineering-only runtime.measurement.RuntimeMeasurementReader using
      component-owned TimingNode, TagProcessor, lane and JVM snapshots.

  - id: V01
    lane: verification
    kind: verification
    state: done
    depends_on: [D01, D04, D05, T01, A01, A02]
    note: >-
      Development-host baseline is complete. Hosted Linux steady/burst and
      growing-history evidence is retained on prod/characterization for Java
      revision efc5797f2fb4. This evidence is sufficient for the Step-5 A03
      design decision; selected-target repetitions, effective JVM stack
      configuration and any target-specific tuning belong to Step 9.

  - id: A03
    lane: application
    kind: decision
    state: done
    depends_on: [V01]
    note: >-
      V01 development-host evidence justifies keeping ordinary allocation,
      direct bounded LogBook traversal, the current serial execution model and
      ordinary JVM scheduling. No object pool, copied snapshot/cache/index or
      thread-priority change is justified. Unpaced burst rejection at the
      configured queue bound remains explicit bounded-overload behaviour; target
      JVM tuning is deferred to Step 9.

  - id: V02
    lane: verification
    kind: verification
    state: done
    depends_on: [A03]
    note: >-
      Completed through Java issue #334 / PR #335. The existing bounded
      WebSocket delivery policy disconnects a permanently buffered client at its
      configured send bound without introducing another application payload
      queue, while later TimingNode registration commits and LogBook progress
      continue after downstream disconnect. No batching, priority or additional
      worker/state-owner change was required.

  - id: A04
    lane: application
    kind: implementation
    state: done
    depends_on: [D02]
    note: >-
      Commit successful TimingNode OPEN/CLOSE transitions through the same
      TimingNode-owned sequence, LogBook and persistence path as other committed
      TimingData. Completed through Java PR #330 using NODE_INFO OPEN/CLOSE,
      durable commit before successful status publication and the existing
      committed-event path.

  - id: A05
    lane: application
    kind: implementation
    state: done
    depends_on: [D03]
    note: >-
      Add the public node-scoped revoke operation and commit REV through the same
      TimingNode-owned sequence, LogBook, persistence and committed-event path.
      Wire the Development Client trash action to that operation; never delete
      or rewrite the original ADD record. Completed through Java PR #330 with
      TimingNode/LogBook kept as bookkeeping rather than ADD/REV business-state
      interpretation.

  - id: A06
    lane: application
    kind: implementation
    state: done
    depends_on: [D08]
    note: >-
      Completed through Java issue #336 / PR #338. Normal MAN_REG ADD now uses
      IF-03 -> PresentationGateway/TimingNodeProxy with client-supplied AUTO/MAN
      effective time, IF-05 v1 `time` is centisecond precision and `recTime`
      is millisecond precision, and the Development Client provides
      hundredth-second input/display plus current-open-location/All projection.

  - id: A07
    lane: application
    kind: implementation
    state: done
    depends_on: [D09]
    note: >-
      Completed through Java issue #337 / PR #339 and later aligned with the
      default/reference EventData identity convention in Java PR #350. The
      simple/normal/edge profiles publish observations through SimulatedAntenna
      -> AntennaManager -> TagProcessor -> TimingNode; simulation registrations
      use RT-A-NNNN with physical tags TT-A-NNNN-1 and TT-A-NNNN-2. The
      Development Client batch driver supports count, range,
      ascending/seeded-random order, interval and Start/Stop.

  - id: V03
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Completed through Java PR #333. The runtime integration verification
      commits registrations through SimulatedAntenna -> TagProcessor ->
      TimingNode -> persistence/LogBook, restarts against the same persisted
      history, confirms operational OPEN/location state is not restored, then
      reopens and commits another simulated registration with the recovered
      source sequence continuing without reuse or a test-only commit bypass.

  - id: V04
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Verified built-in EventDataProvider/TimingDataProvider selection using the
      stable reference IDs plus one synthetic external provider JAR loaded through
      URLClassLoader + ServiceLoader via the same typed ExtensionRegistry startup
      mechanism. Java issue #287 / PR #302 is green and merged.

  - id: V05
    lane: verification
    kind: verification
    state: done
    depends_on: [A04]
    note: >-
      Completed through Java PR #332. VC-ST1-005 passed in black-box system
      verification: OPEN/CLOSE lifecycle records share source order with
      registrations, already-in-state requests commit no lifecycle record,
      restart recovers committed history without live replay and the next OPEN
      continues the sequence.

  - id: V06
    lane: verification
    kind: verification
    state: planned
    depends_on: [A05]
    note: >-
      Server-side VC-ST1-006 is green through Java PR #332: ADD remains
      immutable, accepted REV records append in source order, repeated
      well-formed raw revoke is not business-deduplicated, malformed IF-03 input
      is rejected before commit and restart preserves history. Remaining
      qualification is the manual VC-ST1-003 Development Client run proving the
      trash action, DELETED interpreted projection and restart/recovery in the
      real JavaFX client.

  - id: V07
    lane: verification
    kind: verification
    state: done
    depends_on: [A06]
    note: >-
      Completed with the automated verification delivered in Java PR #338:
      IF-03 MAN_REG ADD covers AUTO and MAN client-time classification, TimingNode
      tests verify lifecycle/recorded timestamp precision, and Development Client
      tests cover hundredth-second canonical input plus current-open-location/All
      registration projection.

  - id: V08
    lane: verification
    kind: verification
    state: done
    depends_on: [A07]
    note: >-
      Completed through Java issue #340 / PR #341. End-to-end runtime verification
      starts simple, normal and edge through SimulationControl, observes both mapped
      tags in normal, proves the selected edge variant remains single-tag and confirms
      all three scenarios commit AUTO_REG only through the full
      SimulatedAntenna -> AntennaManager -> TagProcessor -> TimingNode path.
