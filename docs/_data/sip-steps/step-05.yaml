step: 5

planning_changes:
  - date: '2026-10-04'
    change: >-
      D01 fixed the single-TimingNode runtime measurement baseline; A01 is now
      the active implementation activity.
  - date: '2026-10-04'
    change: >-
      Step 5 activated after Step-4 VC-ST1-003 closure; D01 is the first active
      planning/design activity.
  - date: '2026-10-02'
    change: >-
      Narrowed Step 5 to one-TimingNode simulated antenna input and runtime behaviour.
  - date: '2026-10-02'
    change: >-
      Added explicit runtime performance and memory engineering so scheduling,
      allocation and data-access choices are measurement-driven.
  - date: '2026-10-03'
    change: >-
      Assigned TimingNode OPEN/CLOSE TimingData to Step 5; D02 updates IF-05/IDD
      before implementation and verification. Step-4 baseline is unchanged.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Define the first project-owned thread/queue measurement approach, stable
      thread naming and the boundary between JVM scheduling preferences and
      later target-specific tuning. Thread priority is not a correctness rule.

  - id: D02
    lane: documentation
    kind: decision
    state: planned
    note: >-
      Define TimingNode OPEN/CLOSE TimingData semantics and the default/reference
      representation. Update 32-05 IF-05 and 33-05 IDD during Step 5, including
      transition time, captured LocationId, record-type presence rules and the
      rule that rejected lifecycle commands do not create committed TimingData.

  - id: D03
    lane: documentation
    kind: decision
    state: planned
    note: >-
      Promote registration revoke from reserved reference-format mapping to an
      explicit TimingData/API semantic. Define matching-record identity,
      repeated time/RegistrationId rules, idempotence/rejection and the rule
      that revoke appends a new committed record instead of rewriting history.

  - id: A01
    lane: application
    kind: implementation
    state: active
    depends_on: [D01]
    note: >-
      Feed deterministic tag observations through the built-in
      SimulatedAntenna, normal tag interpretation/filtering and the existing
      accepted-registration path for one TimingNode. Use a small synthetic local
      reference fixture for TagId-to-RegistrationId resolution; do not add
      backoffice synchronisation here.

  - id: A02
    lane: application
    kind: implementation
    state: planned
    depends_on: [D01, A01]
    note: >-
      Add low-allocation monotonic markers and primitive counters for queue
      admission/depth/high-water, queue wait, processing, persistence and
      selected thread/GC observations. Avoid per-event metric-object allocation
      and high-volume logging.

  - id: A03
    lane: application
    kind: decision
    state: planned
    depends_on: [A01, A02]
    note: >-
      Use measurements to decide where direct traversal, cached state, reusable
      scratch storage or ordinary allocation are appropriate. Do not introduce
      pooling or copied snapshots by default.

  - id: A04
    lane: application
    kind: implementation
    state: planned
    depends_on: [D02]
    note: >-
      Commit successful TimingNode OPEN/CLOSE transitions through the same
      TimingNode-owned sequence, LogBook and persistence path as other committed
      TimingData. Do not add a second lifecycle record owner or a UI/test-only
      persistence bypass.

  - id: A05
    lane: application
    kind: implementation
    state: planned
    depends_on: [D03]
    note: >-
      Add the public node-scoped revoke operation and commit REV through the same
      TimingNode-owned sequence, LogBook, persistence and committed-event path.
      Wire the Development Client trash action to that operation; never delete
      or rewrite the original ADD record.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01, A02, A03]
    note: >-
      Exercise one TimingNode with representative synthetic tag/reference data
      and growing committed-record volumes. Measure forward progress, input to
      commit latency, queue high-water, CPU/thread behaviour, allocation/GC and
      history/query cost. These are engineering baselines, not product limits.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [V01]
    note: >-
      Verify that sustained or bursty tag input cannot monopolize the ingress
      path and starve required TimingNode processing or lower-priority services.
      Add bounded batching/admission only if the measurements justify it.

  - id: V03
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Restart SI-01 after simulated registrations, rebuild committed history and
      continue through the same SimulatedAntenna path without sequence reuse or
      a test-only bypass.

  - id: V04
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Verify built-in provider selection plus one synthetic external provider
      through the same typed startup mechanism intended for later real adapters.

  - id: V05
    lane: verification
    kind: verification
    state: planned
    depends_on: [A04]
    note: >-
      Verify OPEN/CLOSE TimingData in source order with registrations, including
      persisted restart/recovery and sequence continuity. Verify rejected or
      idempotent lifecycle requests according to the Step-5 D02 semantics and
      confirm that no unintended lifecycle record is committed.

  - id: V06
    lane: verification
    kind: verification
    state: planned
    depends_on: [A05]
    note: >-
      Verify revoke through the public API and Development Client: the original
      ADD remains in the technical LogBook, REV is appended in source order, the
      interpreted row remains visible as DELETED, restart/recovery preserves
      both records and repeated/invalid revoke follows the D03 semantics.
