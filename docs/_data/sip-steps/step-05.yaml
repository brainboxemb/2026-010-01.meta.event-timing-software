step: 5

planning_changes:
  - date: '2026-10-07'
    change: >-
      T01 completed through Java PR #327; V01 baseline characterization is next.
  - date: '2026-10-06'
    change: >-
      A01 requalified on Java main; V04 provider bootstrap verified through PR
      #302 with built-in reference providers and a synthetic external provider JAR.
  - date: '2026-10-04'
    change: >-
      D05 runtime measurement design is complete; A01 remains active because the
      antenna/tag-processing path is not yet wired into runtime composition.
  - date: '2026-10-04'
    change: >-
      D01 reopened and decomposed into D04/D05 design gates plus T01 harness;
      A01/A02 prototypes require requalification and V01 now precedes A03.
  - date: '2026-10-04'
    change: >-
      D01 fixed the single-TimingNode runtime measurement baseline; A01 is now
      the active implementation activity.
  - date: '2026-10-04'
    change: >-
      Step 5 activated after Step-4 VC-ST1-003 closure; D01 is the first active
      planning/design activity.
  - date: '2026-10-02'
    change: >-
      Narrowed Step 5 to one-TimingNode simulated antenna input and runtime behaviour.
  - date: '2026-10-03'
    change: >-
      Assigned TimingNode OPEN/CLOSE TimingData to Step 5; D02 updates IF-05/IDD
      before implementation and verification. Step-4 baseline is unchanged.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      Define measurement questions, engineering/tooling split, product design
      gates, reproducible evidence flow and roadmap order before accepting
      runtime-characterization implementation.

  - id: D02
    lane: documentation
    kind: decision
    state: done
    note: >-
      Defines successful CLOSED->OPEN and OPEN->CLOSED lifecycle TimingData,
      transition time/location capture, NODE_INFO with OPEN/CLOSE code in the
      development-v1 mapping and the rule that no-op/rejected/failed lifecycle
      commands do not create committed TimingData.

  - id: D03
    lane: documentation
    kind: decision
    state: done
    note: >-
      Defines append-only registration revoke as a new TimingData record using
      the same regId and original time. AUTO_REG uses REV; MAN_REG uses REV with
      the original AUTO/MAN subcode. TimingNode/LogBook remain bookkeeping and
      do not infer active/deleted business state from prior ADD/REV history.

  - id: D04
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Review the simulated antenna/input architecture: stable observation
      boundary, TagProcessor/filter/resolution ownership, callback/threading
      expectations and separation of product concepts from synthetic fixtures.

  - id: D05
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Define the internal pull-based runtime measurement reader for queue,
      persistence, commit/event, TagProcessor and JVM snapshots without exposing
      engineering measurements through TimingData, Domain semantics or IF-03.

  - id: T01
    lane: tooling
    kind: setup
    state: done
    depends_on: [D01]
    note: >-
      Completed through Java PR #327: the optional runtime-characterization
      profile/module drives deterministic steady/burst/history workloads through
      the normal SimulatedAntenna -> TagProcessor -> TimingNode -> file-backed
      TimingData path and retains per-run JSON evidence from RuntimeMeasurementReader.

  - id: A01
    lane: application
    kind: implementation
    state: done
    depends_on: [D04]
    note: >-
      Requalified the simulated-input path on Java main: Event-based
      TagObservation(TagId, RSSI, time), AntennaManager lifecycle/health/inventory,
      EventData TagId -> RegistrationId resolution, registration-keyed duplicate
      and passage filtering, and the normal TimingNode-owned
      TimingData/persistence/LogBook path. Normal Windows development startup now
      also exercises AntennaManager through the clearly logged simulated-antenna
      platform default.

  - id: A02
    lane: application
    kind: implementation
    state: done
    depends_on: [D05, A01]
    note: >-
      Requalified and corrected on Java main through PR #325: runtime measurement
      is removed from the public TimingNode/TimingNodeTypes contract and exposed
      through engineering-only runtime.measurement.RuntimeMeasurementReader using
      component-owned TimingNode, TagProcessor, lane and JVM snapshots.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [D01, D04, D05, T01, A01, A02]
    note: >-
      Hosted Linux steady/burst/growing-history evidence is retained on
      prod/characterization for Java revision efc5797f2fb4. Repeat the relevant
      baseline on Raspberry Pi Zero
      and Raspberry Pi 3 Model B, including live thread count and effective JVM
      stack configuration. Qualify any explicit -Xss tuning on target hardware;
      do not infer it from workstation defaults. These are engineering baselines,
      not product limits.

  - id: A03
    lane: application
    kind: decision
    state: planned
    depends_on: [V01]
    note: >-
      Decide from V01 evidence whether ordinary allocation/direct traversal and
      the current execution model remain adequate or which specific change is
      justified. Re-run affected V01 workloads after a design change.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [A03]
    note: >-
      Verify sustained/bursty tag observations and stalled downstream delivery cannot
      starve required TimingNode work or create unbounded application-owned
      delivery state. Introduce fairness/backpressure changes only when required
      by contract or supported by evidence.

  - id: A04
    lane: application
    kind: implementation
    state: done
    depends_on: [D02]
    note: >-
      Commit successful TimingNode OPEN/CLOSE transitions through the same
      TimingNode-owned sequence, LogBook and persistence path as other committed
      TimingData. Completed through Java PR #330 using NODE_INFO OPEN/CLOSE,
      durable commit before successful status publication and the existing
      committed-event path.

  - id: A05
    lane: application
    kind: implementation
    state: done
    depends_on: [D03]
    note: >-
      Add the public node-scoped revoke operation and commit REV through the same
      TimingNode-owned sequence, LogBook, persistence and committed-event path.
      Wire the Development Client trash action to that operation; never delete
      or rewrite the original ADD record. Completed through Java PR #330 with
      TimingNode/LogBook kept as bookkeeping rather than ADD/REV business-state
      interpretation.

  - id: V03
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Completed through Java PR #333. The runtime integration verification
      commits registrations through SimulatedAntenna -> TagProcessor ->
      TimingNode -> persistence/LogBook, restarts against the same persisted
      history, confirms operational OPEN/location state is not restored, then
      reopens and commits another simulated registration with the recovered
      source sequence continuing without reuse or a test-only commit bypass.

  - id: V04
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Verified built-in EventDataProvider/TimingDataProvider selection using the
      stable reference IDs plus one synthetic external provider JAR loaded through
      URLClassLoader + ServiceLoader via the same typed ExtensionRegistry startup
      mechanism. Java issue #287 / PR #302 is green and merged.

  - id: V05
    lane: verification
    kind: verification
    state: done
    depends_on: [A04]
    note: >-
      Completed through Java PR #332. VC-ST1-005 passed in black-box system
      verification: OPEN/CLOSE lifecycle records share source order with
      registrations, already-in-state requests commit no lifecycle record,
      restart recovers committed history without live replay and the next OPEN
      continues the sequence.

  - id: V06
    lane: verification
    kind: verification
    state: planned
    depends_on: [A05]
    note: >-
      Server-side VC-ST1-006 is green through Java PR #332: ADD remains
      immutable, accepted REV records append in source order, repeated
      well-formed raw revoke is not business-deduplicated, malformed IF-03 input
      is rejected before commit and restart preserves history. Remaining
      qualification is the manual VC-ST1-003 Development Client run proving the
      trash action, DELETED interpreted projection and restart/recovery in the
      real JavaFX client.
