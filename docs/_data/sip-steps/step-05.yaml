step: 5

planning_changes:
  - date: '2026-10-02'
    change: >-
      Added explicit Step-5 runtime performance and memory engineering so
      scheduling, allocation and data-access choices are measurement-driven.

activities:
  - id: D01
    lane: documentation
    kind: decision
    title: Runtime performance and execution policy
    state: planned
    note: >-
      Define the first project-wide execution policy for project-owned threads:
      stable thread naming, named priority roles, Java priority mapping and the
      boundary between JVM policy and target/deployment tuning. Treat priority as
      a scheduling preference only, never as a correctness mechanism.

  - id: A01
    lane: application
    kind: implementation
    title: Synthetic timing flow
    state: planned
    depends_on: [D01]
    note: >-
      Drive repeatable synthetic registration/device flows through the normal
      TimingNode and persistence paths without physical timing hardware.

  - id: A02
    lane: application
    kind: implementation
    title: Performance markers and runtime counters
    state: planned
    depends_on: [D01, A01]
    note: >-
      Add low-allocation monotonic timing markers and primitive counters for
      queue admission/depth/high-water, queue wait, operation execution,
      persistence latency, event delivery and selected thread/GC observations.
      Avoid per-event metric-object allocation and high-volume logging.

  - id: A03
    lane: application
    kind: decision
    title: Allocation and data-access strategy
    state: planned
    depends_on: [A01, A02]
    note: >-
      Measure and decide where direct traversal, cached/derived state, reusable
      scratch storage, object reuse/pools or ordinary allocation are cheaper.
      Include ranking/reference-data paths; do not introduce pools or copied
      snapshots by default.

  - id: V01
    lane: verification
    kind: verification
    title: Synthetic scale and burst characterization
    state: planned
    depends_on: [A01, A02, A03]
    note: >-
      Use a representative scale baseline of 2000 teams across multiple
      TimingNodes (including a three-node scenario) plus high committed-record
      volumes up to 9999 where applicable. Measure forward progress, ingress to
      commit latency, queue high-water, CPU/thread behaviour, allocation/GC and
      query/ranking cost. These are verification baselines, not product limits.

  - id: V02
    lane: verification
    kind: verification
    title: Sustained RFID ingress fairness
    state: planned
    depends_on: [V01]
    note: >-
      Verify that sustained/bursty tag input cannot monopolize a high-priority
      ingress path and starve TimingNode processing or lower-priority services.
      Use the measurements to define any required bounded batch/admission guard.

  - id: V03
    lane: verification
    kind: verification
    title: Restart and recovery scenarios
    state: planned
    depends_on: [A01]
    note: >-
      Extend black-box timing scenarios with persistence/restart/reconnect and
      prove the synthetic path remains the same path intended for later real
      hardware.
