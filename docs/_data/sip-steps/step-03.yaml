step: 3
title: Minimal version/status application on development host
state: active
summary: >-
  Build the first long-running Headless Timing Application from external configuration.
  One TimingNode is configured. Console, remote shell, HTTP and WebSocket expose the
  same version/status.

demonstration:
  bullets:
    - Start the Headless Timing Application on Windows from external configuration.
    - Show the configured TimingNode, current version/status and runtime log file.
    - Read the same version/status through console, remote shell, HTTP and WebSocket.
documents:
  - name: 20-01-SRD
    title: SI-01 first executable requirements
    maturity: review
    completeness: 100
  - name: 40-01-IDD
    title: Application control/status interface
    maturity: review
    completeness: 100
  - name: 40-02-IDD
    title: Application configuration interface
    maturity: review
    completeness: 100
  - name: 31-01-SAD
    title: SI-01 application/configuration architecture
    maturity: review
    completeness: 95
  - name: 50-SVP
    title: First executable ST-1 evidence
    maturity: working
    completeness: 90

activities:
  - id: A01
    lane: application
    kind: implementation
    title: Shared application boundary + build identity
    state: done
    note: >-
      CommandHandler is the current shared application-facing boundary and BuildIdentity
      remains build provenance rather than deployment configuration.

  - id: A02
    lane: application
    kind: implementation
    title: Application configuration + minimal TimingNode
    state: done
    depends_on: [A01]
    note: >-
      Load one external application.yml, validate its TimingNodeId and compose one
      TimingNode. Presentation settings, multiple TimingNodes and overlays stay out of A02.

  - id: A03
    lane: application
    kind: implementation
    title: Run until shutdown + graceful stop
    state: done
    depends_on: [A02]
    note: >-
      Keep the configured application running until the OS/JVM requests shutdown.
      Ctrl+C or service/process stop uses the normal close path. Interactive
      console commands such as quit or Ctrl+Q belong to A04.

  - id: A04
    lane: application
    kind: implementation
    title: Local console / debug shell
    state: active
    depends_on: [A01, A03]
    note: >-
      Provide help, version and status through the shared application boundary plus
      quit/exit for a graceful local stop. Keep console parsing in the presentation
      adapter. Acceptance includes a clean Windows checkout/build and an interactive
      help -> version -> status -> quit session.

  - id: A05
    lane: application
    kind: implementation
    title: Remote terminal / shell adapter
    state: planned
    depends_on: [A01, A03]

  - id: A06
    lane: application
    kind: implementation
    title: HTTP / JSON status adapter
    state: planned
    depends_on: [A01, A02, A03]

  - id: A07
    lane: application
    kind: implementation
    title: WebSocket status / event stream
    state: planned
    depends_on: [A01, A03, A06]

  - id: A08
    lane: application
    kind: implementation
    title: Runtime file logging
    state: planned
    depends_on: [A03]
    note: >-
      Write runtime logs to file with configurable level and basic rotation/retention.
      Keep the backend open to additional diagnostic sinks; a live debug-UI stream is
      a later presentation consumer, not application status.

  - id: V01
    lane: verification
    kind: verification
    title: Shared behaviour + configuration unit tests
    state: planned
    depends_on: [A01, A02]

  - id: V02
    lane: verification
    kind: verification
    title: Adapter equivalence / state ownership checks
    state: planned
    depends_on: [A04, A05, A06, A07]

  - id: V03
    lane: verification
    kind: verification
    title: ST-1 application behaviour black-box test
    state: planned
    depends_on: [A02, A04, A05, A06, A07, A08, V01, V02]

  - id: V04
    lane: verification
    kind: verification
    title: Windows built-artifact execution proof
    state: planned
    depends_on: [V03]

  - id: V05
    lane: verification
    kind: verification
    title: Step-3 0.2.x release / identity proof
    state: planned
    depends_on: [V03, V04]
    note: >-
      v0.2.1 is the current published Step-3 baseline; normal development continues
      on 0.2.2-SNAPSHOT and Step 3 closes on the next accepted 0.2.x release.
