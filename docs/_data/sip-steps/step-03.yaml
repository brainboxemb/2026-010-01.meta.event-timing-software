step: 3
title: Minimal version/status application on development host
state: active
summary: >-
  Build the first long-running Headless Timing Application from external configuration.
  One TimingNode is configured. Console, remote shell, HTTP and WebSocket expose the
  same version/status.

demonstration:
  bullets:
    - Start the Headless Timing Application on Windows from external configuration.
    - Show the configured TimingNode, current version/status and runtime log file.
    - Read the same version/status through console, remote shell, HTTP and WebSocket.
planning_changes:
  - date: 2026-09-25
    change: >-
      A02 was narrowed to one external application.yml producing one TimingNodeId
      and one TimingNode; presentation configuration was deferred.
  - date: 2026-09-25
    change: >-
      A03 was clarified as run until shutdown plus graceful stop; interactive
      console control moved to A04.
  - date: 2026-09-25
    change: >-
      A04 and A05 were separated into local console and remote terminal/shell;
      both use the same application command behaviour.
  - date: 2026-09-25
    change: >-
      A08 Runtime file logging was added to Step 3, with live debug logging kept
      as a later diagnostic presentation consumer.
  - date: 2026-09-25
    change: >-
      Verification progress was refreshed: V01 is complete and V04 now covers
      Windows development-host proof including user/NetBeans acceptance.

documents:
  - name: 20-01-SRD
    title: SI-01 first executable requirements
    maturity: review
    completeness: 100
  - name: 40-01-IDD
    title: Application control/status interface
    maturity: review
    completeness: 100
  - name: 40-02-IDD
    title: Application configuration interface
    maturity: review
    completeness: 100
  - name: 31-01-SAD
    title: SI-01 application/configuration architecture
    maturity: review
    completeness: 95
  - name: 50-SVP
    title: Verification strategy + ST-1 profile
    maturity: working
    completeness: 90

activities:
  - id: A01
    lane: application
    kind: implementation
    title: Shared application boundary + build identity
    state: done
    note: >-
      CommandHandler is the current shared application-facing boundary and BuildIdentity
      remains build provenance rather than deployment configuration.

  - id: A02
    lane: application
    kind: implementation
    title: Application configuration + minimal TimingNode
    state: done
    depends_on: [A01]
    note: >-
      Load one external application.yml, validate its TimingNodeId and compose one
      TimingNode. Presentation settings, multiple TimingNodes and overlays stay out of A02.

  - id: A03
    lane: application
    kind: implementation
    title: Run until shutdown + graceful stop
    state: done
    depends_on: [A02]
    note: >-
      Keep the configured application running until the OS/JVM requests shutdown.
      Ctrl+C or service/process stop uses the normal close path. Interactive
      console commands such as quit or Ctrl+Q belong to A04.

  - id: A04
    lane: application
    kind: implementation
    title: Local console
    state: active
    depends_on: [A01, A03]
    note: >-
      Provide help, version and status through the shared application boundary plus
      quit/exit for a graceful local stop. Acceptance includes opening the Maven project
      in NetBeans on Windows, building/running with application.yml, then exercising
      help -> version -> status -> quit.

  - id: A05
    lane: application
    kind: implementation
    title: Remote terminal / shell adapter
    state: planned
    depends_on: [A01, A03, A04]
    note: >-
      Expose the same text-command semantics as the local console through a remote
      terminal connection. The transport changes; application command behaviour does not.

  - id: A06
    lane: application
    kind: implementation
    title: HTTP / JSON status adapter
    state: planned
    depends_on: [A01, A02, A03]

  - id: A07
    lane: application
    kind: implementation
    title: WebSocket status / event stream
    state: planned
    depends_on: [A01, A03, A06]

  - id: A08
    lane: application
    kind: implementation
    title: Runtime file logging
    state: planned
    depends_on: [A03]
    note: >-
      Write runtime logs to file with configurable level and basic rotation/retention.
      Keep the backend open to additional diagnostic sinks; a live debug-UI stream is
      a later presentation consumer, not application status.

  - id: V01
    lane: verification
    kind: verification
    title: Shared behaviour + configuration unit tests
    state: done
    depends_on: [A01, A02]
    note: >-
      Shared application-boundary, configuration and TimingNode identity behaviour is
      covered by the canonical Maven unit-test suite. Later activities extend that suite.

  - id: V02
    lane: verification
    kind: verification
    title: Adapter equivalence / state ownership checks
    state: planned
    depends_on: [A04, A05, A06, A07]

  - id: V03
    lane: verification
    kind: verification
    title: ST-1 application behaviour black-box test
    state: planned
    depends_on: [A02, A04, A05, A06, A07, A08, V01, V02]

  - id: V04
    lane: verification
    kind: verification
    title: Windows development-host execution proof
    state: active
    depends_on: [A03]
    note: >-
      Combine automated Windows execution of the canonical built artifact with a
      user-facing NetBeans open/build/run/console check on Windows.

  - id: V05
    lane: verification
    kind: verification
    title: Step-3 0.2.x release / identity proof
    state: planned
    depends_on: [V03, V04]
    note: >-
      v0.2.1 is the current published Step-3 baseline; normal development continues
      on 0.2.2-SNAPSHOT and Step 3 closes on the next accepted 0.2.x release.
