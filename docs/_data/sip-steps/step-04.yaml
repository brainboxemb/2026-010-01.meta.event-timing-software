step: 4

planning_changes:
  - date: '2026-09-30'
    change: >-
      Initial Step-4 activity board: use-case and requirement alignment now gates
      domain implementation because architecture is ahead of the promoted functional baseline.

activities:
  - id: D01
    lane: documentation
    kind: documentation
    title: Review Step-4 operational use cases
    state: next
    note: >-
      Review UC-001, UC-002, UC-003, UC-005, UC-010 and UC-014 from operational
      intent rather than fitting them to the current architecture. Inspect UC-013
      and UC-019 only to establish the recovery and test-tag boundaries.

  - id: D02
    lane: documentation
    kind: documentation
    title: Promote Step-4 domain requirements
    state: planned
    depends_on: [D01]
    note: >-
      Derive concrete SI-01 requirements for TimingNode lifecycle/state,
      registration sequence/history, StageStartTimes, NextUpTeams, RaceData,
      multi-TimingNode isolation and observable state changes. Keep hardware and
      Step-5 persistence/recovery detail out unless required by functional behaviour.

  - id: D03
    lane: documentation
    kind: decision
    title: Reconcile domain architecture and terminology
    state: planned
    depends_on: [D02]
    note: >-
      Check the existing TimingNode decomposition against the promoted
      requirements. Change component names, ownership or relationships when the
      behaviour requires it; do not rewrite use cases merely to preserve the
      current architecture diagram.

  - id: V01
    lane: verification
    kind: verification
    title: Define deterministic Step-4 acceptance examples
    state: planned
    depends_on: [D02, D03]
    note: >-
      Turn the promoted requirements into small synthetic examples and expected
      state transitions before implementation. These examples become the
      acceptance reference for the domain tests.

  - id: A01
    lane: application
    kind: implementation
    title: TimingNode lifecycle and state foundation
    state: planned
    depends_on: [V01]
    note: >-
      Implement only the lifecycle/state semantics justified by the reviewed use
      cases and requirements, including observable state needed by later domain
      capabilities.

  - id: A02
    lane: application
    kind: implementation
    title: Registration sequence and history
    state: planned
    depends_on: [A01]
    note: >-
      Implement hardware-independent accepted registration state, monotonic
      TimingNodeId-scoped sequence semantics and traceable history/LogBook
      behaviour. RFID decoding/filtering and durable recovery remain outside this activity.

  - id: A03
    lane: application
    kind: implementation
    title: StageStartTimes and RaceData
    state: planned
    depends_on: [A01]
    note: >-
      Implement the local reference-state semantics needed by one TimingNode,
      with clear ownership and deterministic update behaviour but without
      backoffice transport or persistence concerns.

  - id: A04
    lane: application
    kind: implementation
    title: NextUpTeams state and mutations
    state: planned
    depends_on: [A01]
    note: >-
      Implement the reviewed team-preparation semantics independently from keypad,
      CAN and display adapters. Preserve history only where the promoted
      functional requirements require it.

  - id: A05
    lane: application
    kind: integration
    title: Multi-TimingNode isolation and observable results
    state: planned
    depends_on: [A02, A03, A04]
    note: >-
      Compose several TimingNodes in-memory and prove that lifecycle, sequence,
      reference and next-up state remain isolated while shared runtime
      infrastructure does not leak mutable state between nodes.

  - id: V02
    lane: verification
    kind: verification
    title: Deterministic domain unit verification
    state: planned
    depends_on: [A02, A03, A04]
    note: >-
      Cover the promoted state-transition and invariant requirements with
      deterministic tests using controlled synthetic data and no production
      hardware, network or persistence dependency.

  - id: V03
    lane: verification
    kind: verification
    title: Step-4 domain scenario demonstration
    state: planned
    depends_on: [A05, V02]
    note: >-
      Demonstrate the SIP Step-4 end scenario: create TimingNodes, apply
      registration/reference/next-up changes and inspect isolated histories and
      resulting state through supported in-process application/domain boundaries.
