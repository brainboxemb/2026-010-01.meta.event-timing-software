step: 4

planning_changes:
  - date: '2026-10-01'
    change: >-
      Step-4 verification ordered as A03 -> black-box VC-ST1-002 -> client demo.
  - date: '2026-10-01'
    change: >-
      D01 Timing UI baseline completed; A03 client/API integration is active.
  - date: '2026-09-30'
    change: >-
      Step 4 narrowed to first-registration control; later timing/device/upstream scope deferred.

activities:
  - id: D01
    lane: documentation
    kind: documentation
    title: Engineering Client architecture + UI baseline
    state: done
    note: >-
      Complete the Engineering Client architecture and the concrete Step-4 Timing
      UI baseline: view layout, control availability, lifecycle/capability states,
      TimingData history/live presentation and reconnect/stale/live behaviour.
      Keep the module name test-client for now.

  - id: D02
    lane: documentation
    kind: documentation
    title: Review first-registration operational use cases
    state: done
    depends_on: [D01]
    note: >-
      Review only UC-001, UC-002, UC-003, UC-009 and the outbound-registration
      aspect of UC-011 for the first slice. Establish location/lifecycle rules,
      the direct accepted-registration path and observable registration state.

  - id: D02W
    lane: documentation
    kind: documentation
    title: Translate private compatibility behaviour
    state: done
    depends_on: [D02]
    note: >-
      Translate only safe abstract client-behaviour conclusions needed by the
      first slice, such as current state, registration history/live updates and
      reconnect/rebuild. Keep source identity and private protocol details outside
      the public repository.

  - id: D03
    lane: documentation
    kind: decision
    title: Establish first TimingData + public control contracts
    state: done
    depends_on: [D02, D02W]
    note: >-
      Define TimingNodeId and LocationId once in the TimingData/IDD contract,
      including the unassigned-location state while CLOSED; define registration
      TimingData, source sequence, observation time, IF-03 location/open/close and
      capability-gated direct accepted-registration simulation. Define only the
      minimal outbound semantic registration contract needed for later transport.

  - id: V01
    lane: verification
    kind: verification
    title: Define deterministic first-slice examples
    state: done
    depends_on: [D03]
    note: >-
      Cover unassigned location, location set while CLOSED, open, rejected location
      change while OPEN, direct registration with deterministic time, observable
      TimingData, close and location change after close.

  - id: A01
    lane: application
    kind: implementation
    title: TimingNode location and lifecycle
    state: done
    depends_on: [V01]
    note: >-
      Implement configured TimingNode identity, optional location while CLOSED,
      location validation, OPEN/CLOSED lifecycle and the invariant that active
      location cannot change while OPEN.

  - id: A02
    lane: application
    kind: implementation
    title: Direct registration + TimingData
    state: done
    depends_on: [A01]
    note: >-
      Implement the accepted-registration operation after the antenna/filtering
      boundary. TimingNode owns its source identity, active location and next
      sequence. Preserve accepted observation time and expose committed history.

  - id: A03
    lane: application
    kind: integration
    title: Engineering Client first-slice control
    state: active
    depends_on: [D01, A02]
    note: >-
      Add IF-03/client support for location, open/close, capability-gated direct
      registration simulation, registration history and live updates. Rebuild
      current state/history after reconnect before presenting data as live.

  - id: V02
    lane: verification
    kind: verification
    title: First-slice domain verification
    state: done
    depends_on: [A02]
    note: >-
      Verify lifecycle/location invariants, sequence ownership, historical
      LocationId capture and rejection of direct registration while CLOSED.

  - id: V03
    lane: verification
    kind: verification
    title: Automated first-registration black-box verification
    state: planned
    depends_on: [A03, V02]
    note: >-
      Automate VC-ST1-002 against SI-01 as a separate process through public
      IF-03 only: status -> location -> open -> accepted registration -> history
      + live event -> close -> reconnect/history rebuild and dedup.

  - id: V04
    lane: verification
    kind: verification
    title: Engineering Client running-system demo
    state: planned
    depends_on: [V03, A03]
    note: >-
      Manually run the same first-registration flow through the JavaFX Engineering
      Client after black-box verification is green. Verify control enablement,
      command feedback, history/live presentation and reconnect state without
      RFID hardware, filtering, RabbitMQ or backoffice infrastructure.
