step: 7

planning_changes:
  - date: '2026-10-13'
    change: >-
      Close A01/V01 by requalifying the existing multi-topology baseline on Java main
      revision 7d87344725d9deb8c91bfda524b35c085b53b401. VC-ST1-007 and VC-ST1-008
      both pass in the integrated -Psystem-test run, confirming independent node
      addressing, sequence isolation, separate LogBooks and restart recovery.
  - date: '2026-10-13'
    change: >-
      Complete D04 engineering upstream transport design. EngineeringApiUpstreamConnector
      reuses IF-03 POST /api/v1/dev/upstream/message and the existing SI-02 event
      WebSocket with role=upstream; outbound semantic messages are UPSTREAM_DATA events.
      No second listener port or SI-02 WebSocket lifecycle is added. SI-02 acts as the
      Central System Simulator and the connector enters the same UpstreamData boundary
      as RabbitMQ.
  - date: '2026-10-13'
    change: >-
      Complete the D02/D03 ordered-stream model before A02 implementation. TIMING_DATA
      keeps the existing per-node LogBook/IF-05 seqNr. Central-to-node RACE_DATA gets
      its own per-node source seq and carries incremental reserveTagMap/StageStartTimes
      changes. SI-01 ACKs RaceData only after ordered semantic application; gaps cause
      bidirectional REQ from the first missing sequence. SYNC advertises a stream's
      source head. REQ TIMING_DATA fromSeq=1 is the semantic equivalent of the legacy
      receive-all/package-id 0000 request.
  - date: '2026-10-13'
    change: >-
      Complete the D01 IF-06 baseline. Use one bidirectional UpstreamData model with
      a public/reference JSON representation: TIMING_DATA embeds structured IF-05
      records, while PING uses op=REQ/ANS with optional mode=HB and optional pingId.
      SI-01 sends heartbeat REQ immediately on connect/reconnect and every 30 seconds;
      manual PING omits mode. No unanswered-PING timeout policy is fixed yet.
  - date: '2026-10-13'
    change: >-
      Use one SI-02 Central System Simulator with two transports: IF-03 for deterministic
      ST-2 and RabbitMQ for hosted ST-3. Both exercise the same semantic upstream contract;
      deployment-specific protocol mappings remain below the UpstreamData boundary.
  - date: '2026-10-13'
    change: >-
      Activate Step 7 after Step 6 closeout and adopt the existing multi-node,
      node-addressing, separate-LogBook and restart-recovery implementation as the
      baseline instead of rebuilding that topology. Continue with reference-data,
      synchronization and backoffice integration work from that baseline.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      IF-06 now defines transport-independent UpstreamData: canonical TimingData,
      ordered RaceData, SYNC/ACK/REQ control, PING request/answer and status families. The public reference representation is versioned JSON; deployment-specific
      representations remain behind an UpstreamData provider/codec boundary. RabbitMQ
      and IF-03 remain connector transports below those semantics.

  - id: D02
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      EventData owns stable profile identity. RACE_DATA is the Central-owned ordered
      per-node live-data stream; reserveTagMap and stageStartTimes are incremental SET/DEL
      sections inside it. The TimingNode applies only the next expected RaceData seq,
      updates passive ReserveTagMap/StageStartTimes state, then ACKs the applied seq.
      StageTiming derives results from committed TimingData plus that live state.

  - id: D03
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      Synchronization keeps two independent source sequences per NodeId: TIMING_DATA
      uses the existing LogBook/IF-05 seqNr and RACE_DATA uses the Central-owned message
      seq. SYNC advertises a source head; REQ requests either stream from an inclusive
      sequence. RaceData is ACKed only after semantic application. The LogBook remains
      the TimingData replay source; control messages consume neither source sequence.

  - id: D04
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01, D03]
    note: >-
      EngineeringApiUpstreamConnector is the deterministic ST-2 connector. It accepts
      structured UpstreamData through the IF-03 development HTTP operation and emits
      outbound UpstreamData on the existing SI-02 event WebSocket designated with
      role=upstream. That same role connection drives connector connect/disconnect,
      PING and SYNC lifecycle. RabbitMQ uses the same semantic boundary; concrete broker
      topology/session mechanics remain below it.

  - id: A01
    lane: application
    kind: integration
    state: done
    note: >-
      Adopt the existing multi-node composition unchanged as the Step-7 baseline.
      Current one-system/two-node and two-system/one-node-each configurations remain
      the application topology used by upcoming upstream/reference work.

  - id: V01
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Requalified on Java main revision
      7d87344725d9deb8c91bfda524b35c085b53b401: VC-ST1-007 and VC-ST1-008 pass
      in the integrated black-box system-test run. This remains foundation evidence
      only; it does not prove reference-data or backoffice behaviour.

  - id: A02
    lane: application
    kind: implementation
    state: next
    depends_on: [D01, D02, V01]
    note: >-
      Implement the Central-to-node ordered RACE_DATA ingress base: source-sequence
      validation, semantic apply-before-ACK, gap detection/REQ, ReserveTagMap and
      StageStartTimes SET/DEL application, and TeamID interpretation without changing
      committed TimingData identity.

  - id: A03
    lane: application
    kind: implementation
    state: planned
    depends_on: [A02, D02]
    note: >-
      Implement StageTiming using the promoted node-owned reference/start-time model
      and existing committed TimingData stream. Keep calculation independent from
      concrete backoffice transport/session mechanics.

  - id: A04
    lane: application
    kind: implementation
    state: planned
    depends_on: [D01, D03, V01]
    note: >-
      Implement transport-independent SYNC/REQ replay in both directions: advertise
      TimingData head from LogBook, serve TIMING_DATA REQ from LogBook, compare the
      Central RACE_DATA head with the applied RaceData seq, and request missing RaceData.
      Local registration shall continue while upstream transport is unavailable.

  - id: A05
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, A02, A04]
    note: >-
      Add EngineeringApiUpstreamConnector plus the SI-02 Central System Simulator pane.
      SI-02 shall send ordered RACE_DATA, inspect ACK/REQ/SYNC and request LogBook
      TIMING_DATA over the existing IF-03 HTTP/WebSocket pair. The connector enters/leaves
      at the normal semantic upstream boundary; direct domain-object calls are not allowed.
      Do not tunnel pre-serialized RabbitMQ/private production payloads through the
      engineering API.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [A03, A05]
    note: >-
      Use the SI-02 Backend pane over the normal IF-03 API/Event connections to verify
      node-scoped reference-data application, TeamID/StageTiming results, outbound
      semantic events, acknowledgement/synchronization behaviour and recovery after
      IF-03 reconnect. This verifies upstream semantics but not RabbitMQ session/channel behaviour,
      which belongs to V03.

  - id: A06
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, V02]
    note: >-
      Implement/qualify RabbitMQ on both sides of the test topology: SI-01 uses
      RabbitMqUpstreamConnector and the existing SI-02 Central System Simulator gains a
      RabbitMqCentralSystemTransport. Both connect to the same hosted broker. Credentials/topology are supplied through secrets or
      external configuration; private production mappings/codecs stay outside the repo.

  - id: V03
    lane: verification
    kind: verification
    state: planned
    depends_on: [A06]
    note: >-
      Run ST-3 end-to-end as SI-02 Central System Simulator <-> hosted RabbitMQ <-> SI-01.
      Verify source-specific routing, broker connection/consumer recovery, acknowledgement
      behaviour and resumed pending delivery. Keep hosted-broker availability outside the
      mandatory fast-CI path.
