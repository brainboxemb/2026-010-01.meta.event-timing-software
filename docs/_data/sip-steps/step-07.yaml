step: 7

planning_changes:
  - date: '2026-10-13'
    change: >-
      Refine IF-06 PING/PONG semantics: classify heartbeat versus manually initiated
      liveness requests. PONG preserves request purpose, while an optional reference
      correlation identifier stays outside the mandatory top-level interface.
      Manual requests do not reset the 30-second heartbeat.
  - date: '2026-10-13'
    change: >-
      Complete the liveness baseline with correlated PING/PONG in both directions.
      SI-01 initiates immediately on connect and every 30 seconds, accepts matching
      PONG responses, and answers inbound PING. Missed-PONG timeout policy remains open.
  - date: '2026-10-13'
    change: >-
      Extend the completed IF-06 D01 baseline with application-level PING semantics:
      immediate PING on operational connect/reconnect, then every 30 seconds while
      connected. PING is UpstreamData and does not consume TimingData sequence.
  - date: '2026-10-13'
    change: >-
      Complete D01 by promoting IF-06 around shared UpstreamData semantics and adding
      the public/reference JSON representation. Replace the old UpstreamProtocol /
      BackofficeEnvelope concepts in architecture/design. D02 is next.
  - date: '2026-10-13'
    change: >-
      Use one SI-02 Backend Simulator with two transports: IF-03 for deterministic ST-2
      and RabbitMQ for hosted ST-3. Both exercise the same semantic backoffice contract;
      CloudAMQP or equivalent may provide the external broker.
  - date: '2026-10-13'
    change: >-
      Activate Step 7 after Step 6 closes on running-system SI-02 acceptance. D01 is now
      next: promote IF-06 backend semantic responsibilities before reference-data,
      synchronization or transport implementation proceeds.
  - date: '2026-10-13'
    change: >-
      Prepare Step 7 before activation. Existing SI-01 multi-node composition,
      node-scoped IF-03 addressing, separate LogBooks and restart recovery already
      have black-box coverage, so Step 7 adopts that as a baseline instead of
      reimplementing it. Make IF-06 semantics, reference-data/StageTiming ownership
      and synchronization rules the first design gates. D01 becomes next only after
      Step-6 V01 / VC-ST1-003 closes.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      IF-06 now defines transport-independent UpstreamData: canonical TimingData
      transfer plus reference-data, synchronization, PING/PONG and status families. The public
      reference representation is versioned JSON; deployment-specific representations
      remain behind an UpstreamData provider/codec boundary. RabbitMQ and IF-03 remain
      connector transports below those semantics.

  - id: D02
    lane: documentation
    kind: decision
    state: next
    depends_on: [D01]
    note: >-
      Define ownership and semantics for RaceData, StageStartTimes, TeamID
      interpretation and StageTiming. Specify node-scoped application, freshness and
      validation rules so derived timing does not become transport-owned behaviour.

  - id: D03
    lane: documentation
    kind: decision
    state: planned
    depends_on: [D01]
    note: >-
      Define pending outbound work and synchronization semantics: acknowledgement,
      retry, duplicate/idempotency handling, sequence preservation, recovery after
      outage and the status needed to diagnose incomplete synchronization.

  - id: D04
    lane: documentation
    kind: decision
    state: planned
    depends_on: [D01, D03]
    note: >-
      Align 43-01-SDD-03 with the promoted IF-06 contract and define the engineering
      topology: EngineeringApiBackofficeConnector is the deterministic ST-2 connector,
      using IF-03 HTTP inbound plus typed WebSocket outbound/status events. The connector
      maps to the same semantic upstream boundary used by RabbitMqBackofficeConnector.
      ST-3 then qualifies RabbitMQ against an external hosted broker such as CloudAMQP.
      Keep transport/session mechanics below the semantic upstream boundary.

  - id: A01
    lane: application
    kind: integration
    state: planned
    note: >-
      Adopt the existing multi-node composition as the Step-7 baseline rather than
      adding a second topology model. Requalify current one-system/two-node and
      two-system/one-node-each configurations for the upcoming upstream/reference path.

  - id: V01
    lane: verification
    kind: verification
    state: planned
    depends_on: [A01]
    note: >-
      Requalify node addressing, sequence isolation, separate physical LogBooks and
      restart recovery using the existing multi-topology black-box fixtures. This is
      foundation evidence only; it does not prove reference-data or backoffice behaviour.

  - id: A02
    lane: application
    kind: implementation
    state: planned
    depends_on: [D01, D02, V01]
    note: >-
      Implement node-scoped semantic reference-data ingress and application-owned
      RaceData/StageStartTimes updates, including TeamID interpretation without
      changing committed TimingData identity.

  - id: A03
    lane: application
    kind: implementation
    state: planned
    depends_on: [A02, D02]
    note: >-
      Implement StageTiming using the promoted node-owned reference/start-time model
      and existing committed TimingData stream. Keep calculation independent from
      concrete backoffice transport/session mechanics.

  - id: A04
    lane: application
    kind: implementation
    state: planned
    depends_on: [D01, D03, V01]
    note: >-
      Implement transport-independent outbound synchronization and pending-work state
      while preserving committed source identity/order and allowing local registration
      to continue while upstream transport is unavailable.

  - id: A05
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, A02, A04]
    note: >-
      Add EngineeringApiBackofficeConnector plus the SI-02 Backend pane. SI-02 shall
      edit/send synthetic RaceData and StageStartTimes over IF-03 HTTP and display typed
      outbound UpstreamData/synchronization events from the existing IF-03 WebSocket.
      The connector enters/leaves at the normal semantic backoffice boundary; direct
      domain-object calls are not allowed. Do not tunnel pre-serialized RabbitMQ/private
      production payloads through the engineering API.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [A03, A05]
    note: >-
      Use the SI-02 Backend pane over the normal IF-03 API/Event connections to verify
      node-scoped reference-data application, TeamID/StageTiming results, outbound
      semantic events, acknowledgement/synchronization behaviour and recovery after
      IF-03 reconnect. This verifies backoffice semantics but not RabbitMQ session/channel
      behaviour, which belongs to V03.

  - id: A06
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, V02]
    note: >-
      Implement/qualify RabbitMQ on both sides of the test topology: SI-01 uses
      RabbitMqBackofficeConnector and the existing SI-02 Backend Simulator gains a
      RabbitMqBackendTransport that plays the external backend peer. Both connect to
      the same hosted broker. Credentials/topology are supplied through secrets or
      external configuration; private production mappings/codecs stay outside the repo.

  - id: V03
    lane: verification
    kind: verification
    state: planned
    depends_on: [A06]
    note: >-
      Run ST-3 end-to-end as SI-02 Backend Simulator <-> hosted RabbitMQ <-> SI-01.
      Verify source-specific routing, broker connection/consumer recovery, acknowledgement
      behaviour and resumed pending delivery. Keep hosted-broker availability outside the
      mandatory fast-CI path.
