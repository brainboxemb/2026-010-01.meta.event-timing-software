step: 7

planning_changes:
  - date: '2026-10-13'
    change: >-
      Normalize Step-7 direction terminology: SI-01 is downstream of the external
      central race/event system, which is named Upstream System. Replace upstream/
      backend role names with upstream-system terminology while keeping UpstreamData
      unchanged.
  - date: '2026-10-13'
    change: >-
      Close A01/V01 by requalifying the existing multi-topology baseline on Java main
      revision 7d87344725d9deb8c91bfda524b35c085b53b401. VC-ST1-007 and VC-ST1-008
      both pass in the integrated -Psystem-test run, confirming independent node
      addressing, sequence isolation, separate LogBooks and restart recovery.
  - date: '2026-10-13'
    change: >-
      Complete D04 engineering-upstream transport design. EngineeringApiUpstreamConnector
      reuses IF-03 POST /api/v1/dev/upstream/message and the existing SI-02 event
      WebSocket with role=upstream; outbound semantic messages are UPSTREAM_DATA events.
      No second listener port or SI-02 WebSocket lifecycle is added. The connector enters
      the same UpstreamData boundary as RabbitMQ and its role connection drives the
      engineering connector lifecycle.
  - date: '2026-10-13'
    change: >-
      Complete D03 synchronization semantics. TimingData sync uses the highest contiguous
      IF-05 sequence known per NodeId; transport delivery acknowledgement is not semantic
      acknowledgement. Pending work is rebuilt from LogBook plus per-target backend
      progress, retransmission is idempotent by TimingData record identity, and fresh
      SYNC state is exchanged after connect/reconnect. Reference revisions are advertised
      through SYNC but reference payloads remain REFERENCE_DATA.
  - date: '2026-10-13'
    change: >-
      Complete D02 reference-data semantics. EventData remains stable profile identity;
      RaceData supplies live node-scoped RegistrationId-to-TeamId assignments only where
      EventData has no stable TeamId; StageStartTimes is a revisioned TeamId-to-start
      snapshot; StageTiming is derived from committed TimingData plus current reference
      state and never rewrites TimingData. Reference snapshots are atomic and revisioned
      per TimingNode + dataset.
  - date: '2026-10-13'
    change: >-
      Complete the D01 IF-06 baseline. Use one bidirectional UpstreamData model with
      a public/reference JSON representation: TIMING_DATA embeds structured IF-05
      records, while PING uses op=REQ/ANS with optional mode=HB and optional pingId.
      SI-01 sends heartbeat REQ immediately on connect/reconnect and every 30 seconds;
      manual PING omits mode. No unanswered-PING timeout policy is fixed yet.
  - date: '2026-10-13'
    change: >-
      Use one SI-02 Upstream System Simulator with two transports: IF-03 for deterministic ST-2
      and RabbitMQ for hosted ST-3. Both exercise the same semantic upstream contract;
      deployment-specific protocol mappings remain below the UpstreamData boundary.
  - date: '2026-10-13'
    change: >-
      Activate Step 7 after Step 6 closeout and adopt the existing multi-node,
      node-addressing, separate-LogBook and restart-recovery implementation as the
      baseline instead of rebuilding that topology. Continue with reference-data,
      synchronization and upstream integration work from that baseline.

activities:
  - id: D01
    lane: documentation
    kind: decision
    state: done
    note: >-
      IF-06 now defines transport-independent UpstreamData: canonical TimingData
      transfer plus reference-data, synchronization, PING request/answer and status
      families. The public reference representation is versioned JSON; deployment-specific
      representations remain behind an UpstreamData provider/codec boundary. RabbitMQ
      and IF-03 remain connector transports below those semantics.

  - id: D02
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      EventData owns stable profile identity. RaceData owns live node-scoped
      RegistrationId-to-TeamId fallback assignments; StageStartTimes owns revisioned
      TeamId-to-start snapshots; StageTiming derives results from committed TimingData
      plus current reference state. Reference snapshots use atomic monotone revision
      semantics per TimingNode + dataset and remain transport-independent.

  - id: D03
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01]
    note: >-
      TimingData synchronization uses cumulative contiguous IF-05 sequence progress
      per NodeId. Backend progress is the semantic acknowledgement boundary; transport
      acknowledgement does not clear pending work. LogBook remains the replay payload
      source, per-target progress derives pending work, retransmission is idempotent by
      record identity, and reconnect requires fresh SYNC state.

  - id: D04
    lane: documentation
    kind: decision
    state: done
    depends_on: [D01, D03]
    note: >-
      EngineeringApiUpstreamConnector is the deterministic ST-2 connector. It accepts
      structured UpstreamData through the IF-03 development HTTP operation and emits
      outbound UpstreamData on the existing SI-02 event WebSocket designated with
      role=upstream. That same role connection drives connector connect/disconnect,
      PING and SYNC lifecycle. RabbitMQ uses the same semantic boundary; concrete broker
      topology/session mechanics remain below it.

  - id: A01
    lane: application
    kind: integration
    state: done
    note: >-
      Adopt the existing multi-node composition unchanged as the Step-7 baseline.
      Current one-system/two-node and two-system/one-node-each configurations remain
      the application topology used by upcoming upstream/reference work.

  - id: V01
    lane: verification
    kind: verification
    state: done
    depends_on: [A01]
    note: >-
      Requalified on Java main revision
      7d87344725d9deb8c91bfda524b35c085b53b401: VC-ST1-007 and VC-ST1-008 pass
      in the integrated black-box system-test run. This remains foundation evidence
      only; it does not prove reference-data or upstream behaviour.

  - id: A02
    lane: application
    kind: implementation
    state: next
    depends_on: [D01, D02, V01]
    note: >-
      Implement node-scoped semantic reference-data ingress and application-owned
      RaceData/StageStartTimes updates, including TeamID interpretation without
      changing committed TimingData identity.

  - id: A03
    lane: application
    kind: implementation
    state: planned
    depends_on: [A02, D02]
    note: >-
      Implement StageTiming using the promoted node-owned reference/start-time model
      and existing committed TimingData stream. Keep calculation independent from
      concrete upstream transport/session mechanics.

  - id: A04
    lane: application
    kind: implementation
    state: planned
    depends_on: [D01, D03, V01]
    note: >-
      Implement transport-independent outbound synchronization and pending-work state
      while preserving committed source identity/order and allowing local registration
      to continue while upstream transport is unavailable.

  - id: A05
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, A02, A04]
    note: >-
      Add EngineeringApiUpstreamConnector plus the SI-02 Backend pane. SI-02 shall
      edit/send synthetic RaceData and StageStartTimes over IF-03 HTTP and display typed
      outbound UpstreamData/synchronization events from the existing IF-03 WebSocket.
      The connector enters/leaves at the normal semantic upstream boundary; direct
      domain-object calls are not allowed. Do not tunnel pre-serialized RabbitMQ/private
      production payloads through the engineering API.

  - id: V02
    lane: verification
    kind: verification
    state: planned
    depends_on: [A03, A05]
    note: >-
      Use the SI-02 Backend pane over the normal IF-03 API/Event connections to verify
      node-scoped reference-data application, TeamID/StageTiming results, outbound
      semantic events, acknowledgement/synchronization behaviour and recovery after
      IF-03 reconnect. This verifies upstream semantics but not RabbitMQ session/channel
      behaviour, which belongs to V03.

  - id: A06
    lane: application
    kind: integration
    state: planned
    depends_on: [D04, V02]
    note: >-
      Implement/qualify RabbitMQ on both sides of the test topology: SI-01 uses
      RabbitMqUpstreamConnector and the existing SI-02 Upstream System Simulator gains a
      RabbitMqUpstreamTransport that plays the external upstream-system peer. Both connect to
      the same hosted broker. Credentials/topology are supplied through secrets or
      external configuration; private production mappings/codecs stay outside the repo.

  - id: V03
    lane: verification
    kind: verification
    state: planned
    depends_on: [A06]
    note: >-
      Run ST-3 end-to-end as SI-02 Upstream System Simulator <-> hosted RabbitMQ <-> SI-01.
      Verify source-specific routing, broker connection/consumer recovery, acknowledgement
      behaviour and resumed pending delivery. Keep hosted-broker availability outside the
      mandatory fast-CI path.
