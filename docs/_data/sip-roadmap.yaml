status: working estimate / non-authoritative
start_date: "2026-09-12"
cadence_project_days_per_week: 1.0
planning_reserve_fraction: 0.25

actuals:
  through_date: "2026-10-02"
  estimated_project_days: 15.5
  estimated_hours: 124.1
  method: >-
    Approximation from commit activity within merged pull requests across the
    meta and implementation repositories. Each commit contributes a 60-minute
    activity window (30 minutes before and after); overlapping windows are merged
    and counted once. The project total merges all repository activity; per-step
    values use the same method after PR attribution. Hours are divided by 8 to
    obtain project days. This is a planning indication, not time tracking.
  step_pr_attribution:
    brainboxemb/2026-010-01.meta.event-timing-software:
      "1": {first_pr: 1, last_pr: 1}
      "2": {first_pr: 2, last_pr: 35}
      "3": {first_pr: 36, last_pr: 193}
      "4": {first_pr: 196}
    brainboxemb/2026-010-02.java.timing-point-application:
      "2": {first_pr: 2, last_pr: 24}
      "3": {first_pr: 26, last_pr: 72}
      "4": {first_pr: 74}

terms:
  - term: SI-01
    meaning: Timing Point Application
  - term: SI-02
    meaning: Planned Desktop GUI Application
  - term: TimingNode
    meaning: Logical timing unit with its own identity and state
  - term: ST-1
    meaning: Application black-box test profile
  - term: OTS
    meaning: Off-the-shelf hardware
  - term: O/W/R/A
    meaning: Document maturity — Outline / Working / Review / Accepted
  - term: R-60
    meaning: Review maturity; about 60% of expected document scope

documentation_maturity:
  levels:
    outline: Outline / only high-level intent needed
    working: Working detail sufficient for the next engineering activity
    review: Review candidate; intended contract/behaviour is concrete
    accepted: Accepted baseline for the applicable implemented scope
  principle: >-
    Maturity describes how stable/reviewable the established content is.
    Completeness estimates how much of the expected project-wide document scope
    has been worked out. A reviewable current slice may therefore be R-35 rather
    than R-100, and both maturity and completeness may grow in later steps.

notes:
  - Estimates are focused project days, not calendar days.
  - The baseline assumes approximately one focused project day per week.
  - Forecast end dates include the configured 25% planning reserve.
  - Future phase ends are displayed on Monday boundaries; this display rounding is not fed back into later cumulative forecasts.
  - Forecasts are planning aids, not commitments.
  - Actual effort is an approximate git-derived snapshot and is not used as formal time registration.
  - Per-step actuals use explicit merged-PR number boundaries per repository; original estimate, actual and remaining estimate are intentionally independent planning signals.
  - The original 11-step baseline totals 59 estimated project days before reserve and is retained as historical planning context.
  - Remaining estimates were re-evaluated on 2 October 2026 after Step-4 implementation evidence and the Step-5/Step-7 scope review; forecasts use the current remaining estimates, not original estimate minus actual.
  - Step 5 now owns one-TimingNode simulated antenna/runtime behaviour and TimingNode OPEN/CLOSE TimingData; multi-node, reference-data-driven StageTiming and backoffice integration are planned in Step 7.
  - Document maturity describes the established content; completeness is approximate project-wide document coverage, not completion of only the current slice.
  - Completeness percentages are planning indicators, intentionally coarse rather than time-tracking precision.
  - Planning changes belong on the matching per-step detail board, not on the broad roadmap.
  - Re-estimate when implementation evidence materially changes uncertainty.

