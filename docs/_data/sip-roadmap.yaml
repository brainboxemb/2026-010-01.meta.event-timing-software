status: working estimate / non-authoritative
start_date: 2026-09-12
cadence_project_days_per_week: 1.0
planning_reserve_fraction: 0.25
active_step: 2

documentation_maturity:
  levels:
    outline: Outline / only high-level intent needed
    working: Working detail sufficient for the next engineering activity
    review: Review candidate; intended contract/behaviour is concrete
    accepted: Accepted baseline for the applicable implemented scope
  principle: >-
    Maturity applies only to the documentation scope needed by the current/next
    capability. Future functionality may remain outline while earlier implemented
    scope is already accepted.

notes:
  - Estimates are focused project days, not calendar days.
  - The baseline assumes approximately one focused project day per week.
  - Target dates are planning aids, not commitments.
  - Documentation maturity and completeness are capability/step scoped, not a single score for the whole future product.
  - The overview roadmap names relevant documents compactly; concrete engineering activities belong on the per-step A3 board.
  - Re-estimate a step when implementation evidence materially changes uncertainty.

steps:
  "1":
    estimate_project_days: 1
    workstream: architecture
    docs:
      requirements:
        level: outline
        scope: system/domain direction; candidate requirements only
      idd:
        level: outline
        scope: interface catalogue and expected IDDs
      design:
        level: working
        scope: SSAD/SI-01 SAD/SDD architecture baseline
      verification:
        level: working
        scope: SVP strategy and planned test profiles
    documents:
      - {name: 10-SDP, title: Software Development Plan, maturity: review, completeness: 90}
      - {name: 11-SIP, title: Software Implementation Planning, maturity: review, completeness: 95}
      - {name: 12-SDE, title: Software Development Environment, maturity: accepted, completeness: 100}
      - {name: 30-SSAD, title: Software-system architecture, maturity: working, completeness: 90}
      - {name: 31-01-SAD, title: SI-01 architecture, maturity: working, completeness: 85}
      - {name: 50-SVP, title: Software Verification Plan, maturity: working, completeness: 80}
    note: remaining work after the current bootstrap round

