status: working estimate / non-authoritative
start_date: "2026-09-12"
cadence_project_days_per_week: 1.0
planning_reserve_fraction: 0.25

terms:
  - term: SI-01
    meaning: Headless Timing Application
  - term: SI-02
    meaning: Planned Desktop GUI Application
  - term: TimingNode
    meaning: Logical timing unit with its own identity and state
  - term: ST-1
    meaning: Application black-box test profile

documentation_maturity:
  levels:
    outline: Outline / only high-level intent needed
    working: Working detail sufficient for the next engineering activity
    review: Review candidate; intended contract/behaviour is concrete
    accepted: Accepted baseline for the applicable implemented scope
  principle: >-
    Maturity applies only to the documentation scope needed by the current/next
    capability. Future functionality may remain outline while earlier implemented
    scope is already accepted.

notes:
  - Estimates are focused project days, not calendar days.
  - The baseline assumes approximately one focused project day per week.
  - Target dates are planning aids, not commitments.
  - Documentation maturity and completeness are capability/step scoped, not a single score for the whole future product.
  - The roadmap names relevant documents compactly; concrete engineering activities belong on the matching per-step A4 board when such a drill-down exists.
  - Re-estimate a step when implementation evidence materially changes uncertainty.

steps:
  "1":
    estimate_project_days: 1
    workstream: architecture
    docs:
      requirements: {level: outline, scope: "first implementation direction"}
      idd: {level: outline, scope: "initial interface catalogue"}
      design: {level: working, scope: "SSAD/SI-01 architecture baseline"}
      verification: {level: working, scope: "initial verification direction"}
    documents:
      - {name: 10-SDP, title: Software Development Plan, maturity: review, completeness: 90}
      - {name: 11-SIP, title: Software Implementation Planning, maturity: review, completeness: 95}
      - {name: 30-SSAD, title: Software-system architecture, maturity: working, completeness: 85}
      - {name: 31-01-SAD, title: SI-01 architecture, maturity: working, completeness: 85}
      - {name: 50-SVP, title: Software Verification Plan, maturity: working, completeness: 75}

  "2":
    estimate_project_days: 6
    workstream: framework
    docs:
      requirements: {level: review, scope: "first executable SI-01 scope"}
      idd: {level: review, scope: "first Remote API version/status slice"}
      design: {level: working, scope: "module/package structure sufficient to code"}
      verification: {level: working, scope: "build/unit and first executable verification"}
    documents:
      - {name: 13-SDE, title: Java build/test toolchain, maturity: accepted, completeness: 100}
      - {name: 20-01-SRD, title: SI-01 first executable requirements, maturity: review, completeness: 100}
      - {name: 31-01-SDD-02, title: Java component/package design, maturity: working, completeness: 85}
      - {name: 40-01-IDD, title: Remote API interface, maturity: review, completeness: 100}

  "3":
    estimate_project_days: 3
    workstream: application
    docs:
      requirements: {level: working, scope: "configuration, lifecycle and public interface behaviour"}
      idd: {level: review, scope: "Remote API and application configuration"}
      design: {level: review, scope: "SI-01 composition exercised by code"}
      verification: {level: working, scope: "ST-1 plus manual engineering-client inspection"}
    documents:
      - {name: 20-01-SRD, title: SI-01 first executable requirements, maturity: review, completeness: 100}
      - {name: 40-01-IDD, title: Remote API interface, maturity: review, completeness: 100}
      - {name: 40-02-IDD, title: Application configuration interface, maturity: review, completeness: 100}
      - {name: 31-01-SAD, title: SI-01 architecture, maturity: review, completeness: 95}

  "4":
    estimate_project_days: 3
    workstream: platform
    docs:
      requirements: {level: working, scope: "target execution needs discovered from real Pi use"}
      idd: {level: outline, scope: "no new product interface expected"}
      design: {level: working, scope: "runtime/deployment choices based on target evidence"}
      verification: {level: working, scope: "real Pi execution and measurements"}
    documents:
      - {name: 12-SDE, title: Target development environment, maturity: working, completeness: 75}
      - {name: 50-SVP, title: Pi target verification, maturity: working, completeness: 75}

  "5":
    estimate_project_days: 3
    workstream: client
    docs:
      requirements: {level: working, scope: "first real GUI connection/status behaviour"}
      idd: {level: review, scope: "Remote API consumed by SI-02"}
      design: {level: outline, scope: "GUI technology and internal architecture decided when step starts"}
      verification: {level: working, scope: "GUI connect/status/reconnect behaviour"}
    documents:
      - {name: 31-02-SAD, title: Desktop GUI architecture, maturity: outline, completeness: 45}
      - {name: 40-01-IDD, title: Remote API interface, maturity: review, completeness: 100}

  "6":
    estimate_project_days: 6
    workstream: domain
    docs:
      requirements: {level: working, scope: "registration, timing data and persistence behaviour"}
      idd: {level: working, scope: "interfaces needed by implemented domain behaviour"}
      design: {level: working, scope: "TimingNode data/timing design"}
      verification: {level: working, scope: "state, timing and restart/restore tests"}
    documents:
      - {name: 20-01-SRD, title: Timing application requirements, maturity: working, completeness: 75}
      - {name: 31-01-SAD, title: TimingNode architecture, maturity: review, completeness: 95}

  "7":
    estimate_project_days: 7
    workstream: hardware
    docs:
      requirements: {level: working, scope: "device behaviour selected for implementation"}
      idd: {level: working, scope: "device interfaces as they become concrete"}
      design: {level: working, scope: "adapter/lifecycle design for selected devices"}
      verification: {level: working, scope: "stub and representative hardware verification"}
    documents:
      - {name: 31-01-SAD, title: Device integration architecture, maturity: working, completeness: 80}
      - {name: 50-SVP, title: Device verification direction, maturity: working, completeness: 75}

  "8":
    estimate_project_days: 6
    workstream: backoffice
    docs:
      requirements: {level: working, scope: "required backoffice data flows"}
      idd: {level: working, scope: "semantic contract and selected transport"}
      design: {level: working, scope: "transport/recovery behaviour"}
      verification: {level: working, scope: "integration and disconnect/reconnect tests"}
    documents:
      - {name: 31-01-SAD, title: Backoffice integration architecture, maturity: working, completeness: 80}
      - {name: 50-SVP, title: Backoffice integration verification, maturity: working, completeness: 75}
