status: manager-facing presentation summary

terms:
  - term: SI-01
    meaning: Headless Timing Application
  - term: SI-02
    meaning: Desktop GUI Application
  - term: SI-03
    meaning: Web Operator Application
  - term: TimingNode
    meaning: Logical timing unit with its own identity and state
  - term: ST-1
    meaning: Application behaviour system-test profile
  - term: SIP-STPxx-DEMO
    meaning: Single end-of-step demonstration from the implementation plan

steps:
  "1":
    deliverable:
      - Architecture baseline for SI-01, SI-02 and SI-03
      - Agreed runtime, package and interface boundaries
      - Build, test and verification direction ready for coding
    demonstration:
      - Walk the architecture book and key diagrams
      - Show process, runtime and package boundaries
      - Show public interfaces and verification layers

  "2":
    deliverable:
      - Reusable framework JAR plus runnable application JAR
      - Clean bootstrap, build and test on Linux and Windows
      - Build identity, logging and clean application lifecycle
    demonstration:
      - Restore pinned tooling from a clean checkout
      - Run Maven verify and produce both artifacts
      - Start the app, show its version and stop cleanly

  "3":
    deliverable:
      - Headless SI-01 starts from external configuration
      - Shared version/status plus retained runtime logging
      - Console, remote shell, HTTP and WebSocket show the same state
    demonstration:
      - Start SI-01 on Windows from external configuration
      - Show the configured TimingNode, version/status and runtime log file
      - Read the same version/status through all four interfaces

  "4":
    deliverable:
      - Reproducible Raspberry Pi Zero image
      - Versioned application update without reflashing
      - First target-hardware resource baseline
    demonstration:
      - Flash the generated image and boot the target
      - Query application version and status remotely
      - Update the app and verify the restart path

  "5":
    deliverable:
      - Separate desktop GUI client for SI-01
      - Network-only connection to the headless application
      - Same client works with local and Raspberry Pi endpoints
    demonstration:
      - Show live version and status in the GUI
      - Stop and restart SI-01 and show reconnect behaviour
      - Switch the GUI from local to Raspberry Pi endpoint

  "6":
    deliverable:
      - External reference and test project
      - Framework consumed as a real external dependency
      - Repeatable ST-1 and ST-2 synthetic scenarios
    demonstration:
      - Build and run from the reference repository only
      - Start a synthetic TimingNode composition
      - Exercise the socket simulator and reconnect flow

  "7":
    deliverable:
      - Private implementation can replace a public stub
      - Both use the same public framework contract
      - Public build remains independent of private source
    demonstration:
      - Run the public-stub composition
      - Swap in the private implementation
      - Show equivalent higher-level application behaviour

  "8":
    deliverable:
      - Deterministic timing data and state foundation
      - Registration, ready-team and reference-data state
      - Restart and restore with source-sequence continuity
    demonstration:
      - Run two independent synthetic registration sources
      - Update state and show a derived timing result
      - Restart and prove state and sequences are restored

  "9":
    deliverable:
      - Browser and iPad operator application
      - Live HTTP and WebSocket operation against SI-01
      - Explicit stale and reconnect behaviour
    demonstration:
      - Operate SI-01 from a representative browser or iPad
      - Interrupt the connection and show stale state
      - Reconnect to a fresh snapshot and live updates

  "10":
    deliverable:
      - Controlled synthetic hardware environment
      - RFID, CAN, keypad and display lifecycle simulation
      - Deterministic device fault and recovery injection
    demonstration:
      - Drive the normal synthetic device lifecycle
      - Inject reads, discovery and display updates
      - Force a failure and demonstrate recovery

  "11":
    deliverable:
      - Real RFID, CAN and display adapters
      - Representative hardware-capable SI-01 deployment
      - Observable device status and recovery
    demonstration:
      - Run SI-01 with representative real hardware
      - Capture registrations and device discovery
      - Force a recoverable device failure and recover

  "12":
    deliverable:
      - Backoffice-integrated SI-01 application
      - Offline-safe, source-aware synchronisation
      - Reproducible RabbitMQ integration tests
    demonstration:
      - Exchange data with a synthetic broker topology
      - Stop the broker while local operation continues
      - Restart it and reconcile pending data

  "13":
    deliverable:
      - Production-supportable Raspberry Pi deployment lifecycle
      - Provisioning, updates, rollback and diagnostics
      - Full operational ST-4 and hardware-test baseline
    demonstration:
      - Provision a clean target and start the service
      - Perform an update and failed-update rollback
      - Produce diagnostics and run the operational scenario
