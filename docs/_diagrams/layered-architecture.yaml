diagram:
  id: layered-architecture
  title: Figure SI01-01 — SI-01 layered architecture — responsibilities and services
  width: 1540
  height: 1280
  description: Working responsibility view of the reusable framework and executable application.
  note: Selected arrows show principal relationships only; high-level arrows may terminate on a layer boundary when component-level ownership is intentionally deferred.

