  layout: {x: 75, y: 667, w: 200, h: 50}

# SI01-01 is the logical (4+1) component/responsibility view, not a
# threading/execution model. TimingNode Data/Task lanes, TagProcessor scheduling
# and cooperative task execution are explained in the process view / Java detailed design.
# Keep functional node responsibilities visible and preserve enough vertical
# space for the packaging-component renderer's header and item text.
- id: next-up-teams
  object_id: NextUpTeams
  group: timing-node-aggregate
  label: "NextUpTeams"
  subtitle: "teams expected next"
  kind: service
  notation: component
