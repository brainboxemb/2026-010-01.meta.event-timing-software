  label: Presentation / external application interfaces
  kind: layer-presentation
  layout:
    x: 170
    y: 85
    w: 1110
    h: 155
- id: application-layer
  label: Application layer — running state and orchestration
  kind: layer-application
  layout:
    x: 170
    y: 270
    w: 1110
    h: 220
- id: domain-layer
  label: Domain layer — reusable services, rules and model
  kind: layer-domain
  layout:
    x: 170
    y: 520
    w: 1110
    h: 265
- id: infrastructure-layer
  label: Infrastructure / integrations
  kind: layer-infrastructure
  layout:
    x: 170
    y: 815
    w: 1110
    h: 175
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  layout:
    x: 170
    y: 1020
    w: 1110
    h: 110
- id: crosscutting-layer
  label: Cross-cutting
  kind: layer-crosscutting
  layout:
    x: 1310
    y: 85
    w: 245
    h: 1045
