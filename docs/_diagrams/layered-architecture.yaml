  label: "Logging\n\nDiagnostics\n\nBuild / version identity"
  kind: crosscutting
  layout: {x: 1210, y: 285, w: 170, h: 175}
- id: boundary-note
  group: crosscutting-layer
  label: "Responsibility view only\n≠ Maven artifact split"
  kind: crosscutting
  layout: {x: 1210, y: 1180, w: 170, h: 70}

