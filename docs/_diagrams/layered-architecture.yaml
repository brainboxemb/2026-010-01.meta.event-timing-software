diagram:
  id: layered-architecture
  title: SI-01 layered architecture — responsibilities and services
  width: 1540
  height: 1150
  description: Working responsibility view of the reusable framework and executable application.
  note: Selected arrows show principal relationships only; this is not a complete call graph or Maven artifact view.

groups:
- id: presentation-layer
  label: Presentation / external application interfaces
  kind: layer-presentation
  layout: {x: 120, y: 85, w: 1120, h: 145}
- id: application-layer
  label: Application layer — running state and orchestration
  kind: layer-application
  layout: {x: 120, y: 260, w: 1120, h: 230}
- id: domain-layer
  label: Domain layer — per-Waypoint responsibilities (1..N)
  kind: layer-domain
  layout: {x: 120, y: 520, w: 1120, h: 260}
- id: infrastructure-layer
  label: Infrastructure / integrations
  kind: layer-infrastructure
  layout: {x: 120, y: 810, w: 1120, h: 165}
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  layout: {x: 120, y: 1005, w: 1120, h: 100}
- id: crosscutting-layer
  label: Cross-cutting
  kind: layer-crosscutting
  layout: {x: 1270, y: 85, w: 230, h: 1020}

nodes:
- id: command-interfaces
  group: presentation-layer
  label: "Command / query interfaces\nHTTP / JSON • console • remote shell"
  kind: presentation
  layout: {x: 165, y: 135, w: 500, h: 65}
- id: status-interface
  group: presentation-layer
  label: "Status / event interface\nWebSocket"
  kind: presentation
  layout: {x: 895, y: 135, w: 300, h: 65}

- id: app-command-query
  group: application-layer
  label: "Commands / queries / workflows\nvalidate intent • coordinate use cases"
  kind: application
  layout: {x: 235, y: 315, w: 360, h: 75}
- id: app-state
  group: application-layer
  label: "1..N Waypoint aggregates\nUniqueID • LocationID • lifecycle/status"
  kind: application
  layout: {x: 625, y: 315, w: 300, h: 75}
- id: status-management
  group: application-layer
  label: "SystemStatus\napplication health • aggregate waypoint status"
  kind: application
  layout: {x: 955, y: 315, w: 240, h: 75}
- id: core-runtime
  group: application-layer
  label: "Core runtime support\nserialized execution • lifecycle • routing • scheduling"
  kind: runtime
  layout: {x: 625, y: 415, w: 300, h: 50}

- id: tag-processor
  group: domain-layer
  label: "TagProcessor\nRFID/tag observation processing"
  kind: service
  layout: {x: 165, y: 565, w: 300, h: 65}
- id: stage-start-time-registry
  group: domain-layer
  label: "StageStartTimeRegistry\nstage start-time reference data"
  kind: service
  layout: {x: 495, y: 565, w: 300, h: 65}
- id: waypoint-journal
  group: domain-layer
  label: "WaypointJournal\nregistrations • UniqueID sequence/persistence"
  kind: service
  layout: {x: 825, y: 565, w: 300, h: 65}
- id: prepare-team-registry
  group: domain-layer
  label: "PrepareTeamRegistry\nteams to prepare + traceable history"
  kind: service
  layout: {x: 165, y: 665, w: 300, h: 65}
- id: race-data
  group: domain-layer
  label: "RaceData\nparticipant/team • tag/reference data"
  kind: service
  layout: {x: 495, y: 665, w: 300, h: 65}
- id: stage-timing
  group: domain-layer
  label: "StageTiming\nrunning times + local ranking"
  kind: service
  layout: {x: 825, y: 665, w: 300, h: 65}

- id: persistence
  group: infrastructure-layer
  label: "Persistence / file storage\nrepository + backup / restore implementations"
  kind: storage
  layout: {x: 165, y: 860, w: 300, h: 75}
- id: backoffice
  group: infrastructure-layer
  label: "Backoffice integration\nsocket / RabbitMQ • race/start-time synchronisation"
  kind: integration
  layout: {x: 495, y: 860, w: 300, h: 75}
- id: device-integration
  group: infrastructure-layer
  label: "Device integrations\nRFID • CAN • display"
  kind: integration
  layout: {x: 825, y: 860, w: 300, h: 75}

- id: platform-primitives
  group: platform-layer
  label: Clock • filesystem • executors • process/network/OS primitives
  kind: platform
  layout: {x: 240, y: 1035, w: 880, h: 45}

- id: crosscutting-concerns
  group: crosscutting-layer
  label: "Logging\n\nConfiguration\n\nDiagnostics\n\nBuild / version identity"
  kind: crosscutting
  layout: {x: 1300, y: 165, w: 170, h: 235}
- id: boundary-note
  group: crosscutting-layer
  label: "Responsibility view only\n≠ Maven artifact split"
  kind: crosscutting
  layout: {x: 1300, y: 970, w: 170, h: 70}

