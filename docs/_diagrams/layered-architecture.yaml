diagram:
  id: layered-architecture
  title: SI-01 layered architecture — responsibilities and services
  width: 1540
  height: 1150
  description: Working responsibility view of the reusable framework and executable application.
  note: Selected arrows show principal relationships only; this is not a complete call graph or Maven artifact view.

groups:
- id: presentation-layer
  label: Presentation / external interfaces
  kind: layer-presentation
  layout: {x: 120, y: 85, w: 1120, h: 145}
- id: application-layer
  label: Application layer
  kind: layer-application
  layout: {x: 120, y: 260, w: 1120, h: 155}
- id: domain-layer
  label: Domain layer
  kind: layer-domain
  layout: {x: 120, y: 445, w: 1120, h: 300}
- id: timing-node-aggregate
  label: TimingNode (1..N)
  kind: model
  layout: {x: 145, y: 485, w: 820, h: 235}
- id: io-layer
  label: I/O
  kind: layer-infrastructure
  layout: {x: 120, y: 775, w: 1120, h: 165}
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  layout: {x: 120, y: 970, w: 1120, h: 100}
- id: crosscutting-layer
  label: Cross-cutting
  kind: layer-crosscutting
  layout: {x: 1270, y: 85, w: 230, h: 1020}

nodes:
- id: console-shell
  group: presentation-layer
  label: "Console / Remote Shell"
  subtitle: "development + service"
  kind: presentation
  layout: {x: 165, y: 135, w: 300, h: 65}
- id: desktop-gui
  group: presentation-layer
  label: "Desktop GUI Interface"
  subtitle: "debug / development application"
  kind: presentation
  layout: {x: 505, y: 135, w: 250, h: 65}
- id: http-websocket
  group: presentation-layer
  label: "HTTP / WebSocket"
  subtitle: "iPad / operator UI"
  kind: presentation
  layout: {x: 795, y: 135, w: 400, h: 65}

- id: application-conductor
  group: application-layer
  label: "Conductor"
  subtitle: "lifecycle / application-wide coordination"
  kind: application
  layout: {x: 250, y: 305, w: 360, h: 75}
- id: command-handler
  group: application-layer
  label: "CommandHandler"
  subtitle: "presentation commands / queries"
  kind: application
  layout: {x: 750, y: 305, w: 360, h: 75}

- id: timing-node-root
  group: timing-node-aggregate
  label: "TimingNode"
  subtitle: "TimingNodeId • LocationID • lifecycle/status"
  kind: model
  layout: {x: 355, y: 500, w: 400, h: 50}

- id: tag-processor
  group: timing-node-aggregate
  label: "TagProcessor"
  subtitle: "RFID/tag processing"
  kind: service
  layout: {x: 175, y: 570, w: 235, h: 60}
- id: stage-start-time-registry
  group: timing-node-aggregate
  label: "StageStartTimeRegistry"
  subtitle: "start-time reference"
  kind: service
  layout: {x: 425, y: 570, w: 250, h: 60}
- id: timing-node-journal
  group: timing-node-aggregate
  label: "Journal"
  subtitle: "registrations • sequence/persistence"
  kind: service
  layout: {x: 690, y: 570, w: 245, h: 60}
- id: prepare-team-registry
  group: timing-node-aggregate
  label: "PrepareTeamRegistry"
  subtitle: "teams + traceable history"
  kind: service
  layout: {x: 175, y: 650, w: 235, h: 60}
- id: race-data
  group: timing-node-aggregate
  label: "RaceData"
  subtitle: "participant/team/tag reference"
  kind: service
  layout: {x: 425, y: 650, w: 250, h: 60}
- id: stage-timing
  group: timing-node-aggregate
  label: "StageTiming"
  subtitle: "running times + ranking"
  kind: service
  layout: {x: 690, y: 650, w: 245, h: 60}

- id: system-status-domain
  group: domain-layer
  label: "SystemStatus"
  subtitle: "application-wide status/health"
  kind: service
  layout: {x: 995, y: 570, w: 210, h: 85}

- id: storage-io
  group: io-layer
  label: "Storage"
  subtitle: "file / DB • backup / restore"
  kind: storage
  layout: {x: 145, y: 825, w: 220, h: 75}
- id: antenna-router
  group: io-layer
  label: "AntennaRouter"
  subtitle: "1..N Antenna"
  kind: integration
  layout: {x: 385, y: 825, w: 280, h: 75}
- id: backoffice-router
  group: io-layer
  label: "BackofficeRouter"
  subtitle: "0..N BackofficeConnector"
  kind: integration
  layout: {x: 685, y: 825, w: 300, h: 75}
- id: devices-io
  group: io-layer
  label: "Devices"
  subtitle: "CAN • display"
  kind: integration
  layout: {x: 1005, y: 825, w: 215, h: 75}

- id: platform-primitives
  group: platform-layer
  label: Clock • filesystem • executors • process/network/OS primitives
  kind: platform
  layout: {x: 240, y: 1000, w: 880, h: 45}

- id: crosscutting-concerns
  group: crosscutting-layer
  label: "Logging\n\nConfiguration\n\nDiagnostics\n\nBuild / version identity"
  kind: crosscutting
  layout: {x: 1300, y: 165, w: 170, h: 235}
- id: boundary-note
  group: crosscutting-layer
  label: "Responsibility view only\n≠ Maven artifact split"
  kind: crosscutting
  layout: {x: 1300, y: 970, w: 170, h: 70}

