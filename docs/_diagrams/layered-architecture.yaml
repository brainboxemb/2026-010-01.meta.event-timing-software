diagram:
  id: layered-architecture
  title: Figure SI01-01 — SI-01 layered architecture
  width: 1440
  height: 1520
  description: Working responsibility view of the Timing Point Application core and executable composition.
  note: Selected arrows show principal relationships only; high-level arrows may terminate on a layer boundary when component-level ownership is intentionally deferred.

# Authored layout grid for this figure.
# - Main architecture stack: x=30, width=1120.
# - Right technical column: x=1170, width=250; 20 px gutter from the main stack.
# - Principal layers use a 30 px vertical gap.
# - Flat-layer content starts 25 px from the left edge (x=55).
# - Normal sibling component gap is 20 px.
# - A normal layer title baseline is 22 px below its local top edge.
# - The first component row starts about 42 px below the local layer top.
# - Normal bottom padding after the tallest component is 18 px, matching Presentation/Application.
# - For shaped layers, "local top" means the visible top edge at that x-position, not the group's raw y origin.
# - Component width follows content/established columns; do not stretch blocks to fill a layer.
# - Ordinary component blocks use a uniform 50 px height across Presentation, Application, Domain, Runtime and Infrastructure; aggregates/property blocks may differ.
# Platform uses four compact sibling blocks across the main stack.

groups:
- id: presentation-layer
  label: Presentation / external interfaces
  kind: layer-presentation
  layout: {x: 30, y: 85, w: 1120, h: 213}
- id: application-layer
  label: Application layer
  kind: layer-application
  # Extra height keeps the application entry/proxy vertical pair separate from
  # the centered coordination/control/router row.
  layout: {x: 30, y: 318, w: 1120, h: 210}
- id: domain-layer
  label: Domain layer
  kind: layer-domain
  layout: {x: 30, y: 546, w: 1120, h: 485}
  # Domain keeps a compact, regular gap below the aggregate and TimingData.
  # The right shoulder remains slightly shallower so the Domain/I/O relation is
  # visible without making Devices look embedded in Domain.
  outline:
    corner_radius: 10
    points:
      - {x: 0.0, y: 0.0}
      - {x: 1.0, y: 0.0}
      - {x: 1.0, y: 0.84}
      - {x: 0.7203390, y: 0.84}
      - {x: 0.6694915, y: 1.0}
      - {x: 0.0, y: 1.0}
- id: timing-system-aggregate
  object_id: TimingSystem
  label: "TimingSystem (1..N)"
  properties:
    - "TimingSystemId (internal)"
  properties_width: 220
  kind: model
  notation: component
  layout: {x: 55, y: 586, w: 1080, h: 330}
- id: timing-node-aggregate
  object_id: TimingNode
  label: "TimingNode (1..N)"
  properties:
    - TimingNodeId
    - LocationId
    - State
  properties_width: 240
  kind: model
  notation: component
  layout: {x: 550, y: 606, w: 560, h: 300}
- id: io-layer
  label: "I/O (per TimingSystem)"
  kind: layer-infrastructure
  layout: {x: 30, y: 978, w: 1120, h: 282}
  label_offset: {x: 0, y: 78}
  # The I/O top edge is a translated copy of the Domain lower edge. Keeping the
  # same x breakpoints and diagonal rise gives a constant visible gap.
  outline:
    corner_radius: 10
    points:
      - {x: 0.0, y: 0.3007752}
      - {x: 0.6694915, y: 0.3007752}
      - {x: 0.7203390, y: 0.0}
      - {x: 1.0, y: 0.0}
      - {x: 1.0, y: 1.0}
      - {x: 0.0, y: 1.0}
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  # 42 px header/row offset + 160 px Execution block + 18 px bottom padding.
  layout: {x: 30, y: 1290, w: 1120, h: 220}
- id: runtime-layer
  label: Runtime
  kind: layer-crosscutting
  # Concrete runtime owners only; composition is behaviour of TimingApplicationRuntime,
  # not a separate pseudo-component.
  layout: {x: 1170, y: 85, w: 250, h: 415}
- id: crosscutting-layer
  label: "Infrastructure /\ncross-cutting"
  kind: layer-crosscutting
  # Align the technical column bottom with Platform.
  layout: {x: 1170, y: 520, w: 250, h: 990}
