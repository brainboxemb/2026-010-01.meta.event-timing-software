diagram:
  id: layered-architecture
  title: SI-01 layered architecture — responsibilities and services
  width: 1540
  height: 1150
  description: Working responsibility view of the reusable framework and executable application.
  note: Selected arrows show principal relationships only; this is not a complete call graph or Maven artifact view.

groups:
- id: presentation-layer
  label: Presentation / external interfaces
  kind: layer-presentation
  layout: {x: 120, y: 85, w: 1120, h: 145}
- id: application-layer
  label: Application layer
  kind: layer-application
  layout: {x: 120, y: 260, w: 1120, h: 155}
- id: domain-layer
  label: Domain layer
  kind: layer-domain
  layout: {x: 120, y: 445, w: 1120, h: 300}
- id: waypoint-aggregate
  label: Waypoint (1..N)
  kind: group-secondary
  layout: {x: 145, y: 485, w: 820, h: 235}
- id: infrastructure-layer
  label: Infrastructure / integrations
  kind: layer-infrastructure
  layout: {x: 120, y: 775, w: 1120, h: 165}
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  layout: {x: 120, y: 970, w: 1120, h: 100}
- id: crosscutting-layer
  label: Cross-cutting
  kind: layer-crosscutting
  layout: {x: 1270, y: 85, w: 230, h: 1020}

nodes:
- id: console-shell
  group: presentation-layer
  label: "Console / Remote Shell\ndevelopment + service"
  kind: presentation
  layout: {x: 165, y: 135, w: 300, h: 65}
- id: debug-interface
  group: presentation-layer
  label: "Debug Interface\ndevelopment"
  kind: presentation
  layout: {x: 505, y: 135, w: 250, h: 65}
- id: http-websocket
  group: presentation-layer
  label: "HTTP / WebSocket\niPad / operator UI"
  kind: presentation
  layout: {x: 795, y: 135, w: 400, h: 65}

- id: timing-application
  group: application-layer
  label: "TimingApplication\ncommand/query orchestration"
  kind: application
  layout: {x: 400, y: 305, w: 560, h: 75}

- id: tag-processor
  group: waypoint-aggregate
  label: "TagProcessor\nRFID/tag processing"
  kind: service
  layout: {x: 175, y: 535, w: 235, h: 60}
- id: stage-start-time-registry
  group: waypoint-aggregate
  label: "StageStartTimeRegistry\nstart-time reference"
  kind: service
  layout: {x: 425, y: 535, w: 250, h: 60}
- id: waypoint-journal
  group: waypoint-aggregate
  label: "WaypointJournal\nregistrations • sequence/persistence"
  kind: service
  layout: {x: 690, y: 535, w: 245, h: 60}
- id: prepare-team-registry
  group: waypoint-aggregate
  label: "PrepareTeamRegistry\nteams + traceable history"
  kind: service
  layout: {x: 175, y: 625, w: 235, h: 60}
- id: race-data
  group: waypoint-aggregate
  label: "RaceData\nparticipant/team/tag reference"
  kind: service
  layout: {x: 425, y: 625, w: 250, h: 60}
- id: stage-timing
  group: waypoint-aggregate
  label: "StageTiming\nrunning times + ranking"
  kind: service
  layout: {x: 690, y: 625, w: 245, h: 60}

- id: system-status-domain
  group: domain-layer
  label: "SystemStatus\napplication-wide status/health"
  kind: service
  layout: {x: 995, y: 555, w: 210, h: 95}

- id: persistence
  group: infrastructure-layer
  label: "Persistence / file storage\nrepository + backup / restore implementations"
  kind: storage
  layout: {x: 165, y: 825, w: 300, h: 75}
- id: backoffice
  group: infrastructure-layer
  label: "Backoffice integration\nsocket / RabbitMQ • race/start-time synchronisation"
  kind: integration
  layout: {x: 495, y: 825, w: 300, h: 75}
- id: device-integration
  group: infrastructure-layer
  label: "Device integrations\nRFID • CAN • display"
  kind: integration
  layout: {x: 825, y: 825, w: 300, h: 75}

- id: platform-primitives
  group: platform-layer
  label: Clock • filesystem • executors • process/network/OS primitives
  kind: platform
  layout: {x: 240, y: 1000, w: 880, h: 45}

- id: crosscutting-concerns
  group: crosscutting-layer
  label: "Logging\n\nConfiguration\n\nDiagnostics\n\nBuild / version identity"
  kind: crosscutting
  layout: {x: 1300, y: 165, w: 170, h: 235}
- id: boundary-note
  group: crosscutting-layer
  label: "Responsibility view only\n≠ Maven artifact split"
  kind: crosscutting
  layout: {x: 1300, y: 970, w: 170, h: 70}

