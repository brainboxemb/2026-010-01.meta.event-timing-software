diagram:
  id: layered-architecture
  title: Figure SI01-01 — SI-01 layered architecture
  width: 1440
  height: 1345
  description: Working responsibility view of the reusable framework and executable application.
  note: Selected arrows show principal relationships only; high-level arrows may terminate on a layer boundary when component-level ownership is intentionally deferred.

groups:
- id: presentation-layer
  label: Presentation / external interfaces
  kind: layer-presentation
  layout: {x: 30, y: 85, w: 1120, h: 230}
- id: application-layer
  label: Application layer
  kind: layer-application
  layout: {x: 30, y: 345, w: 1120, h: 155}
- id: domain-layer
  label: Domain layer
  kind: layer-domain
  layout: {x: 30, y: 530, w: 1120, h: 400}
  # Domain keeps breathing room below TimingNode. The shallower cut-away starts
  # earlier to keep the Domain/I/O relation visible without making Devices look
  # deeply embedded in Domain.
  outline:
    points:
      - {x: 0.0, y: 0.0}
      - {x: 1.0, y: 0.0}
      - {x: 1.0, y: 0.775}
      - {x: 0.7203390, y: 0.775}
      - {x: 0.6694915, y: 1.0}
      - {x: 0.0, y: 1.0}
- id: timing-node-aggregate
  label: "TimingNode (1..N)"
  kind: model
  notation: component
  layout: {x: 55, y: 570, w: 820, h: 310}
- id: io-layer
  label: I/O
  kind: layer-infrastructure
  layout: {x: 30, y: 870, w: 1120, h: 260}
  label_offset: {x: 0, y: 86}
  # The shallower right shoulder remains part of I/O itself. It starts further
  # left and follows Domain with a constant visible gap.
  outline:
    points:
      - {x: 0.0, y: 0.3461538}
      - {x: 0.6779661, y: 0.3461538}
      - {x: 0.7288136, y: 0.0}
      - {x: 1.0, y: 0.0}
      - {x: 1.0, y: 1.0}
      - {x: 0.0, y: 1.0}
- id: platform-layer
  label: Platform abstractions / execution environment
  kind: layer-platform
  layout: {x: 30, y: 1160, w: 1120, h: 100}
- id: crosscutting-layer
  label: Cross-cutting
  kind: layer-crosscutting
  layout: {x: 1180, y: 85, w: 230, h: 1175}

