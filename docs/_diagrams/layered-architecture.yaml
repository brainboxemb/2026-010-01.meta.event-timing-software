- from: app-command-query
  to: start-time-service
  route: [{x: 565, y: 500}, {x: 750, y: 500}, {x: 750, y: 560}]
- from: app-command-query
  to: ready-team-service
  route: [{x: 455, y: 500}, {x: 1095, y: 500}, {x: 1095, y: 560}]
- from: app-command-query
  to: race-data-service
  route: [{x: 190, y: 500}, {x: 190, y: 737}]
- from: registration-service
  to: start-time-service
  route: [{x: 565, y: 638}]
- from: registration-service
  to: domain-model
  route: [{x: 520, y: 690}, {x: 650, y: 690}]
- from: start-time-service
  to: domain-model
- from: ready-team-service
  to: domain-model
  route: [{x: 1095, y: 700}, {x: 1095, y: 705}]
- from: race-data-service
  to: domain-model
- from: app-state
  to: status-management
- from: core-runtime
  to: app-state
  dashed: true
- from: app-state
  to: persistence
  label: persist / restore
  route: [{x: 565, y: 500}, {x: 565, y: 800}, {x: 380, y: 800}]
- from: backoffice
  to: core-runtime
  route: [{x: 565, y: 805}, {x: 565, y: 495}]
- from: device-integration
  to: core-runtime
  route: [{x: 935, y: 805}, {x: 935, y: 495}]
- from: persistence
  to: platform-primitives
- from: backoffice
  to: platform-primitives
- from: device-integration
  to: platform-primitives
