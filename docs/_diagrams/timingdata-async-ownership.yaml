diagram:
  id: timingdata-async-ownership
  title: Figure SDD01-TD02 — LogBook asynchronous ownership and query isolation
  width: 1680
  height: 860
  description: One bounded ingress queue isolates producers from durable LogBook commit; queries and external delivery run outside the record worker.
  note: Exact queue capacity and output-worker counts remain verification/deployment choices.

groups:
  - id: producer-context
    label: Producer execution
    kind: layer-domain
    layout: {x: 45, y: 105, w: 330, h: 620}

  - id: record-context
    label: LogBook record execution
    kind: layer-application
    layout: {x: 415, y: 105, w: 600, h: 620}

  - id: query-context
    label: Query execution
    kind: layer-presentation
    layout: {x: 1055, y: 105, w: 270, h: 620}

  - id: output-context
    label: External delivery execution
    kind: layer-infrastructure
    layout: {x: 1365, y: 105, w: 270, h: 620}

nodes:
  - id: producer
    label: "Producer task\nTagProcessor • manual • lifecycle • later producers"
    kind: model
    group: producer-context
    layout: {x: 80, y: 210, w: 260, h: 100}

  - id: candidate
    label: "LogBookEntryCandidate\nreturns after bounded enqueue"
    kind: model
    group: producer-context
    layout: {x: 80, y: 405, w: 260, h: 82}

  - id: queue
    label: "Q1 — bounded ingress\nArrayBlockingQueue"
    kind: service
    group: record-context
    layout: {x: 455, y: 170, w: 260, h: 78}

  - id: recorder
    label: "LogBookRecorder\nworker"
    kind: application
    group: record-context
    layout: {x: 455, y: 315, w: 260, h: 78}

  - id: committer
    label: "LogBookCommitter\nordered synchronous core"
    kind: application
    group: record-context
    layout: {x: 455, y: 465, w: 260, h: 82}

  - id: store
    label: "TimingDataStore\ndurable IF-05 append"
    kind: storage
    group: record-context
    layout: {x: 760, y: 325, w: 210, h: 78}

  - id: logbook
    label: "LogBook\nsingle-writer state"
    kind: model
    group: record-context
    layout: {x: 760, y: 490, w: 210, h: 78}

  - id: query
    label: "Query/ranking worker\nshort read capture\nlong calculation elsewhere"
    kind: service
    group: query-context
    layout: {x: 1090, y: 315, w: 200, h: 105}

  - id: sink
    label: "Committed sink queue/outbox"
    kind: service
    group: output-context
    layout: {x: 1400, y: 245, w: 200, h: 78}

  - id: output-worker
    label: "Network/signalling worker\nmay block/retry"
    kind: integration
    group: output-context
    layout: {x: 1400, y: 430, w: 200, h: 90}

edges:
  - {from: producer, to: candidate}
  - {from: candidate, to: queue, label: "async enqueue"}
  - {from: queue, to: recorder}
  - {from: recorder, to: committer}
  - {from: committer, to: store, label: "durable append"}
  - {from: committer, to: logbook, label: "commit item"}
  - {from: logbook, to: query, label: "short read"}
  - {from: committer, to: sink, label: "non-blocking offer"}
  - {from: sink, to: output-worker}
