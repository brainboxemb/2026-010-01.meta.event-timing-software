diagram:
  id: timingdata-async-ownership
  title: Figure SDD01-TD02 — TimingNode active-object ownership and query isolation
  width: 1680
  height: 850
  description: One bounded serial worker owns TimingNode state mutation; contained state remains passive and queries run outside the worker.
  note: A later shared executor may replace the dedicated thread only if per-node FIFO, one-at-a-time execution and bounded work are preserved.

groups:
  - id: ingress
    label: Ingress execution
    kind: layer-domain
    layout: {x: 45, y: 105, w: 320, h: 610}
  - id: node
    label: TimingNode active object
    kind: layer-application
    layout: {x: 405, y: 105, w: 700, h: 610}
  - id: query
    label: Consumer execution
    kind: layer-presentation
    layout: {x: 1145, y: 105, w: 230, h: 610}
  - id: output
    label: External delivery
    kind: layer-infrastructure
    layout: {x: 1415, y: 105, w: 220, h: 610}

