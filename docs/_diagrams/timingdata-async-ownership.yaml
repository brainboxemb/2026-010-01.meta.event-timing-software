diagram:
  id: timingdata-async-ownership
  title: Figure SDD01-TD02 — TimingNode asynchronous ownership and query isolation
  width: 1680
  height: 860
  description: The TimingNode owns one bounded record queue and worker; queries and external delivery run outside that worker.
  note: Exact queue capacity and later worker-sharing choices remain verification/deployment decisions.

groups:
  - id: producer-context
    label: Producer execution
    kind: layer-domain
    layout: {x: 45, y: 105, w: 330, h: 620}

  - id: timingnode-context
    label: TimingNode execution
    kind: layer-application
    layout: {x: 415, y: 105, w: 600, h: 620}

  - id: query-context
    label: Query execution
    kind: layer-presentation
    layout: {x: 1055, y: 105, w: 270, h: 620}

  - id: output-context
    label: External delivery execution
    kind: layer-infrastructure
    layout: {x: 1365, y: 105, w: 270, h: 620}

nodes:
  - id: producer
    label: "Producer task\nTagProcessor • command • lifecycle • later producers"
    kind: model
    group: producer-context
    layout: {x: 80, y: 240, w: 260, h: 100}

  - id: timing-node
    label: "TimingNode\nowns record ordering + worker"
    kind: model
    group: timingnode-context
    layout: {x: 455, y: 180, w: 260, h: 90}

  - id: queue
    label: "Internal bounded queue\nArrayBlockingQueue"
    kind: service
    group: timingnode-context
    layout: {x: 455, y: 360, w: 260, h: 78}

  - id: store
    label: "TimingDataStore\nfile persistence / recovery"
    kind: storage
    group: timingnode-context
    layout: {x: 760, y: 250, w: 210, h: 90}

  - id: logbook
    label: "LogBook\nsingle-writer state"
    kind: model
    group: timingnode-context
    layout: {x: 760, y: 465, w: 210, h: 78}

  - id: query
    label: "Query/ranking task\nshort read capture\nlong calculation elsewhere"
    kind: service
    group: query-context
    layout: {x: 1090, y: 315, w: 200, h: 105}

  - id: sink
    label: "Committed sink queue/outbox"
    kind: service
    group: output-context
    layout: {x: 1400, y: 245, w: 200, h: 78}

  - id: output-worker
    label: "Network/signalling worker\nmay block/retry"
    kind: integration
    group: output-context
    layout: {x: 1400, y: 430, w: 200, h: 90}

edges:
  - {from: producer, to: timing-node, label: "submit candidate"}
  - from: timing-node
    to: queue
    label: "async enqueue"
    from_anchor: {side: bottom, position: 0.35}
    to_anchor: {side: top, position: 0.35}
  - from: queue
    to: timing-node
    label: "next candidate"
    from_anchor: {side: top, position: 0.70}
    to_anchor: {side: bottom, position: 0.70}
  - {from: timing-node, to: store, label: "durable append"}
  - {from: timing-node, to: logbook, label: "commit item"}
  - {from: logbook, to: query, label: "short read"}
  - {from: timing-node, to: sink, label: "non-blocking offer"}
  - {from: sink, to: output-worker}
