diagram:
  id: timingdata-async-ownership
  title: Figure SDD01-TD02 — TimingNode component and execution ownership
  width: 1740
  height: 900
  description: "TimingNode is the node-level facade/composition boundary. NodeDataProcessor owns the Data Lane and mutable node data; NodeTaskProcessor owns the Task Lane and coordination/protocol state. Both logical lanes may share one Runtime-owned physical ExecutorService."
  note: Logical lane separation defines ownership and FIFO ordering, not physical parallelism. Cross-lane work is bounded and asynchronous; neither lane waits synchronously for the other.

