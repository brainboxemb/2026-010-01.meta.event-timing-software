diagram:
  id: timingdata-async-ownership
  title: Figure SDD01-TD02 — LogBook asynchronous ownership and query isolation
  width: 1680
  height: 840
  description: TimingNode hands traceable facts to LogBook; LogBook owns the bounded queue/record worker while queries and network delivery remain independent.
  note: Exact queue capacity and later worker-sharing choices remain verification/deployment decisions.

groups:
  - id: producer-context
    label: Producer execution
    kind: layer-domain
    layout: {x: 45, y: 105, w: 330, h: 600}

  - id: domain-context
    label: TimingNode / LogBook execution
    kind: layer-application
    layout: {x: 415, y: 105, w: 600, h: 600}

  - id: query-context
    label: Query execution
    kind: layer-presentation
    layout: {x: 1055, y: 105, w: 270, h: 600}

  - id: output-context
    label: External delivery execution
    kind: layer-infrastructure
    layout: {x: 1365, y: 105, w: 270, h: 600}

nodes:
  - id: producer
    label: "Producer task\nTagProcessor • command • lifecycle • later producers"
    kind: model
    group: producer-context
    layout: {x: 80, y: 270, w: 260, h: 100}

  - id: timing-node
    label: "TimingNode\ndomain-facing operation"
    kind: model
    group: domain-context
    layout: {x: 455, y: 190, w: 250, h: 82}

  - id: logbook
    label: "LogBook\nbounded queue + record worker\ncommitted state"
    kind: model
    group: domain-context
    layout: {x: 455, y: 390, w: 250, h: 105}

  - id: store
    label: "TimingDataStore\nfile persistence / recovery"
    kind: storage
    group: domain-context
    layout: {x: 760, y: 285, w: 210, h: 90}

  - id: query
    label: "Query/ranking task\nshort read capture\nlong calculation elsewhere"
    kind: service
    group: query-context
    layout: {x: 1090, y: 315, w: 200, h: 105}

  - id: sink
    label: "Committed sink queue/outbox"
    kind: service
    group: output-context
    layout: {x: 1400, y: 245, w: 200, h: 78}

  - id: output-worker
    label: "Network/signalling worker\nmay block/retry"
    kind: integration
    group: output-context
    layout: {x: 1400, y: 430, w: 200, h: 90}

edges:
  - {from: producer, to: timing-node, label: "call"}
  - {from: timing-node, to: logbook, label: "async record"}
  - {from: logbook, to: store, label: "durable append"}
  - {from: logbook, to: query, label: "short read"}
  - {from: logbook, to: sink, label: "non-blocking offer"}
  - {from: sink, to: output-worker}
