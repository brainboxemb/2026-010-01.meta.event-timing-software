diagram:
  id: timingdata-producer-pipeline
  title: Figure SDD01-TD01 — LogBook producers and durable TimingData commit path
  width: 1640
  height: 980
  description: Multiple domain producers converge on one bounded LogBook recording path; IF-05 TimingData is the durable/interchange representation.
  note: Start-procedure and penalty/correction producers are shown as later record families.

groups:
  - id: producers
    label: Traceable fact producers
    kind: layer-domain
    layout: {x: 55, y: 105, w: 390, h: 760}

  - id: commit
    label: Ordered LogBook commit
    kind: layer-application
    layout: {x: 485, y: 105, w: 650, h: 760}

  - id: consumers
    label: Reads and external delivery
    kind: layer-infrastructure
    layout: {x: 1175, y: 105, w: 410, h: 760}

nodes:
  - id: tag-processor
    label: "TagProcessor\nautomatic RFID registration"
    kind: model
    group: producers
    layout: {x: 95, y: 165, w: 310, h: 82}

  - id: manual-registration
    label: "Manual registration\nTeamIdentity input"
    kind: application
    group: producers
    layout: {x: 95, y: 285, w: 310, h: 82}

  - id: lifecycle
    label: "TimingNode lifecycle\nOPEN / CLOSED"
    kind: model
    group: producers
    layout: {x: 95, y: 405, w: 310, h: 82}

  - id: later-producers
    label: "Start / penalty / correction\nlater record families"
    kind: model
    group: producers
    layout: {x: 95, y: 555, w: 310, h: 90}

  - id: candidate
    label: "LogBookEntryCandidate\nnode/location context captured\nNO sequence • NOT committed"
    kind: model
    group: commit
    layout: {x: 545, y: 165, w: 520, h: 100}

  - id: queue
    label: "Bounded LogBook ingress queue\nArrayBlockingQueue candidate"
    kind: service
    group: commit
    layout: {x: 625, y: 315, w: 360, h: 82}

  - id: recorder
    label: "LogBookRecorder\nworker / FIFO ownership"
    kind: application
    group: commit
    layout: {x: 625, y: 445, w: 360, h: 82}

  - id: committer
    label: "LogBookCommitter\nsequence • recordedAt • item/record mapping"
    kind: application
    group: commit
    layout: {x: 605, y: 575, w: 400, h: 95}

  - id: timingdata-store
    label: "TimingDataStore\nappend-only IF-05 durable file"
    kind: storage
    group: commit
    layout: {x: 535, y: 735, w: 300, h: 82}

  - id: logbook
    label: "LogBook\n0..N committed LogBookItem"
    kind: model
    group: commit
    layout: {x: 865, y: 735, w: 220, h: 82}

  - id: query
    label: "StageTiming / query services\nshort LogBook read capture"
    kind: service
    group: consumers
    layout: {x: 1225, y: 255, w: 310, h: 90}

  - id: sink
    label: "CommittedTimingDataSink\nnon-blocking hand-off"
    kind: interface
    group: consumers
    layout: {x: 1225, y: 485, w: 310, h: 82}

  - id: downstream
    label: "Signalling / upstream worker\ncapability-specific queue or outbox"
    kind: integration
    group: consumers
    layout: {x: 1225, y: 650, w: 310, h: 90}

edges:
  - {from: tag-processor, to: candidate}
  - {from: manual-registration, to: candidate}
  - {from: lifecycle, to: candidate}
  - {from: later-producers, to: candidate, dashed: true, label: "later"}

  - {from: candidate, to: queue}
  - {from: queue, to: recorder}
  - {from: recorder, to: committer}
  - {from: committer, to: timingdata-store, label: "durable append"}
  - {from: committer, to: logbook, label: "commit after persistence"}
  - {from: logbook, to: query, label: "read"}
  - {from: committer, to: sink, label: "committed record"}
  - {from: sink, to: downstream, label: "async delivery"}
