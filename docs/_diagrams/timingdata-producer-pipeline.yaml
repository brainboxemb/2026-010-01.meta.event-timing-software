diagram:
  id: timingdata-producer-pipeline
  title: Figure SDD01-TD01 — TimingNode to LogBook recording path
  width: 1640
  height: 930
  description: Producers call the owning TimingNode; the LogBook owns ordered asynchronous recording and uses TimingDataStore for persistence.
  note: TimingDataStore owns file persistence/recovery; LogBook owns the bounded recording queue, worker and committed operational state.

groups:
  - id: producers
    label: Traceable fact producers
    kind: layer-domain
    layout: {x: 55, y: 105, w: 390, h: 700}

  - id: domain
    label: TimingNode domain
    kind: layer-application
    layout: {x: 485, y: 105, w: 650, h: 700}

  - id: io
    label: Persistence and consumers
    kind: layer-infrastructure
    layout: {x: 1175, y: 105, w: 410, h: 700}

nodes:
  - id: tag-processor
    label: "TagProcessor\nautomatic RFID registration"
    kind: model
    group: producers
    layout: {x: 95, y: 165, w: 310, h: 82}

  - id: manual-registration
    label: "Manual registration\nTeamIdentity input"
    kind: application
    group: producers
    layout: {x: 95, y: 285, w: 310, h: 82}

  - id: lifecycle
    label: "TimingNode lifecycle\nOPEN / CLOSED"
    kind: model
    group: producers
    layout: {x: 95, y: 405, w: 310, h: 82}

  - id: later-producers
    label: "Start / penalty / correction\nlater record families"
    kind: model
    group: producers
    layout: {x: 95, y: 545, w: 310, h: 90}

  - id: timing-node
    label: "TimingNode\ndomain-facing operations"
    kind: model
    group: domain
    layout: {x: 605, y: 205, w: 410, h: 95}

  - id: logbook
    label: "LogBook\nbounded queue + record worker\n0..N committed LogBookItem"
    kind: model
    group: domain
    layout: {x: 585, y: 430, w: 450, h: 115}

  - id: timingdata-store
    label: "TimingDataStore\nfile persistence / recovery"
    kind: storage
    group: io
    layout: {x: 1225, y: 190, w: 310, h: 90}

  - id: query
    label: "StageTiming / query services\nshort LogBook read capture"
    kind: service
    group: io
    layout: {x: 1225, y: 360, w: 310, h: 90}

  - id: sink
    label: "CommittedTimingDataSink\nnon-blocking hand-off"
    kind: interface
    group: io
    layout: {x: 1225, y: 525, w: 310, h: 82}

  - id: downstream
    label: "Signalling / upstream worker\ncapability-specific queue or outbox"
    kind: integration
    group: io
    layout: {x: 1225, y: 660, w: 310, h: 90}

edges:
  - {from: tag-processor, to: timing-node, label: "register"}
  - {from: manual-registration, to: timing-node, label: "register"}
  - {from: lifecycle, to: timing-node, label: "record lifecycle fact"}
  - {from: later-producers, to: timing-node, dashed: true, label: "later"}

  - {from: timing-node, to: logbook, label: "async record"}
  - {from: logbook, to: timingdata-store, label: "durable append"}
  - {from: logbook, to: query, label: "read"}
  - {from: logbook, to: sink, label: "committed record"}
  - {from: sink, to: downstream, label: "async delivery"}
