diagram:
  id: timingdata-sequence-manual-registration
  type: sequence
  title: Figure SDD01-TD04 — Manual registration
  width: 1240
  height: 1010
  description: A presentation-driven registration call waits while the TimingNode queues the work, executes it against current state and performs the durable commit.
  note: The Future linking queue submission to the final result is internal to TimingNode; the caller sees a normal synchronous operation result.

participants:
  - {id: client, label: Operator / client, kind: client}
  - {id: api, label: IF-03 / CommandHandler, kind: interface}
  - {id: node, label: TimingNode, kind: model}
  - {id: logbook, label: "LogBook\ncommitted TimingData", kind: model}
  - {id: store, label: "TimingDataStore\nfile persistence / recovery", kind: storage}

messages:
  - {from: client, to: api, label: "register(identity, time)", kind: call}
  - {from: api, to: node, label: "register(identity, time)", kind: call}
  - {from: node, to: node, label: "queue internal work + Future", kind: async}
  - {from: node, to: node, label: "worker validates against current TimingNode state", kind: call}
  - {from: node, to: logbook, label: "nextSequence()", kind: call}
  - {from: logbook, to: node, label: "sequence N", kind: return}
  - {from: node, to: store, label: "append(record N)", kind: call}
  - {from: store, to: node, label: durable, kind: return}
  - {from: node, to: logbook, label: "add(record N)", kind: call}
  - {from: logbook, to: node, label: visible, kind: return}
  - {from: node, to: api, label: "RegistrationResult.COMMITTED", kind: return}
  - {from: api, to: client, label: "committed result", kind: return}
