diagram:
  id: engineering-client-api-first
  title: Figure SDE03-05 — API-first Development Client workbench
  width: 1360
  height: 950
  note: Current UI baseline. Client configuration supplies startup defaults; the active target host is editable. SI-01 remains authoritative for domain results.

groups: []

nodes:
  - id: shell
    label: Development Client
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 30, y: 80, w: 1300, h: 845}

  - id: target
    label: Target
    subtitle: "127.0.0.1  |  editable host/IP"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 118, w: 265, h: 54}

  - id: api-connection
    label: "API :8081\nCHECK"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 335, y: 121, w: 145, h: 48}

  - id: events-connection
    label: "Events :eventPort\nCONNECTED"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 490, y: 121, w: 165, h: 48}

  - id: terminal-connection
    label: "Terminal :shellPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 665, y: 121, w: 160, h: 48}

  - id: device-log-connection
    label: "Device log :logPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 835, y: 121, w: 175, h: 48}

  - id: apply-target
    label: Apply target
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 1020, y: 121, w: 135, h: 48}

  - id: client-log-indicator
    label: "Client log\nACTIVE"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 1165, y: 121, w: 135, h: 48}

  - id: tabs
    label: "API | Events | Device Log | Terminal | Client Log"
    subtitle: API
    kind: wireframe-surface
    notation: wireframe-tabs
    layout: {x: 55, y: 180, w: 1245, h: 44}

  - id: timing-view-state
    label: "Timing view"
    subtitle: "LIVE  |  Sync view"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 55, y: 232, w: 1245, h: 44}

  - id: api-summary
    label: API / selected TimingNode
    subtitle: "timing-node-01  |  state OPEN  |  LocationId 24"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 284, w: 1245, h: 100}

  - id: get-version
    label: Version
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 80, y: 335, w: 95, h: 36}

  - id: get-status
    label: Status
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 185, y: 335, w: 95, h: 36}

  - id: input-panel
    label: TimingNode / input
    subtitle: "Normal operator input on the left"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 400, w: 390, h: 390}

  - id: location
    label: LocationId
    subtitle: "24"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 80, y: 445, w: 120, h: 58}

  - id: open
    label: Open
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 215, y: 456, w: 90, h: 36}

  - id: close
    label: Close
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 315, y: 456, w: 90, h: 36}

  - id: last-operation
    label: Last API operation
    subtitle: "seq 1"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 80, y: 512, w: 325, h: 54}

  - id: registration
    label: Registration input
    subtitle: Structured local-time input; SI-01 remains authoritative
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 75, y: 580, w: 335, h: 190}

  - id: prefix
    label: Prefix
    subtitle: "N"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 95, y: 615, w: 80, h: 48}

  - id: number
    label: Number
    subtitle: "0001"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 185, y: 615, w: 105, h: 48}

  - id: reg-date
    label: Date
    subtitle: "2026-10-01"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 95, y: 672, w: 145, h: 48}

  - id: reg-time
    label: Time (Europe/Amsterdam)
    subtitle: "12:00:00"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 250, y: 672, w: 140, h: 48}

  - id: now
    label: Now
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 95, y: 728, w: 70, h: 32}

  - id: auto-reg
    label: Send auto-reg
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 175, y: 728, w: 125, h: 32}

  - id: interpreted
    label: Registrations
    subtitle: "Interpreted view — Type + TeamID + time-origin Code; trash action has no header"
    kind: wireframe-surface
    notation: wireframe-table
    items:
      - "Time     | Type | TeamID | Code |"
      - "12:00:00 | AUTO | -      | AUTO | [trash]"
    layout: {x: 465, y: 400, w: 835, h: 180}

  - id: history
    label: LogBook / committed TimingData
    subtitle: "Immutable technical/audit view; source order and canonical profile values"
    kind: wireframe-surface
    notation: wireframe-table
    items:
      - "Seq | Type     | Code | Location | Registration | Effective"
      - "1   | AUTO_REG | ADD  | 24       | N0001        | 2026-10-01T10:00:00Z"
    layout: {x: 465, y: 595, w: 835, h: 195}

  - id: raw-response
    label: Raw response / selected LogBook record
    subtitle: Complete API JSON remains available; structured views never hide the committed record.
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 805, w: 1245, h: 48}

edges: []
