diagram:
  id: engineering-client-api-first
  title: Figure SDE03-05 — API-first Development Client workbench
  width: 1360
  height: 950
  note: Current UI baseline. Client configuration supplies startup defaults; the active target host is editable. SI-01 remains authoritative for domain results.

groups: []

nodes:
  - id: shell
    label: Development Client
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 30, y: 80, w: 1300, h: 845}

  - id: target
    label: Target
    subtitle: "127.0.0.1  |  editable host/IP"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 118, w: 265, h: 54}

  - id: api-connection
    label: "API :8081\nCHECK"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 335, y: 121, w: 145, h: 48}

  - id: events-connection
    label: "Events :eventPort\nCONNECTED"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 490, y: 121, w: 165, h: 48}

  - id: terminal-connection
    label: "Terminal :shellPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 665, y: 121, w: 160, h: 48}

  - id: device-log-connection
    label: "Device log :logPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 835, y: 121, w: 175, h: 48}

  - id: apply-target
    label: Apply target
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 1020, y: 121, w: 135, h: 48}

  - id: client-log-indicator
    label: "Client log\nACTIVE"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 1165, y: 121, w: 135, h: 48}

  - id: tabs
    label: "API | Events | Device Log | Client Log"
    subtitle: API
    kind: wireframe-surface
    notation: wireframe-tabs
    layout: {x: 55, y: 180, w: 1245, h: 44}

  - id: timing-view-state
    label: "Timing view"
    subtitle: "LIVE  |  Node A  |  State OPEN  |  Location 24  |  Sync view"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 55, y: 232, w: 1245, h: 44}

  - id: input-tabs
    label: "TimingNode | Registration | Simulation | Terminal"
    subtitle: TimingNode
    kind: wireframe-surface
    notation: wireframe-tabs
    layout: {x: 55, y: 292, w: 615, h: 255}

  - id: location
    label: LocationId
    subtitle: "24"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 80, y: 350, w: 150, h: 54}

  - id: open
    label: Open
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 245, y: 359, w: 90, h: 36}

  - id: close
    label: Close
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 345, y: 359, w: 90, h: 36}

  - id: last-operation
    label: Last API operation
    subtitle: "seq 1"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 80, y: 420, w: 555, h: 54}

  - id: api-summary
    label: API / application identity
    subtitle: "application  |  version  |  API version  |  Version  |  Status"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 685, y: 292, w: 615, h: 72}

  - id: interpreted
    label: Registrations
    subtitle: "Interpreted view — Time | Type | TeamID | Code | action"
    kind: wireframe-surface
    notation: wireframe-table
    items:
      - "Time        | Type | TeamID | Code |"
      - "12:00:00.25 | AUTO | 0001   |      | [trash]"
    layout: {x: 685, y: 376, w: 615, h: 171}

  - id: device-log
    label: Device Log
    subtitle: "Live SI-01 diagnostics"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 565, w: 615, h: 142}

  - id: client-log
    label: Client Log
    subtitle: "Development Client diagnostics"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 719, w: 615, h: 142}

  - id: history
    label: LogBook / committed TimingData
    subtitle: "Immutable technical/audit view; raw canonical profile values"
    kind: wireframe-surface
    notation: wireframe-table
    items:
      - "Seq | Type     | Code | Location | Registration | Effective"
      - "1   | AUTO_REG | ADD  | 24       | RT-A-0001    | 2026-10-01T10:00:00.25Z"
    layout: {x: 685, y: 565, w: 615, h: 296}

  - id: raw-response
    label: Raw response / selected record
    subtitle: "Collapsed by default; complete API JSON remains available for diagnosis."
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 875, w: 1245, h: 36}

edges: []
