diagram:
  id: engineering-client-api-first
  title: Figure SDE03-05 — API-first Development Client workbench
  width: 1360
  height: 820
  note: Current UI baseline. Client configuration supplies startup defaults; the active target host is editable. SI-01 remains authoritative for domain results.

groups: []

nodes:
  - id: shell
    label: Development Client
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 30, y: 80, w: 1300, h: 765}

  - id: target
    label: Target
    subtitle: "127.0.0.1  |  editable host/IP"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 118, w: 265, h: 54}

  - id: api-connection
    label: "API :8081\nCHECK"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 335, y: 121, w: 145, h: 48}

  - id: events-connection
    label: "Events :eventPort\nCONNECTED"
    kind: wireframe-live
    notation: wireframe-button
    layout: {x: 490, y: 121, w: 165, h: 48}

  - id: terminal-connection
    label: "Terminal :shellPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 665, y: 121, w: 160, h: 48}

  - id: device-log-connection
    label: "Device log :logPort\nCONNECT"
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 835, y: 121, w: 175, h: 48}

  - id: apply-target
    label: Apply target
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 1020, y: 121, w: 135, h: 48}

  - id: client-log-indicator
    label: "Client log\nACTIVE"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 1165, y: 121, w: 135, h: 48}

  - id: tabs
    label: "API | Events | Device Log | Terminal | Client Log"
    subtitle: API
    kind: wireframe-surface
    notation: wireframe-tabs
    layout: {x: 55, y: 180, w: 1245, h: 44}

  - id: timing-view-state
    label: "Timing view"
    subtitle: "LIVE  |  Sync view"
    kind: wireframe-live
    notation: wireframe-status
    layout: {x: 55, y: 232, w: 1245, h: 44}

  - id: api-summary
    label: API / selected TimingNode
    subtitle: "timing-node-01  |  state CLOSED  |  LocationId 24"
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 284, w: 1245, h: 145}

  - id: get-version
    label: Version
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 80, y: 364, w: 95, h: 36}

  - id: get-status
    label: Status
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 185, y: 364, w: 95, h: 36}

  - id: location
    label: Location
    subtitle: "24"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 315, y: 342, w: 150, h: 72}

  - id: open
    label: Open
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 475, y: 364, w: 105, h: 36}

  - id: close
    label: Close
    subtitle: send request
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 590, y: 364, w: 105, h: 36}

  - id: last-operation
    label: Last API operation
    subtitle: "NODE_NOT_OPEN — response retained for inspection"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 720, y: 342, w: 550, h: 72}

  - id: registration
    label: Registration test input
    subtitle: Structured convenience input; SI-01 remains authoritative
    kind: wireframe-surface
    notation: wireframe-panel
    layout: {x: 55, y: 449, w: 1245, h: 135}

  - id: prefix
    label: Prefix
    subtitle: "N"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 80, y: 509, w: 110, h: 68}

  - id: number
    label: Number
    subtitle: "0001"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 200, y: 509, w: 150, h: 68}

  - id: reg-date
    label: Date
    subtitle: "2026-10-03"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 380, y: 509, w: 180, h: 68}

  - id: reg-time
    label: Time (Europe/Amsterdam)
    subtitle: "15:33:00"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 570, y: 509, w: 160, h: 68}

  - id: now
    label: Now
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 750, y: 530, w: 75, h: 36}

  - id: auto-reg
    label: Send auto-reg
    kind: wireframe-action
    notation: wireframe-button
    layout: {x: 845, y: 530, w: 145, h: 36}

  - id: raw-request-note
    label: Wire value
    subtitle: "N0001 @ canonical UTC after visible zone conversion"
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 1010, y: 509, w: 260, h: 68}

  - id: history
    label: LogBook / committed TimingData
    subtitle: source order; row selection exposes complete public record
    kind: wireframe-surface
    notation: wireframe-table
    items:
      - "Seq | Type     | Location | Registration | Time"
      - "17  | OPEN     | 24       | -            | 15:30:00"
      - "18  | AUTO_REG | 24       | N0001        | 15:33:00"
      - "19  | CLOSE    | 24       | -            | 15:40:12"
    layout: {x: 55, y: 604, w: 1245, h: 150}

  - id: raw-response
    label: Raw response / selected record
    subtitle: Complete API JSON remains available; structured UI never hides a domain rejection.
    kind: wireframe-control
    notation: wireframe-input
    layout: {x: 55, y: 774, w: 1245, h: 48}

edges: []
