diagram:
  id: timingdata-interchange-model
  title: Figure IF05-01 — TimingData v1 interchange model
  width: 1580
  height: 930
  description: Canonical TimingData v1 envelope, first record families, registration identity and codec/provider boundary.
  note: IF-05 owns record/file semantics. Internal producers, queues and worker threads are intentionally not shown here.

groups:
  - id: contract
    label: IF-05 canonical record contract
    kind: layer-domain
    layout: {x: 55, y: 105, w: 900, h: 720}

  - id: representation
    label: Representation / translation boundary
    kind: layer-infrastructure
    layout: {x: 995, y: 105, w: 530, h: 720}

nodes:
  - id: record
    label: TimingDataRecord
    notation: class
    kind: model
    group: contract
    layout: {x: 105, y: 165, w: 355, h: 250}
    items:
      - version = 1
      - timingNodeId
      - sequenceNumber
      - locationId
      - recordType
      - effectiveTime
      - recordedAt
      - type-specific data

  - id: key
    label: TimingDataRecordKey
    notation: class
    kind: model
    group: contract
    layout: {x: 105, y: 500, w: 355, h: 130}
    items:
      - timingNodeId
      - sequenceNumber

  - id: lifecycle
    label: TIMING_NODE_STATE
    subtitle: state = OPEN | CLOSED
    kind: service
    group: contract
    layout: {x: 545, y: 165, w: 330, h: 85}

  - id: registration
    label: REGISTRATION
    subtitle: origin + timeSource + RegistrationIdentity
    kind: service
    group: contract
    layout: {x: 545, y: 300, w: 330, h: 90}

  - id: revoked
    label: REGISTRATION_REVOKED
    subtitle: references original registration key
    kind: service
    group: contract
    layout: {x: 545, y: 440, w: 330, h: 90}

  - id: registration-identity
    label: RegistrationIdentity
    notation: class
    kind: model
    group: contract
    layout: {x: 545, y: 595, w: 330, h: 150}
    items:
      - type = STANDARD | WOMEN | MEN
      - number = 1..350

  - id: canonical-codec
    label: Canonical reference codec
    subtitle: UTF-8 JSON Lines • one record per line • LF writer
    kind: interface
    group: representation
    layout: {x: 1070, y: 190, w: 380, h: 95}

  - id: canonical-file
    label: TimingData file
    subtitle: append-only history • incomplete trailing line is not committed
    kind: storage
    group: representation
    layout: {x: 1070, y: 365, w: 380, h: 95}

  - id: provider
    label: TimingDataProvider / translator
    subtitle: external representation <-> IF-05 semantics
    kind: integration
    group: representation
    layout: {x: 1070, y: 545, w: 380, h: 95}

  - id: proprietary
    label: External / proprietary format
    subtitle: may use fixed fields, CRLF and optional native DLL
    kind: external
    group: representation
    layout: {x: 1070, y: 690, w: 380, h: 85}

edges:
  - {from: record, to: lifecycle, label: "recordType"}
  - {from: record, to: registration, label: "recordType"}
  - {from: record, to: revoked, label: "recordType"}
  - {from: registration, to: registration-identity, label: "identity"}
  - {from: revoked, to: key, label: "reference"}
  - {from: record, to: canonical-codec, label: "encode / decode"}
  - {from: canonical-codec, to: canonical-file}
  - {from: record, to: provider, label: "semantic model"}
  - {from: provider, to: proprietary, label: "translate"}
