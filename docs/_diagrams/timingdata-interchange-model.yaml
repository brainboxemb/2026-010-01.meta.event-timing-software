diagram:
  id: timingdata-interchange-model
  title: Figure IF05-01 — Common TimingData contract and concrete profiles
  width: 1580
  height: 930
  description: Common TimingData semantics are stable while a configured provider supplies the concrete factory and matching codec/representation.
  note: The factory is stateless object construction. TimingNode policy, sequence allocation, persistence and event publication remain outside the provider.

groups:
  - id: contract
    label: IF-05 common semantic contract
    kind: layer-domain
    layout: {x: 55, y: 105, w: 900, h: 720}

  - id: profile
    label: Configured TimingData profile
    kind: layer-infrastructure
    layout: {x: 995, y: 105, w: 530, h: 720}

nodes:
  - id: timingdata
    label: TimingData
    kind: model
    group: contract
    layout: {x: 105, y: 165, w: 355, h: 250}
    items:
      - timingNodeId + sequenceNumber
      - locationId
      - effectiveTime
      - recordedAt
      - immutable common value

  - id: registration
    label: RegistrationData
    subtitle: common registration semantics
    kind: service
    group: contract
    layout: {x: 545, y: 165, w: 330, h: 95}

  - id: lifecycle
    label: TimingNodeStateData
    subtitle: state = OPEN | CLOSED
    kind: service
    group: contract
    layout: {x: 545, y: 310, w: 330, h: 90}

  - id: revoked
    label: RegistrationRevokedData
    subtitle: references earlier RegistrationData
    kind: service
    group: contract
    layout: {x: 545, y: 450, w: 330, h: 90}

  - id: registration-identity
    label: RegistrationId
    kind: model
    group: contract
    layout: {x: 545, y: 595, w: 330, h: 150}
    items:
      - provider-neutral canonical value
      - concrete source mappings remain external

  - id: provider
    label: TimingDataProvider
    subtitle: stable profile/provider selection
    kind: integration
    group: profile
    layout: {x: 1070, y: 165, w: 380, h: 85}

  - id: factory
    label: TimingDataFactory
    subtitle: stateless concrete object construction
    kind: service
    group: profile
    layout: {x: 1070, y: 300, w: 380, h: 85}

  - id: codec
    label: TimingDataCodec
    subtitle: matching encode / decode implementation
    kind: interface
    group: profile
    layout: {x: 1070, y: 435, w: 380, h: 85}

  - id: reference
    label: Default / reference profile
    subtitle: canonical UTF-8 JSON Lines representation
    kind: storage
    group: profile
    layout: {x: 1070, y: 570, w: 380, h: 85}

  - id: alternate
    label: Alternate profile
    subtitle: e.g. DummyEventTimingData or product-specific representation
    kind: external
    group: profile
    layout: {x: 1070, y: 695, w: 380, h: 85}

edges:
  - {from: timingdata, to: registration, label: "semantic subtype"}
  - {from: timingdata, to: lifecycle, label: "semantic subtype"}
  - {from: timingdata, to: revoked, label: "semantic subtype"}
  - {from: registration, to: registration-identity, label: "identity"}
  - {from: provider, to: factory}
  - {from: provider, to: codec}
  - {from: factory, to: timingdata, label: "creates"}
  - {from: codec, to: timingdata, label: "encode / decode"}
  - {from: provider, to: reference, label: "default"}
  - {from: provider, to: alternate, label: "alternative"}
