diagram:
  id: timingdata-interchange-model
  title: Figure IF05-01 — TimingData semantics to development-v1 JSON Lines
  width: 1500
  height: 650
  description: IF-05 semantic values are mapped by the reference design to compact JSON members and one-record-per-line JSON Lines framing.
  note: Java classes, factories, providers, storage classes and application execution are outside this interface-design figure.

groups:
  - id: semantics
    label: 32-05-ISD semantic contract
    kind: layer-domain
    layout: {x: 55, y: 105, w: 410, h: 465}

  - id: json
    label: 33-05-IDD development-v1 JSON record
    kind: layer-application
    layout: {x: 545, y: 105, w: 420, h: 465}

  - id: framing
    label: 33-05-IDD JSON Lines framing
    kind: layer-infrastructure
    layout: {x: 1045, y: 105, w: 400, h: 465}

nodes:
  - id: semantic-record
    label: TimingData record
    kind: model
    group: semantics
    layout: {x: 105, y: 165, w: 310, h: 330}
    items:
      - Node ID
      - sequence number
      - Location ID
      - record family
      - effective time
      - Registration ID
      - recorded time
      - "(Node ID, sequence) stable key"

  - id: json-record
    label: Compact JSON object
    kind: model
    group: json
    layout: {x: 595, y: 165, w: 320, h: 330}
    items:
      - "v"
      - "nodeId"
      - "seqNr"
      - "locId"
      - "recType"
      - "time / regId / code"
      - "recTime"
      - fixed canonical writer order

  - id: jsonl-stream
    label: JSON Lines source stream
    kind: storage
    group: framing
    layout: {x: 1095, y: 165, w: 300, h: 330}
    items:
      - one nodeId per file
      - one complete JSON record per line
      - UTF-8
      - LF canonical / CRLF accepted
      - append-only
      - incomplete trailing line not committed
      - sequence validated during recovery

edges:
  - {from: semantic-record, to: json-record, label: "reference mapping"}
  - {from: json-record, to: jsonl-stream, label: "one record per line"}
