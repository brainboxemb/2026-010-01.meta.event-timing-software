diagram:
  id: timingdata-interchange-model
  title: Figure IF05-01 — TimingData semantics to development-v1 JSON Lines
  # Keep this figure compact: it is embedded at document width, so excessive
  # canvas whitespace makes the protocol text unnecessarily small.
  width: 1280
  height: 500
  description: IF-05 always-present and record-type-dependent values are mapped by the reference design to compact JSON members and JSON Lines framing.
  note: Java classes, factories, providers, storage classes and application execution are outside this interface-design figure.

groups:
  - id: semantics
    label: 32-05-ISD semantic contract
    kind: layer-domain
    layout: {x: 30, y: 85, w: 380, h: 350}

  - id: json
    label: 33-05-IDD development-v1 JSON record
    kind: layer-application
    layout: {x: 450, y: 85, w: 380, h: 350}

  - id: framing
    label: 33-05-IDD JSON Lines framing
    kind: layer-infrastructure
    layout: {x: 870, y: 85, w: 380, h: 350}

nodes:
  - id: semantic-record
    label: TimingData record
    kind: model
    group: semantics
    layout: {x: 55, y: 135, w: 330, h: 255}
    items:
      - "Always — Node ID"
      - "Always — sequence number"
      - "Always — Location ID"
      - "Always — record type"
      - "By type — Registration ID"
      - "By type — time"
      - "By type — code"
      - "Node ID + sequence identify record"

  - id: json-record
    label: Compact JSON object
    kind: model
    group: json
    layout: {x: 475, y: 135, w: 330, h: 255}
    items:
      - "Always — v"
      - "Always — nodeId"
      - "Always — seqNr"
      - "Always — locId"
      - "Always — recType"
      - "By type — time / regId / code"
      - "Optional — recTime"
      - fixed canonical writer order

  - id: jsonl-stream
    label: JSON Lines source stream
    kind: storage
    group: framing
    layout: {x: 895, y: 135, w: 330, h: 255}
    items:
      - one nodeId per file
      - one complete JSON record per line
      - UTF-8
      - LF canonical / CRLF accepted
      - append-only
      - incomplete trailing line not committed
      - sequence validated during recovery

edges:
  - {from: semantic-record, to: json-record, label: "reference mapping"}
  - {from: json-record, to: jsonl-stream, label: "one record per line"}
