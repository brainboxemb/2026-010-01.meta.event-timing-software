  type: sequence
  title: Figure SDD01-TD06 — Generic TimingNode producer
  width: 1220
  height: 760
  description: Later domain producers call TimingNode; LogBook owns the asynchronous recording and persistence lane.
  note: Exact start, penalty and correction record families remain deferred.

participants:
  - {id: producer, label: Domain producer, kind: model}
  - {id: node, label: TimingNode, kind: model}
  - {id: logbook, label: "LogBook\nbounded queue + worker", kind: model}
  - {id: store, label: "TimingDataStore\nfile persistence / recovery", kind: storage}

messages:
  - {from: producer, to: node, label: "record fact", kind: call}
  - {from: node, to: logbook, label: "record(entry)", kind: async}
  - {from: node, to: producer, label: accepted, kind: return}
  - {from: logbook, to: store, label: append IF-05 record, kind: call}
  - {from: store, to: logbook, label: durable, kind: return}
