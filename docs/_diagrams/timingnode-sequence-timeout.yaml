  - {from: api, to: client, label: "timeout — outcome unknown", kind: return}
  - {from: node, to: node, label: "worker later executes OPEN", kind: call}
  - {from: node, to: node, label: "state = OPEN; Future completes", kind: call}
  - {from: client, to: api, label: STATUS, kind: call}
