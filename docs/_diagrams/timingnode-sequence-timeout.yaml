diagram:
  id: timingnode-sequence-timeout
  type: sequence
  title: Figure SDD01-TD09 — Timeout and state re-query
  width: 1360
  height: 1110
  description: A caller stops waiting before queued OPEN finishes. Accepted work is not automatically cancelled, so the caller later re-queries TimingNode state.
  note: Timeout reports an unknown outcome to that caller. It is not OpenResult.REJECTED and does not imply rollback.

participants:
  - {id: client, label: Operator / Development Client, kind: client}
  - {id: api, label: Application / TimingNodeProxy, kind: interface}
  - {id: node, label: TimingNode, kind: model}

