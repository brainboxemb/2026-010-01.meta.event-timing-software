diagram:
  id: timingnode-sequence-timeout
  type: sequence
  title: Figure SDD01-TD09 — Lifecycle-history failure does not roll back runtime state
  width: 1360
  height: 1110
  description: TimingNode applies OPEN, but the separately submitted NODE_OPEN history record later fails to commit.
  note: The persistence failure is reported separately. It does not change the already applied OPEN runtime state.

participants:
  - {id: client, label: Operator / Development Client, kind: client}
  - {id: api, label: Application / TimingNodeProxy, kind: interface}
  - {id: node, label: TimingNode, kind: model}

messages:
  - {from: client, to: api, label: OPEN, kind: call}
  - {from: api, to: node, label: "open(locationId)", kind: call}
  - {from: node, to: node, label: "admission lock: state = OPEN + submit NODE_OPEN", kind: call}
  - {from: node, to: api, label: "OpenResult.OPENED", kind: return}
  - {from: api, to: client, label: OPENED, kind: return}
  - {from: node, to: node, label: "LogBook persistence later fails; report problem", kind: async}
  - {from: client, to: api, label: STATUS, kind: call}
  - {from: api, to: node, label: "status()", kind: call}
  - {from: node, to: api, label: "TimingNodeStatus.OPEN", kind: return}
  - {from: api, to: client, label: OPEN, kind: return}
