diagram:
  id: system-device-network-topology
  title: System device and network topology
  width: 1540
  height: 940
  note: System-level deployment and interface relationships; SI-01 adapter/service internals belong in the SI-01 SAD.

groups:
  - id: field
    label: Field timing system
    kind: layer-application
    layout: {x: 70, y: 105, w: 650, h: 730}
  - id: local-network
    label: Local operator / display network
    kind: layer-presentation
    layout: {x: 750, y: 105, w: 470, h: 730}
  - id: external-network
    label: External connectivity
    kind: layer-crosscutting
    layout: {x: 1250, y: 105, w: 250, h: 730}

nodes:
  - id: si01
    label: "SI-01 Headless Timing Application\nauthoritative local timing runtime"
    kind: core
    group: field
    layout: {x: 235, y: 180, w: 330, h: 95}

  - id: rfid
    label: "RFID subsystem\nreader / antennas"
    kind: external
    group: field
    layout: {x: 115, y: 400, w: 250, h: 85}

  - id: can
    label: "CAN devices\nkeypad + Display V1"
    kind: external
    group: field
    layout: {x: 410, y: 400, w: 250, h: 85}

  - id: local-storage
    label: "Local persistent state"
    kind: storage
    group: field
    layout: {x: 260, y: 625, w: 280, h: 75}

  - id: lan
    label: "Local LAN / Wi-Fi router"
    kind: external
    group: local-network
    layout: {x: 835, y: 180, w: 300, h: 80}

  - id: si02
    label: "SI-02 Desktop GUI"
    kind: client
    group: local-network
    layout: {x: 790, y: 385, w: 190, h: 75}

  - id: si03
    label: "SI-03 Web / iPad"
    kind: client
    group: local-network
    layout: {x: 1000, y: 385, w: 190, h: 75}

  - id: display2
    label: "Smart Display V2\nIP / Wi-Fi client"
    kind: external
    group: local-network
    layout: {x: 875, y: 610, w: 250, h: 85}

  - id: internet
    label: "Internet / 4G uplink"
    kind: external
    group: external-network
    layout: {x: 1275, y: 250, w: 200, h: 75}

  - id: backoffice
    label: "Backoffice system"
    kind: external
    group: external-network
    layout: {x: 1275, y: 535, w: 200, h: 80}

edges:
  - from: rfid
    to: si01
    label: IF-07
    from_anchor: {side: top, position: 0.50}
    to_anchor: {side: left, position: 0.65}

  - from: can
    to: si01
    label: IF-08
    from_anchor: {side: top, position: 0.50}
    to_anchor: {side: right, position: 0.65}

  - from: si01
    to: local-storage
    label: local state
    from_anchor: {side: bottom, position: 0.50}
    to_anchor: {side: top, position: 0.50}

  - from: si01
    to: lan
    label: network services
    from_anchor: {side: right, position: 0.35}
    to_anchor: {side: left, position: 0.40}

  - from: si02
    to: lan
    label: IF-03
    from_anchor: {side: top, position: 0.50}
    to_anchor: {side: bottom, position: 0.25}

  - from: si03
    to: lan
    label: IF-03
    from_anchor: {side: top, position: 0.50}
    to_anchor: {side: bottom, position: 0.75}

  - from: display2
    to: lan
    label: IF-09
    from_anchor: {side: top, position: 0.50}
    to_anchor: {side: bottom, position: 0.50}

  - from: lan
    to: internet
    label: uplink
    dashed: true
    from_anchor: {side: right, position: 0.35}
    to_anchor: {side: left, position: 0.50}

  - from: si01
    to: backoffice
    label: IF-06
    dashed: true
    route:
      - {x: 690, y: 330}
      - {x: 1225, y: 330}
      - {x: 1225, y: 575}
    from_anchor: {side: right, position: 0.75}
    to_anchor: {side: left, position: 0.50}
