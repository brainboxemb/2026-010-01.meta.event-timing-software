diagram:
  id: timingdata-sequence-query-isolation
  type: sequence
  title: Figure SDD01-TD05 — LogBook query isolation
  width: 1700
  height: 980
  description: A query uses a short LogBook read view while the LogBook worker persists another registration independently.
  note: The query calculation does not occupy the LogBook record worker.

participants:
  - {id: client, label: Query caller, kind: client}
  - {id: query, label: Query / StageTiming, kind: service}
  - {id: logbook, label: "LogBook\nbounded queue + worker", kind: model}
  - {id: producer, label: Registration producer, kind: model}
  - {id: node, label: TimingNode, kind: model}
  - {id: store, label: "TimingDataStore\nfile persistence / recovery", kind: storage}

messages:
  - {from: client, to: query, label: calculate, kind: call}
  - {from: query, to: logbook, label: capture read view, kind: call}
  - {from: logbook, to: query, label: view, kind: return}
  - {from: producer, to: node, label: "register(...)", kind: call}
  - {from: node, to: logbook, label: "record(registration)", kind: async}
  - {from: node, to: producer, label: accepted, kind: return}
  - {from: logbook, to: store, label: append next record, kind: call}
  - {from: store, to: logbook, label: durable, kind: return}
  - {from: query, to: client, label: result, kind: return}
