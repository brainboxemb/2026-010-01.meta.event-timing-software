diagram:
  id: timingdata-sequence-query-isolation
  type: sequence
  title: Figure SDD01-TD05 — LogBook query isolation
  width: 1450
  height: 1160
  description: A consistency-sensitive query captures its read view through the TimingNode serial lane, then performs long calculation outside the lane while later registrations continue.
  note: The query never reads LogBook directly from outside TimingNode ownership.

participants:
  - {id: client, label: Query caller, kind: client}
  - {id: query, label: Query / StageTiming, kind: service}
  - {id: node, label: TimingNode, kind: model}
  - {id: logbook, label: "LogBook\ncommitted TimingData", kind: model}
  - {id: producer, label: Registration producer, kind: model}
  - {id: store, label: "TimingDataStore\nfile persistence / recovery", kind: storage}

messages:
  - {from: client, to: query, label: calculate, kind: call}
  - {from: query, to: node, label: "captureTimingView()", kind: call}
  - {from: node, to: node, label: "queue query + hidden Future", kind: async}
  - {from: node, to: node, label: "worker executes consistency-sensitive read", kind: call}
  - {from: node, to: logbook, label: "copy immutable record references", kind: call}
  - {from: logbook, to: node, label: "stable read view", kind: return}
  - {from: node, to: query, label: "immutable TimingView", kind: return}
  - {from: producer, to: node, label: "submit registration work", kind: call}
  - {from: node, to: producer, label: ACCEPTED, kind: return}
  - {from: node, to: node, label: "worker processes later registration", kind: call}
  - {from: node, to: store, label: "append(record N)", kind: call}
  - {from: store, to: node, label: durable, kind: return}
  - {from: node, to: logbook, label: "add(record N)", kind: call}
  - {from: logbook, to: node, label: visible, kind: return}
  - {from: query, to: query, label: "calculate(TimingView)", kind: call}
  - {from: query, to: client, label: result, kind: return}
