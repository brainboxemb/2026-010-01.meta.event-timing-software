diagram:
  id: runtime-dispatch-process
  title: SI-01 runtime ingress — Waypoint state ownership
  width: 1580
  height: 930
  description: Process view of concurrent ingress, boundary-owned target resolution and per-Waypoint serialized state ownership.
  note: Messages are used at asynchronous/ownership boundaries. Direct Java calls remain normal inside an executing Waypoint state lane.

groups:
  - id: ingress
    label: Concurrent ingress
    kind: layer-presentation
    layout: {x: 60, y: 110, w: 330, h: 690}

  - id: runtime
    label: Application / Waypoint ownership
    kind: layer-application
    layout: {x: 430, y: 110, w: 790, h: 690}

  - id: execution
    label: Execution resources
    kind: layer-platform
    layout: {x: 1260, y: 110, w: 260, h: 690}

nodes:
  - id: operator-ingress
    label: "Operator / presentation ingress\nHTTP • shell • console"
    kind: presentation
    group: ingress
    layout: {x: 100, y: 190, w: 250, h: 85}

  - id: device-ingress
    label: "Device / integration callbacks\nRFID • CAN • backoffice"
    kind: integration
    group: ingress
    layout: {x: 100, y: 365, w: 250, h: 85}

  - id: timer-ingress
    label: "Scheduled triggers\ncallback submits to owning target"
    kind: platform
    group: ingress
    layout: {x: 100, y: 540, w: 250, h: 85}

  - id: command-handler
    label: "CommandHandler\nshared application command boundary • target resolution"
    kind: application
    group: runtime
    layout: {x: 520, y: 165, w: 610, h: 90}

  - id: waypoint-01
    label: "Waypoint waypoint-01\nserialized state lane • bounded FIFO\napplication/domain handlers"
    kind: model
    group: runtime
    layout: {x: 505, y: 365, w: 300, h: 105}

  - id: waypoint-02
    label: "Waypoint waypoint-02\nserialized state lane • bounded FIFO\napplication/domain handlers"
    kind: model
    group: runtime
    layout: {x: 845, y: 365, w: 300, h: 105}

  - id: snapshots
    label: "Immutable published snapshots\nstatus / presentation reads"
    kind: application
    group: runtime
    layout: {x: 675, y: 675, w: 300, h: 70}

  - id: state-executor
    label: "Shared state ExecutorService\n1 worker in constrained profile\nconfigurable >1 for independent Waypoints"
    kind: platform
    group: execution
    layout: {x: 1300, y: 260, w: 180, h: 125}

  - id: io-rule
    label: "Blocking I/O / scheduler rule\noutside the state lane\ncompletion returns to owning Waypoint"
    kind: platform
    group: execution
    layout: {x: 1300, y: 500, w: 180, h: 125}

edges:
  - from: operator-ingress
    to: command-handler
    label: transport-neutral command
    from_anchor: {side: right, position: 0.50}
    to_anchor: {side: left, position: 0.50}

  - from: command-handler
    to: waypoint-01
    label: target waypoint-01
    from_anchor: {side: bottom, position: 0.28}
    to_anchor: {side: top, position: 0.50}

  - from: command-handler
    to: waypoint-02
    label: target waypoint-02
    from_anchor: {side: bottom, position: 0.72}
    to_anchor: {side: top, position: 0.50}

  - from: device-ingress
    to: waypoint-01
    label: configured target
    from_anchor: {side: right, position: 0.50}
    to_anchor: {side: left, position: 0.45}

  - from: timer-ingress
    to: waypoint-02
    label: owning target
    from_anchor: {side: right, position: 0.50}
    to_anchor: {side: left, position: 0.75}
    route:
      - {x: 420, y: 582}
      - {x: 825, y: 582}
      - {x: 825, y: 444}

  - from: waypoint-01
    to: snapshots
    label: publish
    dashed: true
    from_anchor: {side: bottom, position: 0.65}
    to_anchor: {side: top, position: 0.30}

  - from: waypoint-02
    to: snapshots
    label: publish
    dashed: true
    from_anchor: {side: bottom, position: 0.35}
    to_anchor: {side: top, position: 0.70}

  - from: waypoint-01
    to: state-executor
    dashed: true
    from_anchor: {side: right, position: 0.25}
    to_anchor: {side: left, position: 0.35}
    route:
      - {x: 1190, y: 391}
      - {x: 1190, y: 304}

  - from: waypoint-02
    to: state-executor
    dashed: true
    from_anchor: {side: right, position: 0.75}
    to_anchor: {side: left, position: 0.70}
    route:
      - {x: 1215, y: 444}
      - {x: 1215, y: 348}

  - from: io-rule
    to: waypoint-02
    label: completion / failure
    dashed: true
    from_anchor: {side: left, position: 0.50}
    to_anchor: {side: right, position: 0.75}
