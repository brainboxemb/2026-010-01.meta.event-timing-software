diagram:
  id: timingnode-sequence-open-close
  type: sequence
  title: Figure SDD01-TD08 — Concurrent OPEN and CLOSE ordering
  width: 1360
  height: 1020
  description: OPEN and CLOSE are serialized by TimingNode operation/state ownership. Each applied transition submits its lifecycle-history command while registration admission is excluded.
  note: Runtime state determines registration eligibility; lifecycle-record persistence is separate.

participants:
  - {id: callerA, label: Caller A, kind: client}
  - {id: callerB, label: Caller B, kind: client}
  - {id: node, label: TimingNode, kind: model}

messages:
  - {from: callerA, to: node, label: "open(location-01)", kind: call}
  - {from: node, to: node, label: "operation/admission lock: state = OPEN; queue NODE_OPEN", kind: call}
  - {from: node, to: callerA, label: "OpenResult.OPENED", kind: return}
  - {from: callerB, to: node, label: "close()", kind: call}
  - {from: node, to: node, label: "operation/admission lock: state = CLOSED; queue NODE_CLOSE", kind: call}
  - {from: node, to: callerB, label: "CloseResult.CLOSED", kind: return}
