diagram:
  id: system-overview
  title: Headless timing application — component and interface overview
  width: 1520
  height: 1030
  description: Existing architecture overview migrated from hard-coded Python semantics to declarative YAML.

groups: []

nodes:
  - {id: console, label: "Local console", kind: client, layout: {x: 40, y: 90, w: 190, h: 70}}
  - {id: remote, label: "Remote terminal", kind: client, layout: {x: 250, y: 90, w: 190, h: 70}}
