diagram:
  id: timingdata-sequence-auto-registration
  type: sequence
  title: Figure SDD01-TD03 — Automatic RFID registration
  width: 1420
  height: 800
  description: TagProcessor calls its TimingNode; LogBook queues and persists the resulting registration asynchronously.
  note: The bounded queue and record worker are internal to LogBook.

participants:
  - {id: antenna, label: RFID adapter, kind: integration}
  - {id: tag, label: TagProcessor, kind: model}
  - {id: node, label: TimingNode, kind: model}
  - {id: logbook, label: "LogBook\nbounded queue + worker", kind: model}
  - {id: store, label: "TimingDataStore\nfile persistence / recovery", kind: storage}

messages:
  - {from: antenna, to: tag, label: observation, kind: call}
  - {from: tag, to: node, label: "register(observation)", kind: call}
  - {from: node, to: logbook, label: "record(registration)", kind: async}
  - {from: node, to: tag, label: accepted, kind: return}
  - {from: logbook, to: store, label: append IF-05 record, kind: call}
  - {from: store, to: logbook, label: durable, kind: return}
