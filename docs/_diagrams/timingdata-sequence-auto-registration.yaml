diagram:
  id: timingdata-sequence-auto-registration
  type: sequence
  title: Figure SDD01-TD03 — Automatic RFID registration
  width: 1480
  height: 820
  description: High-level interaction from RFID observation to durable TimingData and committed LogBook state.
  note: Method-level details remain in the SDD pseudocode below the figure.

participants:
  - {id: antenna, label: RFID adapter, kind: integration}
  - {id: tag, label: TagProcessor, kind: model}
  - {id: recorder, label: LogBookRecorder, kind: application}
  - {id: committer, label: LogBookCommitter, kind: application}
  - {id: store, label: TimingDataStore, kind: storage}
  - {id: logbook, label: LogBook, kind: model}

messages:
  - {from: antenna, to: tag, label: observation, kind: call}
  - {from: tag, to: recorder, label: LogBookEntryCandidate, kind: async}
  - {from: recorder, to: committer, label: next candidate, kind: async}
  - {from: committer, to: store, label: append IF-05 record, kind: call}
  - {from: store, to: committer, label: durable, kind: return}
  - {from: committer, to: logbook, label: commit LogBookItem, kind: call}
