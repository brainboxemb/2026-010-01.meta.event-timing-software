<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#5f6368"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="38.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#202124">Figure IF05-01 — TimingData semantics to development-v1 JSON Lines</text>
<text x="30.0" y="68.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">Java classes, factories, providers, storage classes and application execution are outside this interface-design figure.</text>
<rect x="30" y="85" width="380" height="350" rx="10" ry="10" fill="#fff8df" stroke="#d6b656" stroke-width="2"/>
<text x="46.0" y="107.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202124">32-05-ISD semantic contract</text>
<rect x="450" y="85" width="380" height="350" rx="10" ry="10" fill="#eef8ee" stroke="#82b366" stroke-width="2"/>
<text x="466.0" y="107.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202124">33-05-IDD development-v1 JSON record</text>
<rect x="870" y="85" width="380" height="350" rx="10" ry="10" fill="#fff0ee" stroke="#b85450" stroke-width="2"/>
<text x="886.0" y="107.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#202124">33-05-IDD JSON Lines framing</text>
<polyline points="385.0,262.5 475.0,262.5" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="362.0" y="249.5" width="136" height="22" fill="#ffffff" opacity="0.94"/>
<text x="430.0" y="261.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">reference mapping</text>
<polyline points="805.0,262.5 895.0,262.5" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="774.0" y="249.5" width="152" height="22" fill="#ffffff" opacity="0.94"/>
<text x="850.0" y="261.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">one record per line</text>
<rect x="55" y="135" width="330" height="255" rx="8" ry="8" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/>
<text x="220.0" y="158.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">TimingData record</text>
<text x="71.0" y="182.2" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — Node ID</text>
<text x="71.0" y="198.8" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — sequence number</text>
<text x="71.0" y="215.3" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — Location ID</text>
<text x="71.0" y="231.9" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — record type</text>
<text x="71.0" y="248.4" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• By type — Registration ID</text>
<text x="71.0" y="265.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• By type — time</text>
<text x="71.0" y="281.6" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• By type — code</text>
<text x="71.0" y="298.1" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Node ID + sequence identify record</text>
<rect x="475" y="135" width="330" height="255" rx="8" ry="8" fill="#fffaf0" stroke="#d6b656" stroke-width="2"/>
<text x="640.0" y="158.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">Compact JSON object</text>
<text x="491.0" y="182.2" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — v</text>
<text x="491.0" y="198.8" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — nodeId</text>
<text x="491.0" y="215.3" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — seqNr</text>
<text x="491.0" y="231.9" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — locId</text>
<text x="491.0" y="248.4" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Always — recType</text>
<text x="491.0" y="265.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• By type — time / regId / code</text>
<text x="491.0" y="281.6" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• Optional — recTime</text>
<text x="491.0" y="298.1" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• fixed canonical writer order</text>
<rect x="895" y="135" width="330" height="255" rx="8" ry="8" fill="#f4cccc" stroke="#b85450" stroke-width="2"/>
<text x="1060.0" y="158.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#202124">JSON Lines source stream</text>
<text x="911.0" y="182.2" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• one nodeId per file</text>
<text x="911.0" y="198.8" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• one complete JSON record per line</text>
<text x="911.0" y="215.3" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• UTF-8</text>
<text x="911.0" y="231.9" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• LF canonical / CRLF accepted</text>
<text x="911.0" y="248.4" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• append-only</text>
<text x="911.0" y="265.0" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• incomplete trailing line not committed</text>
<text x="911.0" y="281.6" text-anchor="start" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#202124">• sequence validated during recovery</text>
</svg>
